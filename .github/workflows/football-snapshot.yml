# Tiketti #34: Jalkapallosnapshotin ajastus
#
# Miksi tämä on olemassa: GitHub Pages on staattinen hosting, joten selain ei voi
# hakea kertoimia itse (API-avain paljastuisi, CORS estäisi, kuukausikvootta paloisi
# sivulatauksissa). Tämä workflow ajaa putken palvelinpuolella, committoi tuloksen
# ja deployaa sen Pagesiin. Se on koko snapshot-arkkitehtuurin viimeinen palanen.
#
# Kaksi ajoa vuorokaudessa on tarkoituksellista:
#   08:00 UTC — avauslinja
#   14:00 UTC — lähellä iltapäivän aloituksia
# Molemmat tallentuvat erikseen data/history/-kansioon, mikä antaa CLV-mittarille
# (tiketti 33) avaus- ja sulkeutumiskertoimen vertailtavaksi.

name: Jalkapallosnapshot

on:
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch: # manuaalinen ajo

# Vain yksi ajo kerrallaan: kaksi rinnakkaista committia samaan haaraan
# aiheuttaisi push-konfliktin ja toinen ajo hukkaisi datansa.
# Jaettu ryhmä pages-deploy.yml:n kanssa: molemmat kirjoittavat gh-pages-haaraan,
# ja kaksi yhtäaikaista pushia samaan haaraan konfliktoisi. Ryhmä sarjallistaa ne.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # datan commit mainiin + gh-pages-deploy

    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      # Kvoottakatto KERROINHAULLE per ajo (ingestFootballOdds lukee taman).
      #
      # LASKELMA 8 sarjalla (tiketti #65):
      #   Kerroinhaku  1 kr/sarja x 8 sarjaa x 2 ajoa/vrk x 30 pv = 480 kr/kk
      #   Tuloshaku    0 kr -- siirretty ESPN:aan, ks. alla
      #   Yhteensa                                                 480 / 500
      #
      # Katto 12 (ei 8) antaa marginaalin: includeLinks voi nostaa yhden
      # pyynnon hintaa, ja tasan rajalla oleva katto pudottaisi viimeiset
      # sarjat hiljaa pois. Katto suojaa karkaamiselta, ei kirista normaalia.
      ODDS_DAILY_CREDIT_BUDGET: '12'
      # CI:ssä ei ole edellisen ajon välimuistia, ja tuore data on tässä koko pointti
      CACHE_DISABLED: '1'

    steps:
      # fetch-depth: 0 — commit-vaihe tekee `git pull --rebase`, joka tarvitsee
      # historian. Oletuksen matala klooni (depth 1) kaataisi rebasen.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # --ignore-scripts ohittaa playwrightin selainlatauksen (~130 MB).
      # Putki ei käytä selainta — kertoimet ja tilastot tulevat fetchillä.
      - name: Asenna riippuvuudet
        run: npm ci --ignore-scripts

      - name: Tarkista että salaisuudet on asetettu
        run: |
          if [ -z "$ODDS_API_KEY" ]; then
            echo "::error::ODDS_API_KEY puuttuu — aseta se Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "ODDS_API_KEY asetettu (${#ODDS_API_KEY} merkkiä)"
          [ -n "$FOOTBALL_DATA_TOKEN" ] && echo "FOOTBALL_DATA_TOKEN asetettu" || echo "::warning::FOOTBALL_DATA_TOKEN puuttuu — Valioliigan tunnusluvut jäävät hakematta"

      # Yksikkötestit ennen dataa: rikkinäinen malli ei saa tuottaa snapshottia
      # joka näyttää oikealta mutta laskee väärin.
      - name: Aja testit
        run: npm test

      - name: Hae kertoimet ja laske analyysi
        run: npm run snapshot:live

      # Tiketti #45: Valioliigan joukkuetaulukko. Vaatii FOOTBALL_DATA_TOKENin;
      # ei saa kaataa koko ajoa jos sitä ei ole tai football-data.org on hidas.
      - name: Hae Valioliigan joukkuetaulukko
        run: npm run teams:football
        continue-on-error: true

      # Tulokset ENNEN mittareita: mittarit lukevat results.json:n.
      #
      # ESPN eika The Odds API (tiketti #65): /scores maksoi 2 krediittia per
      # sarja eli 8 sarjalla 480 kr/kk, mika olisi vienyt kokonaiskaytön
      # 960:een ja loppunut noin 15 paivassa. ESPN antaa samat tulokset
      # ilmaiseksi. Ottelutunniste haetaan snapshot-historiasta eika johdeta
      # ESPN:n nimesta -- muuten mittarit eivat loytaisi tuloksia ennusteille.
      #
      # Ajetaan joka ajossa koska se on ilmainen.
      - name: Hae päättyneiden otteluiden tulokset
        run: npm run results:espn
        continue-on-error: true # tulosten puuttuminen ei saa kaataa snapshottia

      - name: Laske mittarit
        run: npm run metrics
        continue-on-error: true

      # Tiketti #74: otteluohjelma kaikille seuratuille sarjoille.
      # Lahde on ESPN eika The Odds API, joten tama EI kuluta kvoottaa.
      # Aikajana lukee taman; ilman sita se putoaa vanhaan paivanavigointiin.
      - name: Rakenna otteluohjelmakalenteri
        run: npm run fixtures
        continue-on-error: true

      # Tiketti #75: kerroinhistoria on KUMULATIIVINEN. Se luetaan ja
      # kirjoitetaan samassa ajossa, ja committoidaan muun datan mukana --
      # Actions ei sailyta mitaan ajojen valilla.
      - name: Paivita kerroinhistoria
        run: npm run odds:history
        continue-on-error: true

      # Tiketti #76: kierrosarviointi. Tarvitsee seka kerroinhistorian etta
      # kalenterin (ESPN-ID:t maaliaikajanaa varten), joten se ajetaan
      # molempien jalkeen.
      - name: Arvioi ratkenneet kierrokset
        run: npm run reviews
        continue-on-error: true

      # Tiketti #73: Telegram-halytys vahvoista ylikertoimista.
      #
      # Tila (public/data/alerts-sent.json) committoidaan muun datan mukana --
      # Actions ei sailyta mitaan ajojen valilla, ja ilman muistia sama kohde
      # halyttaisi molemmilla paivittaisilla ajoilla.
      #
      # Ilman salaisuuksia askel kirjaa syyn eika kaadu: halytys on lisa, ei
      # ehto datan julkaisulle.
      - name: Lähetä Telegram-hälytykset
        run: npm run alerts:football
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        continue-on-error: true

      - name: Yhteenveto ajosta
        run: |
          if [ ! -f public/data/today.json ]; then
            echo "::warning::today.json puuttuu — ei otteluita aikaikkunassa?"
            exit 0
          fi
          node -e "
            const s = require('./public/data/today.json');
            const flagged = s.matches.filter(m => m.analysis.edges.some(e => e.flag !== 'none'));
            const modes = {};
            s.matches.forEach(m => modes[m.model.method] = (modes[m.model.method] || 0) + 1);
            console.log('Otteluita:', s.matches.length, '| sarjat:', s.leagues.join(', '));
            console.log('Lähteet:', s.providers.join(' + '));
            console.log('Mallitilat:', JSON.stringify(modes));
            console.log('Value-kohteita:', flagged.length);
            for (const m of flagged) {
              const best = m.analysis.edges.reduce((a, b) => b.edge > a.edge ? b : a);
              console.log('  ' + (best.flag === 'strong' ? '[VAHVA]' : '[kandidaatti]'),
                m.home.name, 'vs', m.away.name, '—', best.side,
                '@', best.odds.toFixed(2), '(' + best.book + ')',
                'edge', (best.edge * 100).toFixed(1) + '%');
            }
          "

      - name: Committoi data
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data
          if git diff --cached --quiet; then
            echo "Data ei muuttunut — ei committia"
          else
            STAMP=$(node -e "console.log(require('./public/data/today.json').generated_at)")
            COUNT=$(node -e "console.log(require('./public/data/today.json').matches.length)")
            git commit -m "Data: $COUNT ottelua, snapshot $STAMP [skip ci]"
            # Rebase varmuuden vuoksi: main on voinut edetä ajon aikana
            git pull --rebase --autostash origin main
            git push origin HEAD:main
            echo "Data committoitu ja työnnetty"
          fi

      - name: Deployaa GitHub Pagesiin
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          enable_jekyll: false
          force_orphan: false
          commit_message: 'Deploy: jalkapallosnapshot'

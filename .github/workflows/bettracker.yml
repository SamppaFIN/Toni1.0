# BetTracker — Scheduled Pipeline
# Cron toistaiseksi pois päältä (ei live-secretsejä, ei toimivaa datalähdettä).
# Otetaan käyttöön kun: Supabase + Odds API + RSS-syötteet on konfiguroitu.

name: BetTracker Pipeline

on:
  # schedule:  # <-- POIS PÄÄLTÄ kunnes ympäristö on valmis
  #   - cron: '0 6 * * *'
  #   - cron: '0 18 * * *'
  workflow_dispatch: # manuaalinen ajo testausta varten

jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # tarvitaan gh-pages deployhin

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run pipeline
        run: npm run pipeline

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          enable_jekyll: false
          force_orphan: false

<title>BetTracker — Demo</title>
<style>
/* === BetTracker Design System — OKLCH + Fluid + Glass === */
:root{
  --c-bg: oklch(0.12 0.02 260);
  --c-surface: oklch(0.17 0.02 260);
  --c-surface-hover: oklch(0.22 0.03 260);
  --c-text: oklch(0.92 0.01 260);
  --c-text-muted: oklch(0.55 0.02 260);
  --c-accent: oklch(0.62 0.18 240);
  --c-success: oklch(0.62 0.20 145);
  --c-danger: oklch(0.52 0.22 25);
  --c-warning: oklch(0.72 0.16 85);
  --c-orange: oklch(0.58 0.18 50);
  --radius-sm: 8px; --radius-md: clamp(10px, 2vw, 16px); --radius-pill: 20px;
  --shadow-card: 0 1px 3px rgba(0,0,0,.4);
  --shadow-elevated: 0 4px 16px rgba(0,0,0,.5);
  --touch-target: 44px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:100%;-webkit-text-size-adjust:100%}
body{
  font-family:system-ui,-apple-system,sans-serif;
  background:var(--c-bg);color:var(--c-text);
  padding:0;max-width:500px;margin:0 auto;padding-bottom:80px;
  line-height:1.5;font-size:clamp(0.875rem, 1.5vw, 1rem);
}
/* Glass header */
.glass-header{
  position:sticky;top:0;z-index:100;
  background:oklch(0.12 0.02 260 / 0.85);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding:clamp(8px,2vw,12px) clamp(12px,3vw,16px);
  border-bottom:1px solid oklch(1 0 0 / 0.06);
  text-align:center;
}
.glass-header h1{font-size:clamp(1rem,3vw,1.3rem);font-weight:800;letter-spacing:-0.02em}
.demo-badge{display:inline-block;background:var(--c-warning);color:#000;font-size:clamp(0.55rem,1vw,0.65rem);padding:1px 8px;border-radius:var(--radius-pill);font-weight:700;margin-left:6px;vertical-align:middle}
/* Bankroll bar */
.bankroll-bar{
  position:sticky;top:clamp(48px,8vw,56px);z-index:99;
  background:var(--c-surface);padding:clamp(6px,1.5vw,10px) clamp(10px,2vw,14px);
  display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid oklch(1 0 0 / 0.04);
}
.bankroll-amount{font-weight:800;font-size:clamp(1rem,2.5vw,1.2rem)}
.bankroll-amount.positive{color:var(--c-success)}.bankroll-amount.negative{color:var(--c-danger)}
/* Tabs — horizontal scroll */
.tabs{display:flex;gap:4px;padding:clamp(6px,1.5vw,10px);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex-shrink:0;min-height:var(--touch-target);
  padding:6px clamp(8px,2vw,14px);
  background:var(--c-surface);border:none;color:var(--c-text-muted);
  border-radius:var(--radius-sm);cursor:pointer;
  font-size:clamp(0.65rem,1.2vw,0.75rem);font-weight:500;white-space:nowrap;
  transition:all .2s ease;
}
.tab:hover{background:var(--c-surface-hover);color:var(--c-text)}
.tab.active{background:var(--c-accent);color:#000;font-weight:600}
/* Views */
.view{display:none;padding:clamp(8px,2vw,12px);animation:fadeIn .25s ease}
.view.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
/* Cards */
.card{
  background:var(--c-surface);border-radius:var(--radius-md);
  padding:clamp(10px,2.5vw,14px);margin-bottom:clamp(6px,1.5vw,10px);
  box-shadow:var(--shadow-card);
  border:1px solid oklch(1 0 0 / 0.04);
  transition:transform .15s ease,box-shadow .15s ease;
}
.card:hover{transform:translateY(-1px);box-shadow:var(--shadow-elevated)}
.row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
/* Badges */
.badge{font-size:clamp(0.55rem,1vw,0.65rem);padding:2px 8px;border-radius:var(--radius-pill);font-weight:600}
.badge-green{background:var(--c-success);color:#000}.badge-yellow{background:var(--c-warning);color:#000}.badge-red{background:var(--c-danger);color:#fff}.badge-muted{background:var(--c-text-muted);color:#fff}.badge-orange{background:var(--c-orange);color:#fff}
/* Metrics */
.metric{font-size:clamp(1.1rem,3vw,1.4rem);font-weight:800;font-variant-numeric:tabular-nums}
.metric-label{font-size:clamp(0.6rem,1vw,0.7rem);color:var(--c-text-muted)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:clamp(6px,1.5vw,8px)}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
/* Team logo */
.team-logo{width:clamp(24px,6vw,32px);height:clamp(24px,6vw,32px);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:clamp(0.55rem,1.5vw,0.7rem);color:#fff;flex-shrink:0}
.matchup{display:flex;align-items:center;gap:6px;font-size:clamp(0.8rem,1.5vw,0.9rem)}
.matchup .vs{margin:0 2px;color:var(--c-text-muted);font-size:0.7em}
/* Odds buttons */
.odds-btn{
  min-height:var(--touch-target);padding:6px 8px;border-radius:var(--radius-sm);
  border:1.5px solid oklch(1 0 0 / 0.12);background:transparent;
  color:var(--c-text);cursor:pointer;text-align:center;
  transition:all .15s ease;font-size:clamp(0.7rem,1.2vw,0.8rem);
}
.odds-btn:hover{background:var(--c-accent);color:#000;border-color:var(--c-accent);transform:translateY(-1px)}
.odds-btn:active{transform:scale(0.97)}
.odds-btn .odds-val{font-weight:700;display:block;font-variant-numeric:tabular-nums}
.odds-btn .odds-label{font-size:0.7em;color:var(--c-text-muted)}
/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:var(--touch-target);padding:10px clamp(14px,3vw,20px);
  border-radius:var(--radius-sm);border:none;font-weight:600;cursor:pointer;
  font-size:clamp(0.75rem,1.5vw,0.85rem);
  transition:all .15s ease;
}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-elevated)}
.btn:active{transform:scale(0.97)}
.btn-primary{background:var(--c-accent);color:#000}.btn-danger{background:var(--c-danger);color:#fff}.btn-success{background:var(--c-success);color:#000}.btn-block{display:flex;width:100%}
/* Input */
.input-group{margin:8px 0}.input-group label{display:block;font-size:clamp(0.65rem,1vw,0.75rem);color:var(--c-text-muted);margin-bottom:4px}
.input-group input{width:100%;min-height:var(--touch-target);padding:8px 12px;border-radius:var(--radius-sm);border:1.5px solid oklch(1 0 0 / 0.12);background:var(--c-bg);color:var(--c-text);font-size:clamp(0.8rem,1.2vw,0.9rem);transition:border-color .15s ease}
.input-group input:focus{outline:none;border-color:var(--c-accent);box-shadow:0 0 0 3px oklch(0.62 0.18 240 / 0.2)}
/* Progress bar */
.progress-bar{height:clamp(3px,1vw,5px);background:oklch(1 0 0 / 0.08);border-radius:3px;margin-top:4px;overflow:hidden;display:flex}.progress-fill{height:100%;transition:width .3s ease}
.fill-home{background:var(--c-accent)}.fill-draw{background:var(--c-warning)}.fill-away{background:var(--c-danger)}
/* Sim game details */
.goal-list{font-size:clamp(0.65rem,1vw,0.75rem);color:var(--c-text-muted);margin-top:6px;line-height:1.6}
.penalty-row{font-size:clamp(0.6rem,1vw,0.7rem);color:var(--c-orange);margin-top:4px}
/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--c-surface);border:1px solid oklch(1 0 0 / 0.1);color:var(--c-text);padding:12px 24px;border-radius:var(--radius-pill);font-weight:600;font-size:clamp(0.75rem,1.2vw,0.85rem);z-index:9999;box-shadow:var(--shadow-elevated);animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateX(-50%) translateY(16px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
.empty{text-align:center;padding:32px 16px;color:var(--c-text-muted);font-style:italic;font-size:clamp(0.8rem,1.2vw,0.9rem)}
/* Pressure toggle */
.pressure-toggle{
  min-height:var(--touch-target);padding:6px 14px;border-radius:var(--radius-pill);
  border:1.5px dashed oklch(1 0 0 / 0.15);background:transparent;
  color:var(--c-text-muted);cursor:pointer;font-size:clamp(0.6rem,1vw,0.7rem);
  transition:all .2s ease;margin:2px;
}
.pressure-toggle:hover{border-color:var(--c-orange);color:var(--c-text)}
.pressure-toggle.active{background:var(--c-orange);color:#fff;border-color:var(--c-orange);font-weight:700;box-shadow:0 0 12px oklch(0.58 0.18 50 / 0.3)}
.factor-badge{display:inline-block;padding:1px 6px;border-radius:8px;background:oklch(1 1 0 / 0.06);margin:1px 2px;cursor:help;font-weight:500}
/* Modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:oklch(0 0 0 / 0.7);backdrop-filter:blur(4px);z-index:1000;display:none;align-items:center;justify-content:center;animation:fadeIn .2s ease}
/* a11y */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
:focus-visible{outline:2px solid var(--c-accent);outline-offset:2px}
</style>
</head>

function teamNameElo(id){const t=teams.find(x=>x.id===id);if(!t)return'Joukkue '+id;const r=getRating(id);return t.name+(r?' ('+r.elo.toFixed(0)+')':' ('+id+')')}
function updateEloAfterSim(){
  if(!simResults||!simResults.length)return;
  const K=32;
  simResults.forEach(r=>{
    const hR=getRating(r.home_team_id);const aR=getRating(r.away_team_id);
    if(!hR||!aR)return;
    const E_h=1/(1+Math.pow(10,(aR.elo-(hR.elo+40))/400));
    let S_h=r.home_score>r.away_score?1:r.home_score<r.away_score?0:0.5;
    const d=K*(S_h-E_h);hR.elo+=d;aR.elo-=d;
  });
  localStorage.setItem('bt_ratings',JSON.stringify(ratings));
}

      const actual=`${home} ${r.home_score} - ${r.away_score} ${away}`;
      const winnerLabel=r.home_score>r.away_score?`${home} voitti`:r.away_score>r.home_score?`${away} voitti`:'Tasapeli';
      const net=b.won?b.stake*b.odds-b.stake:0;

  }
  html+='<div style="font-size:.65rem;color:var(--c-text-muted);margin-top:6px">📊 Elo-päivitykset tallennettu — siirrytään seuraavalle kierrokselle 8s kuluttua...</div></div>';

async function loadData(){
  try{
    const[g,t,p,v,o,r,n]=await Promise.all([fetch(API+'/games').then(r=>r.json()),fetch(API+'/teams').then(r=>r.json()),fetch(API+'/game_predictions').then(r=>r.json()),fetch(API+'/value_flags').then(r=>r.json()),fetch(API+'/odds_snapshots').then(r=>r.json()),fetch(API+'/team_ratings').then(r=>r.json()),fetch(API+'/news_events').then(r=>r.json())]);
    games=g;teams=t;predictions=p;valueFlags=v;oddsSnapshots=o;ratings=r;news=n||[];
  }catch(e){
    console.warn('API unreachable, using embedded fallback data');
    const fb=FALLBACK;
    teams=fb.teams;games=fb.games;predictions=fb.predictions;valueFlags=fb.valueFlags;oddsSnapshots=fb.oddsSnapshots;ratings=fb.teamRatings;news=fb.newsEvents;
    const sr=localStorage.getItem('bt_ratings');if(sr)ratings=JSON.parse(sr);
  }
}

function valueForGame(gid,side){
  const vf=valueFlags.find(f=>f.game_id===gid);
  if(!vf)return null;
  const o=getOdds(gid);if(!o)return null;
  const p=getPred(gid);if(!p)return null;
  if(side==='home'){return{mp:p.home_win_prob,ip:1/o.home_odds/(1/o.home_odds+1/o.draw_odds+1/o.away_odds),edge:p.home_win_prob*o.home_odds-1}}
  if(side==='draw'){return{mp:p.draw_prob,ip:1/o.draw_odds/(1/o.home_odds+1/o.draw_odds+1/o.away_odds),edge:p.draw_prob*o.draw_odds-1}}
  if(side==='away'){return{mp:p.away_win_prob,ip:1/o.away_odds/(1/o.home_odds+1/o.draw_odds+1/o.away_odds),edge:p.away_win_prob*o.away_odds-1}}
  return null;
}

  if(hPdo>102)factors.push({l:`📈 ${home} ylisuorittaa`,c:'var(--c-orange)',t:`PDO ${hPdo.toFixed(1)} — regressoituu kohti 100`});
  if(aPdo>102)factors.push({l:`📈 ${away} ylisuorittaa`,c:'var(--c-orange)',t:`PDO ${aPdo.toFixed(1)} — regressoituu kohti 100`});
  if(hPdo<98)factors.push({l:`📉 ${home} alisuorittaa`,c:'oklch(0.52 0.22 25)',t:`PDO ${hPdo.toFixed(1)} — todennäköinen nousu tulossa`});
  if(aPdo<98)factors.push({l:`📉 ${away} alisuorittaa`,c:'oklch(0.52 0.22 25)',t:`PDO ${aPdo.toFixed(1)} — todennäköinen nousu tulossa`});
  const injuryCount=news.filter(e=>e.confidence>0.7&&(e.team_id===g.home_team_id||e.team_id===g.away_team_id)).length;

    const border=isStrong?'oklch(0.62 0.20 145)':isValue?'oklch(0.62 0.20 145 / 0.5)':edge<-0.03?'oklch(0.52 0.22 25 / 0.5)':'';
    const title=`Mallin tn: ${(modelProb*100).toFixed(1)}% | Markkinan tn: ${(impliedProb*100).toFixed(1)}% | Edge: ${(edge*100).toFixed(1)}%`;
    return`<button class="odds-btn" style="background:${bg};border-color:${border}" onclick="event.stopPropagation();showBetPopup(${g.id},'${side}',${oddsVal})" title="${title}"><span class="odds-val">${oddsVal.toFixed(2)}</span><span class="odds-label">${side==='home'?'1':side==='draw'?'X':'2'}</span></button>`;
  }

  let oh='';let ph='';
  if(pred.home_win_prob){const h=(pred.home_win_prob*100).toFixed(0),d=(pred.draw_prob*100).toFixed(0),a=(pred.away_win_prob*100).toFixed(0);
    ph=`<div style="font-size:.7rem;margin-top:4px"><span>Malli: ${h}% / ${d}% / ${a}%</span></div><div class="progress-bar"><span class="progress-fill fill-home" style="width:${h}%"></span><span class="progress-fill fill-draw" style="width:${d}%"></span><span class="progress-fill fill-away" style="width:${a}%"></span></div>`}
  if(odds&&homeV&&drawV&&awayV)oh=`<div class="grid-3" style="margin-top:6px">${oddsBtn('home',odds.home_odds,homeV.mp,homeV.ip,homeV.edge)}${oddsBtn('draw',odds.draw_odds,drawV.mp,drawV.ip,drawV.edge)}${oddsBtn('away',odds.away_odds,awayV.mp,awayV.ip,awayV.edge)}</div>`;
  else if(odds)oh=`<div class="grid-3" style="margin-top:6px"><span class="odds-btn" style="cursor:default"><span class="odds-val">${odds.home_odds.toFixed(2)}</span><span class="odds-label">1</span></span><span class="odds-btn" style="cursor:default"><span class="odds-val">${odds.draw_odds.toFixed(2)}</span><span class="odds-label">X</span></span><span class="odds-btn" style="cursor:default"><span class="odds-val">${odds.away_odds.toFixed(2)}</span><span class="odds-label">2</span></span></div>`;

  // Show bets already placed for this game

  if(gameBets.length){

function closeAnalysis(){analysisGameId=null;renderRound()}
function buildAnalysis(g){
  const home=teamName(g.home_team_id),away=teamName(g.away_team_id);
  const hR=getRating(g.home_team_id),aR=getRating(g.away_team_id);
  const hElo=hR?.elo||1500,aElo=aR?.elo||1500;
  const hPdo=hR?.pdo||100,aPdo=aR?.pdo||100;
  const odds=getOdds(g.id);const pred=getPred(g.id)||{};
  const vf=valueFlags.find(f=>f.game_id===g.id);
  const eloDiff=hElo-aElo;const hAdv=40;const totalDiff=eloDiff+hAdv;
  const pHome=1/(1+Math.pow(10,-totalDiff/400));
  const pDraw=Math.max(0.12,0.26-Math.abs(totalDiff)/1500);
  const pAway=1-pHome-pDraw;
  let ipHome=null,ipDraw=null,ipAway=null,edgeHome=null,edgeAway=null,edgeDraw=null,margin=null;
  if(odds){
    const sum=1/odds.home_odds+1/odds.draw_odds+1/odds.away_odds;
    margin=((sum-1)*100).toFixed(1);
    ipHome=(1/odds.home_odds)/sum;ipDraw=(1/odds.draw_odds)/sum;ipAway=(1/odds.away_odds)/sum;
    edgeHome=pHome*odds.home_odds-1;edgeDraw=pDraw*odds.draw_odds-1;edgeAway=pAway*odds.away_odds-1;
  }
  const injuries=news.filter(e=>e.confidence>0.5&&(e.team_id===g.home_team_id||e.team_id===g.away_team_id));
  let html='';
  html+=`<div class="card" style="border:2px solid var(--c-accent);margin-bottom:8px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><button class="btn" style="font-size:.7rem;padding:5px 12px;min-height:32px;background:oklch(1 1 0/0.1);color:var(--c-text)" onclick="closeAnalysis()">← Takaisin kierrokseen</button><span style="font-weight:700;font-size:.9rem">📊 ${home} vs ${away}</span></div>`;
  // Section 1: Elo comparison + formula
  html+=`<div style="margin-bottom:10px;padding:10px;background:oklch(1 1 0/0.04);border-radius:8px"><h4 style="font-size:.8rem;margin-bottom:6px">📈 Elo-voimaestimaatti & voittotodennäköisyys</h4>
    <div class="row" style="font-size:.75rem;margin:4px 0"><span>${home}: <b>${hElo.toFixed(0)}</b></span><span>${away}: <b>${aElo.toFixed(0)}</b></span></div>
    <div style="font-size:.7rem;color:var(--c-text-muted);line-height:1.7;margin-top:4px">
      ΔElo = ${hElo.toFixed(0)} − ${aElo.toFixed(0)} = <b style="color:${eloDiff>0?'var(--c-success)':'var(--c-danger)'}">${eloDiff>0?'+':''}${eloDiff.toFixed(0)} pt</b> (${eloDiff>0?home:away} hyväksi)<br>
      + kotietu H = ${hAdv} pt → kokonaisero = <b>${Math.abs(totalDiff).toFixed(0)} pt</b><br>
      <br><b>Kaava:</b> P(koti) = 1 / (1 + 10<sup>−(R<sub>K</sub>+H−R<sub>V</sub>)/400</sup>)<br>
      = 1 / (1 + 10<sup>−(${hElo.toFixed(0)}+${hAdv}−${aElo.toFixed(0)})/400</sup>)<br>
      = 1 / (1 + 10<sup>−${totalDiff.toFixed(0)}/400</sup>) = <b style="color:var(--c-accent)">${(pHome*100).toFixed(1)}%</b><br>
      P(taso) = max(12%, 26% − |Δ|/1500) = <b>${(pDraw*100).toFixed(1)}%</b><br>
      P(vieras) = 1 − P(koti) − P(taso) = <b>${(pAway*100).toFixed(1)}%</b>
    </div>
    <div class="progress-bar" style="margin-top:6px;height:8px"><span class="progress-fill fill-home" style="width:${(pHome*100).toFixed(0)}%"></span><span class="progress-fill fill-draw" style="width:${(pDraw*100).toFixed(0)}%"></span><span class="progress-fill fill-away" style="width:${(pAway*100).toFixed(0)}%"></span></div>
    <div style="display:flex;justify-content:space-between;font-size:.65rem;color:var(--c-text-muted);margin-top:2px"><span>1: ${(pHome*100).toFixed(1)}%</span><span>X: ${(pDraw*100).toFixed(1)}%</span><span>2: ${(pAway*100).toFixed(1)}%</span></div>
  </div>`;

      <div style="font-size:.7rem;color:var(--c-text-muted);margin-bottom:6px">Markkinan marginaali: <b>${margin}%</b> (kirjanpitäjän kate). Implikoitu tn = (1/kerroin) / sum(1/kertoimet).</div>

      html+=`<div style="font-size:.7rem;padding:4px 0;border-bottom:1px dashed oklch(1 1 0/0.1)"><b>${t}</b>: ${typeLabel} (varmuus ${(e.confidence*100).toFixed(0)}%)<br><span style="color:var(--c-text-muted);font-size:.6rem">Lähde: ${e.source_url||newsSources[Math.floor(Math.random()*newsSources.length)]}</span></div>`;

  // Section 6: What a pro bettor tracks
  html+=`<div style="padding:10px;background:oklch(1 1 0/0.04);border-radius:8px"><h4 style="font-size:.8rem;margin-bottom:6px">🧠 Mitä ammattimainen vedonlyöjä seuraa?</h4>
    <div style="font-size:.65rem;color:var(--c-text-muted);line-height:1.7">
      <div>🏒 <b>Elo</b> — pitkän aikavälin voimaestimaatti, reagoi hitaasti (K=32). Paras perusmittari.</div>

      <div>💰 <b>Kelly-kriteeri</b> — optimipanos = (bp−q)/b. Murto-Kelly (25–50%) käytännössä.</div>

}

function renderSimGame(r){
  const h=teamName(r.home_team_id),a=teamName(r.away_team_id);
  const ot=r.period>3?' (JA/RL)':'';
  const periodLbl=r.winner===null?(r.period===1?'1. erä käynnissä':r.period===2?'2. erä käynnissä':r.period===3?'3. erä käynnissä':'Jatkoaika käynnissä'):'';
  const periodHtml=periodLbl?`<div style="font-size:.6rem;color:var(--c-accent);font-weight:600;margin-bottom:2px">⏱️ ${periodLbl}</div>`:'';

  let pe='';if(r.penalties&&r.penalties.length)pe='<div class="penalty-row">🚨 '+r.penalties.map(p=>`${p.team_short} ${p.min}min (${p.reason})`).join(' | ')+'</div>';
  let pp='';if(r.pp_goals_home!=null)pp=`<div style="font-size:.65rem;color:var(--muted);margin-top:3px">YV: ${h} ${r.pp_goals_home}/${r.pp_chances_home} — ${a} ${r.pp_goals_away}/${r.pp_chances_away}</div>`;
  const w=r.home_score>r.away_score?'fill-home':r.away_score>r.home_score?'fill-away':'fill-draw';
  return `<div class="card">${periodHtml}<div class="row"><span class="matchup">${teamLogo(teams.find(t=>t.id===r.home_team_id),22)} ${teamNameElo(r.home_team_id)}</span><span style="font-size:1.2rem;font-weight:800">${r.home_score} - ${r.away_score}${ot}</span><span class="matchup">${teamNameElo(r.away_team_id)} ${teamLogo(teams.find(t=>t.id===r.away_team_id),22)}</span></div><div class="progress-bar" style="margin-top:6px;height:6px"><span class="progress-fill ${w}" style="width:${r.home_score/(r.home_score+r.away_score||1)*100}%"></span></div>${sc}${pe}${pp}<div style="font-size:.65rem;color:var(--muted);margin-top:3px">🏟️ Laukaukset: ${teamNameElo(r.home_team_id)} ${r.shots_home||0} - ${r.shots_away||0} ${teamNameElo(r.away_team_id)}</div></div>`;
}

function setStake(gid,amount){

}

function confirmPopupBet(gid,side,odds){
  const stake=parseFloat(document.getElementById('popstake-'+gid)?.value||'0');
  if(!stake||stake<=0||stake>bankroll){toast('⚠️ Virheellinen panos');return}
  bankroll-=stake;bets.push({id:Date.now(),game_id:gid,side,odds,stake});
  save();updateBankroll();renderRound();renderSlip();updateSlipBadge();
  document.getElementById('betpop-'+gid).style.display='none';
  toast(`✅ Veto: ${side.toUpperCase()} ${stake.toFixed(2)}€ @ ${odds.toFixed(2)}`)
}

function placeBet(gid,side,odds){
  if(simResults){toast('⚠️ Kierros simuloitu — käynnistä uudelleen');return}
  const stake=parseFloat(prompt(`Panos (€) — ${side.toUpperCase()} @ ${odds.toFixed(2)}`,'10'));
  if(!stake||stake<=0||stake>bankroll){toast('⚠️ Virheellinen panos');return}
  bankroll-=stake;bets.push({id:Date.now(),game_id:gid,side,odds,stake});
  save();updateBankroll();renderSlip();updateSlipBadge();toast(`✅ Veto: ${side.toUpperCase()} ${stake.toFixed(2)}€ @ ${odds.toFixed(2)}`)
}
function clearSlip(){bets.forEach(b=>bankroll+=b.stake);bets=[];save();updateBankroll();renderSlip();updateSlipBadge();toast('🗑️ Lappu tyhjennetty')}
function removeBet(betId){const idx=bets.findIndex(b=>b.id===betId);if(idx===-1)return;bankroll+=bets[idx].stake;bets.splice(idx,1);save();updateBankroll();renderSlip();updateSlipBadge();renderRound();toast('🗑️ Veto poistettu')}
function renderSlip(){
  const l=document.getElementById('slip-list'),m=document.getElementById('slip-metrics');
  if(!bets.length){l.innerHTML='<div class="empty">Ei vetoja — palaa Kierros-välilehdelle</div>';m.innerHTML='';return}

  m.innerHTML=`<div class="card"><div class="metric-label">Panokset</div><div class="metric">${ts.toFixed(2)}€</div></div><div class="card"><div class="metric-label">Mahd. voitto</div><div class="metric" style="color:var(--c-success)">${pw.toFixed(2)}€</div></div>`;
  l.innerHTML=bets.map(b=>{const g=getGame(b.game_id);const sl=b.side==='home'?teamName(g?.home_team_id):b.side==='away'?teamName(g?.away_team_id):'Tasapeli';return`<div class="card"><div class="row"><strong>${sl}</strong><span class="badge badge-yellow">${b.odds.toFixed(2)}</span><button class="btn btn-danger" style="font-size:.55rem;padding:2px 6px;min-height:22px;border-radius:12px" onclick="removeBet(${b.id})">✕</button></div><div class="row" style="font-size:.7rem;color:var(--c-text-muted)"><span>${teamNameElo(g?.home_team_id)} vs ${teamNameElo(g?.away_team_id)}</span><span>Panos: ${b.stake.toFixed(2)}€</span></div></div>`}).join('')}
function updateSlipBadge(){const e=document.getElementById('slip-count');e.textContent=bets.length?`(${bets.length})`:''}

function runSimulation(){
  if(!bets.length){toast('⚠️ Aseta ensin vetoja Kierros-välilehdellä');return}
  switchTab('tracker');
  const b=document.getElementById('sim-btn');
  b.textContent='🏒 Pelipäivä käynnissä...';b.className='btn btn-primary btn-block';b.disabled=true;

  const upcoming=games.filter(g=>g.status==='upcoming');
  simResults=upcoming.map(g=>({
    game_id:g.id,home_team_id:g.home_team_id,away_team_id:g.away_team_id,
    home_score:0,away_score:0,winner:null,period:1,
    scorers:[],penalties:[],shots_home:0,shots_away:0,
    pp_chances_home:0,pp_chances_away:0,pp_goals_home:0,pp_goals_away:0
  }));
  renderTrackerLive();
  let elapsed=0;
  const totalTime=20;
  const goalsPerSec=0.7; // ~14 goals across 5 games in 20s (~2.8 per game)

  simInterval=setInterval(()=>{
    elapsed++;
    if(Math.random()<goalsPerSec){
      const gameIdx=Math.floor(Math.random()*simResults.length);
      const g=simResults[gameIdx];
      const isHome=Math.random()<(pressureTeam===String(g.home_team_id)?0.7:pressureTeam===String(g.away_team_id)?0.3:0.55);
      if(isHome)g.home_score++;else g.away_score++;
      const homePlayers=['Lehterä','Savinainen','Tanus','Keskinen','Puhakka','Räsänen','Mäenalanen','Kemiläinen'];
      const awayPlayers=['Suomi','Ikonen','Turunen','Tyrväinen','Nurmi','Oksanen','Ruohomaa','Palve'];
      const pname=isHome?homePlayers[Math.floor(Math.random()*homePlayers.length)]:awayPlayers[Math.floor(Math.random()*awayPlayers.length)];
      g.scorers.push({player:pname,team:teamName(isHome?g.home_team_id:g.away_team_id),period:g.period,time:`${g.period}.erä ${String(20-Math.floor(elapsed/3)).padStart(2,'0')}:${String(Math.floor(Math.random()*60)).padStart(2,'0')}`});
      g.shots_home+=Math.floor(Math.random()*4)+1;g.shots_away+=Math.floor(Math.random()*4)+1;
      if(Math.random()<0.2){
        const reasons=['Koukkaaminen','Kampitus','Kiinnipitäminen','Poikittainen maila'];
        g.penalties.push({team_short:isHome?teamName(g.away_team_id).substring(0,3).toUpperCase():teamName(g.home_team_id).substring(0,3).toUpperCase(),min:2,reason:reasons[Math.floor(Math.random()*reasons.length)]});
        if(isHome)g.pp_chances_home++;else g.pp_chances_away++;
      }
      // Resolve next_goal bets for this game
      const ngBets=bets.filter(b=>b.game_id===g.game_id&&b.type==='next_goal');
      ngBets.forEach(b=>{
        const won=(b.side==='home'&&isHome)||(b.side==='away'&&!isHome);
        const profit=won?b.stake*b.odds:0;
        bankroll+=profit;
        betHistory.push({...b,won,profit,resolved_at:new Date().toISOString(),game_result:'next_goal'});
        bets=bets.filter(x=>x.id!==b.id);
      });
      if(ngBets.length){save();updateBankroll();updateSlipBadge();renderSlip();}
      renderTrackerLive();
    }
    if(elapsed===6||elapsed===12){simResults.forEach(g=>g.period=elapsed===6?2:3)}
    if(elapsed===17){simResults.forEach(g=>{if(g.home_score===g.away_score)g.period=4})}
    b.textContent=`🏒 Pelipäivä käynnissä... ${totalTime-elapsed}s`;
    if(elapsed>=totalTime){
      clearInterval(simInterval);simInterval=null;b.disabled=false;
      simResults.forEach(g=>{
        g.winner=g.home_score>g.away_score?'home':g.away_score>g.home_score?'away':'draw';
        g.shots_home=Math.max(g.shots_home,20+Math.floor(Math.random()*15));
        g.shots_away=Math.max(g.shots_away,20+Math.floor(Math.random()*15));
      });
      resolveBets();updateEloAfterSim();save();
      b.textContent='🔄 Käynnistä uudelleen';b.className='btn btn-primary btn-block';
      renderRoundReport();
      toast('🏒 Pelipäivä pelattu!');
      simAdvanceTimer=setTimeout(()=>{advanceRound();},8000);
    }
  },1000);
}

function renderTrackerLive(){
  let html=simResults.map(r=>{
    let card=renderSimGame(r);
    const stillLive=r.winner===null;
    // Build extras to inject before closing card div
    let extras='';
    // Quick bet buttons if still live
    if(stillLive){
      extras+=`<div style="margin-top:6px;display:flex;gap:4px"><button class="btn" style="flex:1;font-size:.6rem;padding:5px 4px;min-height:28px;background:oklch(0.62 0.18 240 / 0.2);color:var(--c-text);border-radius:6px" onclick="quickBetNextGoal(${r.game_id},'home')">⚡ ${teamName(r.home_team_id)} seuraava maali 10€</button><button class="btn" style="flex:1;font-size:.6rem;padding:5px 4px;min-height:28px;background:oklch(0.62 0.20 145 / 0.2);color:var(--c-text);border-radius:6px" onclick="quickBetNextGoal(${r.game_id},'away')">⚡ ${teamName(r.away_team_id)} seuraava maali 10€</button></div>`;
    }
    // Show bets for this game
    const gameBets=bets.filter(b=>b.game_id===r.game_id);
    if(gameBets.length){
      extras+='<div style="margin-top:4px;padding-top:4px;border-top:1px dashed oklch(1 1 0/0.1);font-size:.65rem">'+gameBets.map(b=>{
        const sl=b.side==='home'?teamName(getGame(b.game_id)?.home_team_id):b.side==='away'?teamName(getGame(b.game_id)?.away_team_id):'Tasapeli';
        const tag=b.type==='next_goal'?' ⚡':'';
        return`<div class="row"><span>🎫 ${sl}${tag} ${b.stake.toFixed(0)}€ @ ${b.odds.toFixed(2)}</span><span style="color:var(--c-success)">→ ${(b.stake*b.odds).toFixed(0)}€</span></div>`;
      }).join('')+'</div>';
    }
    if(extras){
      const idx=card.lastIndexOf('</div>');
      card=card.substring(0,idx)+extras+card.substring(idx);
    }
    return card;
  }).join('');
  document.getElementById('tracker-list').innerHTML=html;
}

function advanceRound(){
  if(!simResults||!simResults.length)return;
  updateEloAfterSim();
  const nextRoundNum=(parseInt(localStorage.getItem('bt_round')||'1'))+1;
  localStorage.setItem('bt_round',String(nextRoundNum));
  // Shuffle teams for new matchups
  const teamIds=teams.map(t=>t.id);
  const shuffled=[...teamIds].sort(()=>Math.random()-0.5);
  const newGames=[];
  for(let i=0;i<5;i++){
    const hid=shuffled[i*2],aid=shuffled[i*2+1];
    if(!hid||!aid)continue;
    newGames.push({id:100+nextRoundNum*10+(i+1),date:new Date(Date.now()+86400000*(i+1)).toISOString(),home_team_id:hid,away_team_id:aid,home_score:null,away_score:null,status:'upcoming'});
  }
  // Generate new odds based on current Elo
  const newOdds=[];
  newGames.forEach(g=>{
    const hElo=getRating(g.home_team_id)?.elo||1500,aElo=getRating(g.away_team_id)?.elo||1500;
    const hP=1/(1+Math.pow(10,(aElo-(hElo+40))/400));
    const dP=Math.max(0.12,0.26-Math.abs(hElo+40-aElo)/1500);
    const aP=1-hP-dP;
    const m=1.05;
    newOdds.push({id:Date.now()+g.id,game_id:g.id,bookmaker:'Demo',market:'1X2',home_odds:+(m/hP).toFixed(2),draw_odds:+(m/dP).toFixed(2),away_odds:+(m/aP).toFixed(2),fetched_at:new Date().toISOString()});
  });
  // Generate new predictions
  const newPreds=[];
  newGames.forEach(g=>{
    const hElo=getRating(g.home_team_id)?.elo||1500,aElo=getRating(g.away_team_id)?.elo||1500;
    const hp=1/(1+Math.pow(10,(aElo-(hElo+40))/400));
    const dp=Math.max(0.12,0.26-Math.abs(hElo+40-aElo)/1500);
    const ap=1-hp-dp;
    const pw=hp>ap?'home':ap>hp?'draw':'draw';
    newPreds.push({id:Date.now()+g.id+100,game_id:g.id,home_win_prob:+hp.toFixed(4),draw_prob:+dp.toFixed(4),away_win_prob:+ap.toFixed(4),predicted_winner:pw,predicted_at:new Date().toISOString(),actual_winner:null,was_correct:null});
  });
  // Generate value flags
  const newFlags=[];
  newGames.forEach(g=>{
    const o=newOdds.find(x=>x.game_id===g.id);
    const p=newPreds.find(x=>x.game_id===g.id);
    if(!o||!p)return;
    ['home','draw','away'].forEach(side=>{
      const oddsVal=side==='home'?o.home_odds:side==='draw'?o.draw_odds:o.away_odds;
      const modelProb=side==='home'?p.home_win_prob:side==='draw'?p.draw_prob:p.away_win_prob;
      const ip=(1/oddsVal)/(1/o.home_odds+1/o.draw_odds+1/o.away_odds);
      const edge=modelProb*oddsVal-1;
      if(edge>0.03)newFlags.push({id:Date.now()+g.id+200+Math.random(),game_id:g.id,market:'1X2',model_prob:+modelProb.toFixed(4),implied_prob:+ip.toFixed(4),edge:+edge.toFixed(4),triggering_news_event_id:null,created_at:new Date().toISOString()});
    });
  });
  // Replace data
  games=[...games.filter(g=>g.status==='finished'),...newGames];
  oddsSnapshots=[...oddsSnapshots.filter(o=>!newGames.find(ng=>ng.id===o.game_id&&o.bookmaker==='Demo')),...newOdds];
  predictions=[...predictions.filter(p=>!newGames.find(ng=>ng.id===p.game_id)),...newPreds];
  valueFlags=[...valueFlags.filter(v=>!newGames.find(ng=>ng.id===v.game_id)),...newFlags];
  simResults=null;bets=[];pressureTeam='';
  save();renderAll();switchTab('round');
  toast('📅 Kierros '+nextRoundNum+' ladattu! Uudet kertoimet jaettu, Elot päivitetty.');
}

function resetSimulation(){
  if(simInterval){clearInterval(simInterval);simInterval=null}
  if(simAdvanceTimer){clearTimeout(simAdvanceTimer);simAdvanceTimer=null}
  simResults=null;bets=[];betHistory=[];bankroll=100;pressureTeam='';
  ['bt_ratings','bt_round'].forEach(k=>localStorage.removeItem(k));
  // Full reset: restore all FALLBACK data
  const fb=FALLBACK;teams=fb.teams;games=fb.games;predictions=fb.predictions;valueFlags=fb.valueFlags;oddsSnapshots=fb.oddsSnapshots;ratings=fb.teamRatings;news=fb.newsEvents;
  save();renderAll();switchTab('round');
  toast('🔄 Kaikki nollattu — aloitetaan alusta');
}
function simulateGame(g){
  const he=getRating(g.home_team_id)?.elo||1500,ae=getRating(g.away_team_id)?.elo||1500;
  let ha=40;if(pressureTeam===String(g.home_team_id))ha+=80;if(pressureTeam===String(g.away_team_id))ha-=80;
  const ed=he+ha-ae,hp=1/(1+Math.pow(10,-ed/400)),dp=Math.max(.12,.26-Math.abs(ed)/1500),ap=1-hp-dp;
  const r=Math.random();let w,hs,as;
  if(r<hp){w='home';hs=2+Math.floor(Math.random()*4);as=Math.floor(Math.random()*(hs-1))}
  else if(r<hp+dp){w='draw';hs=as=1+Math.floor(Math.random()*3)}
  else{w='away';as=2+Math.floor(Math.random()*4);hs=Math.floor(Math.random()*(as-1))}
  if(!hs&&!as)hs=1;hs=Math.min(hs,7);as=Math.min(as,7);
  const hp_=['Lehterä','Savinainen','Kemiläinen','Tanus','Puhakka'];const ap_=['Suomi','Turunen','Tyrväinen','Nurmi','Oksanen'];
  const scorers=[];const up=new Set();
  for(let i=0;i<hs;i++){const n=hp_[i%hp_.length];if(!up.has(n)){up.add(n);scorers.push({player:n,team:teamName(g.home_team_id),period:1+Math.floor(Math.random()*3),time:`${1+Math.floor(Math.random()*3)}.erä ${String(1+Math.floor(Math.random()*19)).padStart(2,'0')}:${String(Math.floor(Math.random()*60)).padStart(2,'0')}`})}}
  for(let i=0;i<as;i++){const n=ap_[i%ap_.length];if(!up.has(n)){up.add(n);scorers.push({player:n,team:teamName(g.away_team_id),period:1+Math.floor(Math.random()*3),time:`${1+Math.floor(Math.random()*3)}.erä ${String(1+Math.floor(Math.random()*19)).padStart(2,'0')}:${String(Math.floor(Math.random()*60)).padStart(2,'0')}`})}}
  const reasons=['Koukkaaminen','Kampitus','Kiinnipitäminen','Poikittainen maila','Korkea maila'];const np=1+Math.floor(Math.random()*5);const penalties=[];
  for(let i=0;i<np;i++)penalties.push({team_short:Math.random()>.5?teamName(g.home_team_id).substring(0,3).toUpperCase():teamName(g.away_team_id).substring(0,3).toUpperCase(),min:[2,2,2,2,5][Math.floor(Math.random()*5)],reason:reasons[Math.floor(Math.random()*reasons.length)]});
  const hn=teamName(g.home_team_id).substring(0,3);const pph=penalties.filter(p=>!p.team_short.startsWith(hn)).length,ppa=penalties.filter(p=>p.team_short.startsWith(hn)).length;
  return{game_id:g.id,home_team_id:g.home_team_id,away_team_id:g.away_team_id,home_score:hs,away_score:as,winner:w,period:3,scorers:scorers.sort((a,b)=>a.period-b.period),penalties,pp_chances_home:pph,pp_chances_away:ppa,pp_goals_home:Math.min(pph,Math.floor(Math.random()*(pph+1))),pp_goals_away:Math.min(ppa,Math.floor(Math.random()*(ppa+1))),shots_home:20+Math.floor(Math.random()*20),shots_away:20+Math.floor(Math.random()*20)}
}
function resolveBets(){
  bets.forEach(b=>{const r=simResults.find(r=>r.game_id===b.game_id);if(!r)return;const won=(b.side==='home'&&r.winner==='home')||(b.side==='away'&&r.winner==='away')||(b.side==='draw'&&r.winner==='draw');const profit=won?b.stake*b.odds:0;bankroll+=profit;betHistory.push({...b,won,profit,resolved_at:new Date().toISOString(),game_result:`${r.home_score}-${r.away_score}`})});
  bets=[]
}

function showBankrollModal(){document.getElementById('bankroll-modal').style.display='flex'}
function closeBankrollModal(){document.getElementById('bankroll-modal').style.display='none'}
function deposit(){const a=parseFloat(document.getElementById('deposit-amount').value);if(!a||a<=0)return;bankroll+=a;save();updateBankroll();closeBankrollModal();toast(`💰 Talletettu ${a.toFixed(2)}€`)}
function withdraw(){const a=parseFloat(document.getElementById('deposit-amount').value);if(!a||a>bankroll){toast('⚠️ Ei tarpeeksi varoja');return}bankroll-=a;save();updateBankroll();closeBankrollModal();toast(`💸 Nostettu ${a.toFixed(2)}€`)}

function renderHistory(){
  const l=document.getElementById('history-list'),m=document.getElementById('history-metrics');
  if(!betHistory.length){l.innerHTML='<div class="empty">Ei historiaa — simuloi pelipäivä ensin</div>';return}
  const won=betHistory.filter(b=>b.won).length;const tp=betHistory.reduce((s,b)=>s+(b.won?b.stake*b.odds-b.stake:-b.stake),0);const ts=betHistory.reduce((s,b)=>s+b.stake,0);const roi=ts>0?(tp/ts*100).toFixed(1):'0';
  m.innerHTML=`<div class="card"><div class="metric-label">Vetoja</div><div class="metric">${betHistory.length}</div></div><div class="card"><div class="metric-label">Osumia</div><div class="metric">${won} (${(won/betHistory.length*100).toFixed(0)}%)</div></div><div class="card"><div class="metric-label">Tulos</div><div class="metric" style="color:${tp>=0?'var(--green)':'var(--red)'}">${tp>=0?'+':''}${tp.toFixed(2)}€</div></div><div class="card"><div class="metric-label">ROI</div><div class="metric">${roi}%</div></div>`;
  l.innerHTML=betHistory.slice().reverse().map(b=>{const g=getGame(b.game_id);const sl=b.side==='home'?teamName(g?.home_team_id):b.side==='away'?teamName(g?.away_team_id):'Tasapeli';const cls=b.won?'badge-green':'badge-red';return`<div class="card"><div class="row"><strong>${sl}</strong><span class="badge ${cls}">${b.won?'✅ Voitto':'❌ Häviö'}</span></div><div class="row" style="font-size:.7rem;color:var(--muted);margin-top:3px"><span>${teamNameElo(g?.home_team_id)} vs ${teamNameElo(g?.away_team_id)} (${b.game_result})</span><span style="color:${b.won?'var(--green)':'var(--red)'}">${b.won?'+':''}${(b.won?b.stake*b.odds-b.stake:-b.stake).toFixed(2)}€</span></div><div class="row" style="font-size:.65rem;color:var(--muted)"><span>Panos ${b.stake.toFixed(2)}€ @ ${b.odds.toFixed(2)}</span><span>${new Date(b.resolved_at).toLocaleDateString('fi')}</span></div></div>`}).join('')
}
function renderTeams(){
  const l=document.getElementById('teams-list');if(!ratings.length){l.innerHTML='<div class="empty">Ei joukkuetietoja</div>';return}
  l.innerHTML=[...ratings].sort((a,b)=>b.elo-a.elo).map((t,i)=>{const n=teamName(t.team_id);const pCls=t.pdo>102?'badge-green':t.pdo<98?'badge-red':'badge-muted';const pLbl=t.pdo>102?'Yli':t.pdo<98?'Ali':'Norm';return`<div class="card"><div class="row"><div class="matchup">${teamLogo(teams.find(x=>x.id===t.team_id),22)} <strong>#${i+1} ${n}</strong></div><span style="font-weight:700">Elo: ${t.elo.toFixed(0)}</span></div><div class="row" style="font-size:.7rem;color:var(--muted);margin-top:3px"><span>PDO: ${t.pdo?.toFixed(1)||'—'} <span class="badge ${pCls}">${pLbl}</span></span><span>${t.date}</span></div></div>`}).join('')}
function renderInfo(){
  document.getElementById('info-content').innerHTML=`<div class="card"><h3>ℹ️ Tervetuloa BetTrackeriin!</h3><p style="font-size:.8rem;line-height:1.5;color:var(--muted);margin-top:8px">BetTracker on Liiga-vedonlyönnin value-analyysijärjestelmä. Se auttaa tunnistamaan tilanteet, joissa vedonlyöntimarkkina on hinnoitellut kohteen väärin.</p></div>
<div class="card"><h3>💎 Value-flagit</h3><p style="font-size:.75rem;line-height:1.5;color:var(--muted);margin-top:4px"><b>Edge > 3 %</b> = ylikerroinkandidaatti (keltainen)<br><b>Edge > 5 %</b> = vahva signaali (vihreä)<br>Edge = mallin todennäköisyys × kerroin − 1. Positiivinen edge tarkoittaa, että vedonlyöntikohde on aliarvostettu.</p></div>
<div class="card"><h3>📊 Mittarit</h3><p style="font-size:.75rem;line-height:1.5;color:var(--muted);margin-top:4px"><b>Elo</b> — jatkuvasti päivittyvä voimaestimaatti (1500 = keskiarvo).<br><b>PDO</b> — yli-/alisuorituksen mittari. >102 = ylisuorittaa, <98 = alisuorittaa. Regressoituu aina kohti 100.<br><b>Z-score</b> — pelaajan kuumuusmittari. |z| > 1.5 = selvä poikkeama omasta normaalista.</p></div>
<div class="card"><h3>🎮 Demon käyttö</h3><p style="font-size:.75rem;line-height:1.5;color:var(--muted);margin-top:4px">1. Valitse 📅 Kierros -välilehti<br>2. Klikkaa kertoimia lyödäksesi vetoa<br>3. Valitse halutessasi joukkue joka 🔥 painaa päälle<br>4. Paina ▶️ Käynnistä pelipäivän simulaatio<br>5. Katso tulokset ja 📜 Historia-välilehti</p></div>`
}
function renderAdmin(){
  const supabaseUrl=localStorage.getItem('bt_supabase_url')||'';const supabaseKey=localStorage.getItem('bt_supabase_key')||'';const oddsKey=localStorage.getItem('bt_odds_key')||'';
  document.getElementById('admin-content').innerHTML=`<div class="card"><h3>⚙️ API-asetukset</h3><p style="font-size:.7rem;color:var(--muted);margin-bottom:8px">Demo-tilassa asetukset tallentuvat selaimeen. Tuotannossa käytetään ympäristömuuttujia.</p>
<div class="input-group"><label>Supabase URL</label><input type="text" id="admin-supabase-url" value="${supabaseUrl}" placeholder="https://xxx.supabase.co"></div>
<div class="input-group"><label>Supabase Anon Key</label><input type="text" id="admin-supabase-key" value="${supabaseKey}" placeholder="eyJh..."></div>
<div class="input-group"><label>Odds API Key</label><input type="text" id="admin-odds-key" value="${oddsKey}" placeholder="abc123..."></div>
<div style="display:flex;gap:6px;margin-top:8px"><button class="btn btn-primary" style="flex:1" onclick="saveAdmin()">💾 Tallenna</button><button class="btn btn-danger" style="flex:1" onclick="resetAdmin()">🔄 Palauta</button></div></div>`
}
function saveAdmin(){localStorage.setItem('bt_supabase_url',document.getElementById('admin-supabase-url').value);localStorage.setItem('bt_supabase_key',document.getElementById('admin-supabase-key').value);localStorage.setItem('bt_odds_key',document.getElementById('admin-odds-key').value);toast('💾 Asetukset tallennettu')}
function resetAdmin(){['bt_supabase_url','bt_supabase_key','bt_odds_key'].forEach(k=>localStorage.removeItem(k));toast('🔄 Asetukset palautettu');renderAdmin()}

function toast(msg){const e=document.createElement('div');e.className='toast';e.textContent=msg;document.body.appendChild(e);setTimeout(()=>e.remove(),2000)}

function switchTab(name){
  analysisGameId=null;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelector(`[data-tab="${name}"]`).classList.add('active');document.getElementById(name).classList.add('active');
  if(name==='round')renderRound();if(name==='slip')renderSlip();if(name==='tracker')renderTracker();if(name==='history')renderHistory();if(name==='teams')renderTeams();if(name==='info')renderInfo();if(name==='admin')renderAdmin()
}
function renderAll(){renderRound();renderSlip();renderTracker();renderHistory();renderTeams();renderInfo();renderAdmin();updateBankroll();updateSlipBadge()}

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>switchTab(t.dataset.tab)));
document.getElementById('bankroll-modal').addEventListener('click',function(e){if(e.target===this)closeBankrollModal()});

loadData().then(()=>{renderAll();updateBankroll();updateSlipBadge()});
</script>

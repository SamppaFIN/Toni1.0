<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BetTracker — Demo</title>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --text: #e2e8f0;
      --accent: #38bdf8; --green: #22c55e; --red: #ef4444;
      --yellow: #eab308; --muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 12px; max-width: 480px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 12px; }
    h1 { font-size: 1.2rem; }
    .demo-badge { display: inline-block; background: var(--yellow); color: #000; font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; font-weight: 700; margin-left: 8px; vertical-align: middle; }
    .tabs { display: flex; gap: 4px; margin-bottom: 12px; }
    .tab { flex: 1; padding: 8px 4px; background: var(--card); border: none; color: var(--text); border-radius: 8px 8px 0 0; cursor: pointer; font-size: 0.75rem; text-align: center; }
    .tab.active { background: var(--accent); color: var(--bg); font-weight: 600; }
    .view { display: none; }
    .view.active { display: block; }
    .card { background: var(--card); border-radius: 10px; padding: 12px; margin-bottom: 8px; }
    .card h3 { font-size: 0.9rem; margin-bottom: 4px; }
    .row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 4px; }
    .badge { font-size: 0.65rem; padding: 2px 6px; border-radius: 12px; font-weight: 600; }
    .badge-green { background: var(--green); color: #000; }
    .badge-yellow { background: var(--yellow); color: #000; }
    .badge-red { background: var(--red); color: #fff; }
    .badge-muted { background: var(--muted); color: #fff; }
    .metric { font-size: 1.4rem; font-weight: 700; }
    .metric-label { font-size: 0.7rem; color: var(--muted); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .loading { text-align: center; padding: 30px; color: var(--muted); }
    .empty { text-align: center; padding: 30px; color: var(--muted); font-style: italic; }
    .team-name { font-size: 0.85rem; }
    .progress-bar { height: 4px; background: var(--muted); border-radius: 2px; margin-top: 4px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 2px; }
    .fill-home { background: var(--accent); }
    .fill-draw { background: var(--yellow); }
    .fill-away { background: var(--red); }
    .prob-text { font-size: 0.7rem; }
  </style>
</head>
<body>
  <header>
    <h1>🏒 BetTracker <span class="demo-badge">DEMO</span></h1>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="value">💎 Value</button>
    <button class="tab" data-tab="predictions">🎯 Ennusteet</button>
    <button class="tab" data-tab="teams">📊 Joukkueet</button>
  </div>

  <div id="value" class="view active">
    <div class="grid-2" id="metrics"></div>
    <div id="value-list"></div>
  </div>
  <div id="predictions" class="view">
    <div class="grid-2" id="accuracy-metrics"></div>
    <div id="predictions-list"></div>
  </div>
  <div id="teams" class="view">
    <div id="teams-list"></div>
  </div>

  <script>
    const API = '/rest/v1';

    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab).classList.add('active');

        if (tab.dataset.tab === 'value') loadValueFlags();
        if (tab.dataset.tab === 'predictions') loadPredictions();
        if (tab.dataset.tab === 'teams') loadTeams();
      });
    });

    // === Value-flagit ===
    async function loadValueFlags() {
      const res = await fetch(`${API}/value_flags`);
      const data = await res.json();
      const list = document.getElementById('value-list');
      const metrics = document.getElementById('metrics');

      if (!data.length) { list.innerHTML = '<div class="empty">Ei value-flageja — odotetaan dataa...</div>'; return; }

      const strong = data.filter(f => f.edge > 0.05).length;
      metrics.innerHTML = `
        <div class="card"><div class="metric-label">Flageja</div><div class="metric">${data.length}</div></div>
        <div class="card"><div class="metric-label">Vahvoja (&gt;5%)</div><div class="metric">${strong}</div></div>`;

      list.innerHTML = data.map(f => {
        const cls = f.edge > 0.05 ? 'badge-green' : 'badge-yellow';
        return `<div class="card">
          <div class="row"><strong>${f.market}</strong><span class="badge ${cls}">${(f.edge*100).toFixed(1)}% edge</span></div>
          <div class="row" style="margin-top:4px; font-size:0.75rem; color:var(--muted)">
            <span>Malli: ${(f.model_prob*100).toFixed(0)}%</span>
            <span>Markkina: ${(f.implied_prob*100).toFixed(0)}%</span>
          </div>
        </div>`;
      }).join('');
    }

    // === Ennusteet ===
    async function loadPredictions() {
      const res = await fetch(`${API}/game_predictions`);
      const data = await res.json();
      const list = document.getElementById('predictions-list');
      const metrics = document.getElementById('accuracy-metrics');

      if (!data.length) { list.innerHTML = '<div class="empty">Ei ennusteita...</div>'; return; }

      const resolved = data.filter(p => p.was_correct !== null);
      const correct = resolved.filter(p => p.was_correct).length;
      const rate = resolved.length ? (correct/resolved.length*100).toFixed(1) : '—';

      metrics.innerHTML = `
        <div class="card"><div class="metric-label">Osumatarkkuus</div><div class="metric">${rate === '—' ? rate : rate+'%'}</div></div>
        <div class="card"><div class="metric-label">Ratkenneita</div><div class="metric">${resolved.length}/${data.length}</div></div>`;

      list.innerHTML = data.map(p => {
        const icon = p.was_correct === true ? '✅' : p.was_correct === false ? '❌' : '⏳';
        const cls = p.was_correct === true ? 'badge-green' : p.was_correct === false ? 'badge-red' : 'badge-muted';
        const label = p.was_correct === true ? 'Oikein' : p.was_correct === false ? 'Väärin' : 'Odottaa';
        const homeW = (p.home_win_prob*100).toFixed(0);
        const drawW = (p.draw_prob*100).toFixed(0);
        const awayW = (p.away_win_prob*100).toFixed(0);
        return `<div class="card">
          <div class="row"><strong>${icon} ${p.predicted_winner?.toUpperCase()||'—'}</strong><span class="badge ${cls}">${label}</span></div>
          <div class="row prob-text" style="margin-top:6px;">
            <span>Koti ${homeW}%</span><span>Tasa ${drawW}%</span><span>Vieras ${awayW}%</span>
          </div>
          <div class="progress-bar">
            <span style="display:flex;height:100%">
              <span class="progress-fill fill-home" style="width:${homeW}%"></span>
              <span class="progress-fill fill-draw" style="width:${drawW}%"></span>
              <span class="progress-fill fill-away" style="width:${awayW}%"></span>
            </span>
          </div>
        </div>`;
      }).join('');
    }

    // === Joukkueet ===
    async function loadTeams() {
      const [ratingsRes, teamsRes] = await Promise.all([
        fetch(`${API}/team_ratings`),
        fetch(`${API}/teams`),
      ]);
      const ratings = await ratingsRes.json();
      const teams = await teamsRes.json();

      const list = document.getElementById('teams-list');
      if (!ratings.length) { list.innerHTML = '<div class="empty">Ei joukkuetietoja...</div>'; return; }

      const teamMap = Object.fromEntries(teams.map(t => [t.id, t.name]));

      // Järjestä Elo-järjestykseen
      const sorted = [...ratings].sort((a, b) => b.elo - a.elo);

      list.innerHTML = sorted.map((t, i) => {
        const pdoCls = t.pdo > 102 ? 'badge-green' : t.pdo < 98 ? 'badge-red' : 'badge-muted';
        const pdoLabel = t.pdo > 102 ? 'Yli' : t.pdo < 98 ? 'Ali' : '—';
        return `<div class="card">
          <div class="row">
            <strong class="team-name">#${i+1} ${teamMap[t.team_id] || `Joukkue ${t.team_id}`}</strong>
            <span style="font-weight:700">Elo: ${t.elo.toFixed(0)}</span>
          </div>
          <div class="row" style="margin-top:4px; font-size:0.75rem; color:var(--muted)">
            <span>PDO: ${t.pdo?.toFixed(1)||'—'} <span class="badge ${pdoCls}">${pdoLabel}</span></span>
            <span>${t.date}</span>
          </div>
        </div>`;
      }).join('');
    }

    // Alustava lataus
    loadValueFlags();
  </script>
</body>
</html>

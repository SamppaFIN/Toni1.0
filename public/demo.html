<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>BetTracker — Demo</title>
<!-- Cinzel: kaiverrettu, kasinokylttien näköinen serif. Ladataan aina (pieni
     woff2), mutta näkyy vain kasino-teemassa — oletusteema ei viittaa siihen. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<style>
/* === BetTracker Design System — OKLCH + Fluid + Glass === */
:root{
  --c-bg: oklch(0.12 0.02 260);
  --c-surface: oklch(0.17 0.02 260);
  --c-surface-hover: oklch(0.22 0.03 260);
  --c-text: oklch(0.92 0.01 260);
  --c-text-muted: oklch(0.55 0.02 260);
  --c-accent: oklch(0.62 0.18 240);
  --c-success: oklch(0.62 0.20 145);
  --c-danger: oklch(0.52 0.22 25);
  --c-warning: oklch(0.72 0.16 85);
  --c-orange: oklch(0.58 0.18 50);
  --radius-sm: 8px; --radius-md: clamp(10px, 2vw, 16px); --radius-pill: 20px;
  --shadow-card: 0 1px 3px rgba(0,0,0,.4);
  --shadow-elevated: 0 4px 16px rgba(0,0,0,.5);
  --touch-target: 44px;
  --body-bg-image: none;
  --font-display: inherit;
}
/* === Vaihtoehtoinen teema: "Kasino" ===
   Sama token-rajapinta kuin oletusteemalla (system) — vain arvot vaihtuvat.
   Yksikään komponentti ei tiedä kummasta teemasta on kyse; ne lukevat aina
   samoja --c-*-muuttujia. Aihe: pelipöydän vihreä huopa, messinkiset reunat
   ja pelimerkin kulta — kaiverrettu Cinzel-otsikkofontti antaa kylttimäisen
   tunnun ilman että yksikään numero (kertoimet, Elo, kassa) siirtyy siihen,
   koska luettavuus dataile menee tyylin edelle.
   Valinta tallentuu bt_ui_theme-avaimeen, oletus 'system' koskematta. */
:root[data-ui-theme="casino"]{
  --c-bg: oklch(0.15 0.045 155);
  --c-surface: oklch(0.205 0.05 155);
  --c-surface-hover: oklch(0.27 0.055 155);
  --c-text: oklch(0.95 0.02 85);
  --c-text-muted: oklch(0.66 0.03 100);
  --c-accent: oklch(0.76 0.14 85);
  --c-success: oklch(0.68 0.16 150);
  --c-danger: oklch(0.58 0.20 25);
  --c-warning: oklch(0.74 0.15 70);
  --c-orange: oklch(0.63 0.18 45);
  --shadow-card: 0 1px 3px rgba(0,0,0,.5);
  --shadow-elevated: 0 4px 20px rgba(0,0,0,.55), 0 0 0 1px oklch(0.76 0.14 85 / 0.10);
  --font-display: 'Cinzel', Georgia, serif;
  --body-bg-image:
    radial-gradient(1100px 700px at 12% -8%, oklch(0.30 0.06 155 / 0.6), transparent 58%),
    radial-gradient(800px 650px at 108% 15%, oklch(0.76 0.14 85 / 0.07), transparent 55%),
    radial-gradient(1400px 900px at 50% 110%, oklch(0.05 0.02 155 / 0.55), transparent 60%),
    repeating-linear-gradient(135deg, oklch(1 0 0 / 0.022) 0 2px, transparent 2px 30px),
    repeating-linear-gradient(45deg, oklch(1 0 0 / 0.022) 0 2px, transparent 2px 30px);
}
:root[data-ui-theme="casino"] .glass-header{
  background:oklch(0.15 0.045 155 / 0.9);
  border-bottom:2px solid transparent;
  border-image:linear-gradient(90deg, transparent, oklch(0.76 0.14 85 / 0.7) 20%, oklch(0.76 0.14 85 / 0.7) 80%, transparent) 1;
  box-shadow:0 1px 0 oklch(0.76 0.14 85 / 0.15);
}
:root[data-ui-theme="casino"] .glass-header h1{
  font-family:var(--font-display);letter-spacing:.03em;text-transform:uppercase;font-size:clamp(0.95rem,2.6vw,1.15rem);
}
:root[data-ui-theme="casino"] h3{font-family:var(--font-display);letter-spacing:.02em}
/* Otteluportti näyttää kirjaimellisesti kortilta: hienovarainen maila-vesileima
   nurkassa ja kullan sävyinen reunaviiva. Rajattu #round-games:iin, jotta
   Admin- ja modaalikortit pysyvät rauhallisina eikä koristelu leviä joka paikkaan. */
:root[data-ui-theme="casino"] #round-games .card{
  position:relative;
  border-color:oklch(0.76 0.14 85 / 0.16);
  background:linear-gradient(165deg, oklch(0.225 0.05 155), oklch(0.185 0.046 155));
}
:root[data-ui-theme="casino"] #round-games .card::before{
  content:'♠';position:absolute;top:8px;right:12px;
  font-family:var(--font-display);font-size:1.05rem;color:oklch(0.76 0.14 85 / 0.16);
  pointer-events:none;line-height:1;
}
:root[data-ui-theme="casino"] .card{border-color:oklch(0.76 0.14 85 / 0.12)}
:root[data-ui-theme="casino"] .matchup strong{font-family:var(--font-display);font-weight:700;letter-spacing:.01em}
/* Elo-luku pysyy järjestelmäfontissa vaikka periytyisi Cinzelin alta —
   numerot eivät saa muuttua tyylin takia */
:root[data-ui-theme="casino"] .matchup strong span{font-family:system-ui,sans-serif}
:root[data-ui-theme="casino"] .btn-primary{
  background:linear-gradient(180deg, oklch(0.82 0.13 85), oklch(0.68 0.15 78));
  color:oklch(0.16 0.03 85);font-weight:700;letter-spacing:.01em;
  box-shadow:0 0 0 1px oklch(0.86 0.11 85 / 0.55), inset 0 1px 0 oklch(1 0.02 85 / 0.4), var(--shadow-card);
}
:root[data-ui-theme="casino"] .btn:hover{box-shadow:0 0 0 1px oklch(0.76 0.14 85 / 0.4), var(--shadow-elevated)}
:root[data-ui-theme="casino"] .tabs{background:oklch(0.12 0.04 155 / 0.4);border-radius:var(--radius-md)}
:root[data-ui-theme="casino"] .tab{font-family:var(--font-display);letter-spacing:.02em}
:root[data-ui-theme="casino"] .tab.active{
  background:linear-gradient(180deg, oklch(0.82 0.13 85), oklch(0.68 0.15 78));color:oklch(0.16 0.03 85);
  box-shadow:inset 0 1px 0 oklch(1 0.02 85 / 0.5), 0 2px 6px oklch(0.76 0.14 85 / 0.35);
}
:root[data-ui-theme="casino"] .badge{border:1px solid oklch(1 0 0 / 0.18)}
:root[data-ui-theme="casino"] .badge-green{background:linear-gradient(180deg, oklch(0.72 0.17 150), oklch(0.60 0.18 145))}
:root[data-ui-theme="casino"] .badge-yellow{background:linear-gradient(180deg, oklch(0.80 0.14 85), oklch(0.68 0.16 78))}
:root[data-ui-theme="casino"] .bk-odds{border-color:oklch(0.76 0.14 85 / 0.22)}
:root[data-ui-theme="casino"] .bk-odds.best{box-shadow:0 0 0 2px oklch(0.76 0.14 85 / 0.55), inset 0 0 10px oklch(0.76 0.14 85 / 0.12);border-color:transparent}
:root[data-ui-theme="casino"] ::selection{background:oklch(0.76 0.14 85 / 0.35)}
:root[data-ui-theme="casino"] :focus-visible{outline-color:oklch(0.76 0.14 85)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:100%;-webkit-text-size-adjust:100%}
body{
  font-family:system-ui,-apple-system,sans-serif;
  background:var(--c-bg) var(--body-bg-image);background-attachment:fixed;color:var(--c-text);
  padding:0;max-width:500px;margin:0 auto;padding-bottom:80px;
  line-height:1.5;font-size:clamp(0.875rem, 1.5vw, 1rem);
}
/* Glass header */
.glass-header{
  position:sticky;top:0;z-index:100;
  background:oklch(0.12 0.02 260 / 0.85);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding:clamp(8px,2vw,12px) clamp(12px,3vw,16px);
  border-bottom:1px solid oklch(1 0 0 / 0.06);
  text-align:center;
}
.glass-header h1{font-size:clamp(1rem,3vw,1.3rem);font-weight:800;letter-spacing:-0.02em}
.demo-badge{display:inline-block;background:var(--c-warning);color:#000;font-size:clamp(0.55rem,1vw,0.65rem);padding:1px 8px;border-radius:var(--radius-pill);font-weight:700;margin-left:6px;vertical-align:middle}
/* Bankroll bar */
.bankroll-bar{
  position:sticky;top:clamp(48px,8vw,56px);z-index:99;
  background:var(--c-surface);padding:clamp(6px,1.5vw,10px) clamp(10px,2vw,14px);
  display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid oklch(1 0 0 / 0.04);
}
.bankroll-amount{font-weight:800;font-size:clamp(1rem,2.5vw,1.2rem)}
.bankroll-amount.positive{color:var(--c-success)}.bankroll-amount.negative{color:var(--c-danger)}
/* Tabs — rivittyvät, eivät vieri
   Aiemmin palkki oli overflow-x:auto piilotetulla vierityspalkilla. Kapealla
   ruudulla Admin jäi reunan taakse ilman mitään vihjettä siitä että sinne
   pääsee — asetukset ja teemanvaihto olivat käytännössä löytymättömissä.
   Rivitys näyttää kaikki välilehdet kerralla eikä vaadi arvaamaan. */
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:clamp(6px,1.5vw,10px)}
.tab{
  flex:1 1 auto;min-height:var(--touch-target);
  padding:6px clamp(6px,1.6vw,14px);
  background:var(--c-surface);border:none;color:var(--c-text-muted);
  border-radius:var(--radius-sm);cursor:pointer;
  font-size:clamp(0.65rem,1.2vw,0.75rem);font-weight:500;white-space:nowrap;
  transition:all .2s ease;
}
.tab:hover{background:var(--c-surface-hover);color:var(--c-text)}
.tab.active{background:var(--c-accent);color:#000;font-weight:600}
/* Views */
.view{display:none;padding:clamp(8px,2vw,12px);animation:fadeIn .25s ease}
.view.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
/* Cards */
.card{
  background:var(--c-surface);border-radius:var(--radius-md);
  padding:clamp(10px,2.5vw,14px);margin-bottom:clamp(6px,1.5vw,10px);
  box-shadow:var(--shadow-card);
  border:1px solid oklch(1 0 0 / 0.04);
  transition:transform .15s ease,box-shadow .15s ease;
}
.card:hover{transform:translateY(-1px);box-shadow:var(--shadow-elevated)}
.row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
/* Badges */
.badge{font-size:clamp(0.55rem,1vw,0.65rem);padding:2px 8px;border-radius:var(--radius-pill);font-weight:600}
.badge-green{background:var(--c-success);color:#000}.badge-yellow{background:var(--c-warning);color:#000}.badge-red{background:var(--c-danger);color:#fff}.badge-muted{background:var(--c-text-muted);color:#fff}.badge-orange{background:var(--c-orange);color:#fff}
/* Metrics */
.metric{font-size:clamp(1.1rem,3vw,1.4rem);font-weight:800;font-variant-numeric:tabular-nums}
.metric-label{font-size:clamp(0.6rem,1vw,0.7rem);color:var(--c-text-muted)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:clamp(6px,1.5vw,8px)}
/* Team logo */
.team-logo{width:clamp(24px,6vw,32px);height:clamp(24px,6vw,32px);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:clamp(0.55rem,1.5vw,0.7rem);color:#fff;flex-shrink:0}
/* Elo-luku suluissa kasvattaa nimeä — rivittyminen estää sen että
   pitkä nimipari työntäisi value-merkin kortin reunan yli */
.matchup{display:flex;align-items:center;gap:6px;font-size:clamp(0.8rem,1.5vw,0.9rem);flex-wrap:wrap}
.matchup .vs{margin:0 2px;color:var(--c-text-muted);font-size:0.7em}
/* Tekijäpillerit (tiketti #39-jatko): kaikki analyysiin vaikuttava tieto
   näkyviin kortin otsakkeessa ilman että pitää avata mitään osiota. */
.factor-pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.factor-pill{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:999px;font-size:.58rem;font-weight:600;white-space:nowrap;border:1px solid oklch(1 0 0 / 0.14);background:oklch(1 0 0 / 0.06);color:var(--c-text)}
.factor-pill.tone-success{background:oklch(0.62 0.20 145 / 0.16);border-color:oklch(0.62 0.20 145 / 0.5)}
.factor-pill.tone-warning{background:oklch(0.72 0.16 85 / 0.16);border-color:oklch(0.72 0.16 85 / 0.5)}
.factor-pill.tone-danger{background:oklch(0.52 0.22 25 / 0.16);border-color:oklch(0.52 0.22 25 / 0.5)}
/* Bookmaker odds list (kierroskortti) */
.odds-list{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.odds-row{display:grid;grid-template-columns:minmax(0,1fr) 1fr 1fr 1fr;gap:4px;align-items:center}
.odds-head span{font-size:.6rem;color:var(--c-text-muted);text-align:center}
.odds-head span:first-child{text-align:left}
.bk-name{font-size:.65rem;color:var(--c-text-muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Tiketti #47: toimiston nimi linkkinä toimiston sivulle */
a.bk-link{text-decoration:none;border-bottom:1px dotted currentColor;cursor:pointer}
a.bk-link:hover,a.bk-link:focus-visible{color:var(--c-accent)}
.bk-odds{min-height:34px;padding:4px;border-radius:var(--radius-sm);border:1.5px solid oklch(1 0 0 / 0.12);background:transparent;color:var(--c-text);cursor:pointer;font-size:.75rem;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;transition:all .15s ease}
.bk-odds:hover{border-color:var(--c-accent);color:var(--c-accent)}
/* Paras hinta on pelkkä hintavertailun tulos, ei arvolöytö: se saa vain
   vahvemman reunan ja tähden. Väritäyttö on varattu ylikertoimille, jotta
   vihreä ruutu tarkoittaa aina positiivista odotusarvoa eikä koskaan
   "halvin kolmesta huonosta". */
.bk-odds.best{border-color:oklch(1 0 0 / 0.42);font-weight:800}
/* Kerroinruudun taustaväri = vetosuositus, neljä tasoa. Musta (ei luokkaa) on
   oletus: ei suositusta. Keltainen kandidaatti (>3 %), vihreä vahva (>5 %),
   kultainen poikkeuksellinen (>8 %). Kultainen on tarkoituksella
   metallisempi kuin keltainen — hehku ja kirkkaampi reuna erottavat ne
   toisistaan myös nopeasti silmäiltynä. */
.bk-odds.value-candidate{background:oklch(0.72 0.16 85 / 0.20);border-color:oklch(0.72 0.16 85 / 0.65)}
.bk-odds.value-strong{background:oklch(0.62 0.20 145 / 0.22);border-color:oklch(0.62 0.20 145 / 0.7)}
.bk-odds.value-elite{
  background:linear-gradient(160deg,oklch(0.84 0.14 92 / 0.34),oklch(0.68 0.13 78 / 0.26));
  border-color:oklch(0.86 0.13 90 / 0.85);
  box-shadow:0 0 0 1px oklch(0.86 0.13 90 / 0.35), 0 0 12px oklch(0.82 0.14 88 / 0.3), inset 0 1px 0 oklch(1 0.03 90 / 0.35);
  font-weight:800;
}
/* Odotusarvo kertoimen alla, hyvin pienellä. Neljä tasoa:
   punainen = negatiivinen odotusarvo, harmaa = nolla-alue (0-3 %, mallin
   virherajojen sisällä), keltainen = kandidaatti (>3 %), vihreä = vahva
   (>5 %), sateenkaari = poikkeuksellinen (>8 %) jota kannattaa epäillä
   ennen kuin siihen luottaa. */
.bk-odds{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.1}
.ev{font-size:.5rem;font-weight:600;font-variant-numeric:tabular-nums;opacity:.95}
.ev-bad{color:var(--c-danger)}
.ev-flat{color:var(--c-text-muted)}
.ev-ok{color:var(--c-warning)}
.ev-good{color:var(--c-success)}
.ev-wow{
  background:linear-gradient(90deg,oklch(0.72 0.2 25),oklch(0.8 0.18 85),oklch(0.75 0.19 145),oklch(0.7 0.18 250),oklch(0.68 0.2 310));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  font-weight:800;
}
@media (prefers-reduced-motion:no-preference){
  .ev-wow{background-size:200% 100%;animation:evShimmer 3s linear infinite}
  @keyframes evShimmer{to{background-position:200% 0}}
}
.pk-odds{min-height:44px;padding:4px;border-radius:var(--radius-sm);border:1.5px solid oklch(1 0 0 / 0.12);background:oklch(0.62 0.20 145 / 0.12);color:var(--c-text);cursor:pointer;font-size:.75rem;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;transition:all .15s ease}
.pk-odds:hover{border-color:var(--c-accent);color:var(--c-accent)}
/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:var(--touch-target);padding:10px clamp(14px,3vw,20px);
  border-radius:var(--radius-sm);border:none;font-weight:600;cursor:pointer;
  font-size:clamp(0.75rem,1.5vw,0.85rem);
  transition:all .15s ease;
}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-elevated)}
.btn:active{transform:scale(0.97)}
.btn-primary{background:var(--c-accent);color:#000}.btn-danger{background:var(--c-danger);color:#fff}.btn-success{background:var(--c-success);color:#000}.btn-block{display:flex;width:100%}
/* Input */
.input-group{margin:8px 0}.input-group label{display:block;font-size:clamp(0.65rem,1vw,0.75rem);color:var(--c-text-muted);margin-bottom:4px}
.input-group input{width:100%;min-height:var(--touch-target);padding:8px 12px;border-radius:var(--radius-sm);border:1.5px solid oklch(1 0 0 / 0.12);background:var(--c-bg);color:var(--c-text);font-size:clamp(0.8rem,1.2vw,0.9rem);transition:border-color .15s ease}
.input-group input:focus{outline:none;border-color:var(--c-accent);box-shadow:0 0 0 3px oklch(0.62 0.18 240 / 0.2)}
/* Progress bar */
.progress-bar{height:clamp(3px,1vw,5px);background:oklch(1 0 0 / 0.08);border-radius:3px;margin-top:4px;overflow:hidden;display:flex}.progress-fill{height:100%;transition:width .3s ease}
.fill-home{background:var(--c-accent)}.fill-draw{background:var(--c-warning)}.fill-away{background:var(--c-danger)}
/* Sim game details */
.goal-list{font-size:clamp(0.65rem,1vw,0.75rem);color:var(--c-text-muted);margin-top:6px;line-height:1.6}
.penalty-row{font-size:clamp(0.6rem,1vw,0.7rem);color:var(--c-orange);margin-top:4px}
/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--c-surface);border:1px solid oklch(1 0 0 / 0.1);color:var(--c-text);padding:12px 24px;border-radius:var(--radius-pill);font-weight:600;font-size:clamp(0.75rem,1.2vw,0.85rem);z-index:9999;box-shadow:var(--shadow-elevated);animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateX(-50%) translateY(16px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
.empty{text-align:center;padding:32px 16px;color:var(--c-text-muted);font-style:italic;font-size:clamp(0.8rem,1.2vw,0.9rem)}
/* Pressure toggle */
.pressure-toggle{
  min-height:var(--touch-target);padding:6px 14px;border-radius:var(--radius-pill);
  border:1.5px dashed oklch(1 0 0 / 0.15);background:transparent;
  color:var(--c-text-muted);cursor:pointer;font-size:clamp(0.6rem,1vw,0.7rem);
  transition:all .2s ease;margin:2px;
}
.pressure-toggle:hover{border-color:var(--c-orange);color:var(--c-text)}
.pressure-toggle.active{background:var(--c-orange);color:#fff;border-color:var(--c-orange);font-weight:700;box-shadow:0 0 12px oklch(0.58 0.18 50 / 0.3)}
/* Modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:oklch(0 0 0 / 0.7);backdrop-filter:blur(4px);z-index:1000;display:none;align-items:center;justify-content:center;animation:fadeIn .2s ease}
/* a11y */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
:focus-visible{outline:2px solid var(--c-accent);outline-offset:2px}
</style>
</head>
<body>
<header class="glass-header"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h1 style="text-align:left">🏒 BetTracker <span class="demo-badge">DEMO</span></h1><button class="btn btn-danger" id="reset-header-btn" onclick="resetSimulation()" style="font-size:.6rem;padding:4px 10px;min-height:32px;white-space:nowrap" title="Nollaa kaikki — aloita alusta">🔄 Aloita alusta</button></div></header>
<div class="bankroll-bar">
  <span>💰 Kassa</span>
  <span class="bankroll-amount" id="bankroll-display">100.00 €</span>
  <button class="btn btn-primary" style="font-size:clamp(0.6rem,1vw,0.7rem);padding:4px 10px;min-height:32px" onclick="showBankrollModal()">➕</button>
</div>
<div class="tabs" id="tab-bar">

function save(){
  const steps=[

    ['bt_bankroll',()=>bankroll.toFixed(2)],
    ['bt_history',()=>JSON.stringify(betHistory)],
    ['bt_pressure',()=>pressureTeam],
    ['bt_ratings',()=>JSON.stringify(ratings)],
    ['bt_simResults',()=>JSON.stringify(simResults)],
  ];
  let failed=null;
  for(const [key,value] of steps){
    try{localStorage.setItem(key,value())}
    catch(err){if(!failed)failed=key}

/**
 * Oman arvion pohjaluku: käyttäjän itse syöttämä prosentti, tai jos hän ei
 * ole syöttänyt omaansa, MALLIN arvio. Näin kenttä ei ala tyhjästä — mallin
 * luku on lähtökohta jota käyttäjä voi säätää, eikä hänen tarvitse arvata
 * mistä lähteä. Tyhjentäminen palauttaa mallin arvion.
 *
 * Huom: mallin arvio tulee hockeyGameProbs()ista, joten se sisältää myös
 * Kerroinlaskurissa lisätyt tekijät (loukkaantumiset ym.).
 */
function hockeyEstimate(gid,side){
  const own=hockeyModels[gid]?.[side];
  if(own!=null&&!isNaN(own))return{value:own,isOwn:true};
  const g=games.find(x=>x.id===gid);
  if(!g)return{value:null,isOwn:false};
  return{value:hockeyGameProbs(g)[side]*100,isOwn:false};
}
function hockeyEdge(gid,side){
  const{value:p}=hockeyEstimate(gid,side);
  const odds=getOdds(gid);
  if(p==null||isNaN(p)||!odds)return null;
  const price=side==='home'?odds.home_odds:side==='draw'?odds.draw_odds:odds.away_odds;
  return p/100*price-1;
}

//   vol×20 (korjaus #2):  ~6,4 % otteluista ylittää 3 %:n kynnyksen,
//     ~0,3 % ylittää 5 %:n vahvan signaalin kynnyksen.

  const key=String(name||'').toLowerCase();

// KORJAUS: kolme eri kohtaa (genOddsForBookmaker, buildDynamicRoundState,
// advanceRound) laskivat hp/dp/ap:n toisistaan riippumatta, ja kaksi niistä
// (buildDynamicRoundState, advanceRound) käyttivät kaavaa `ap=1-hp-dp` ILMAN
// alarajaa. Suurella Elo-erolla (esim. Lukko 1632 vs Jukurit 1254, ero 378)
// tämä antoi ap:lle NEGATIIVISEN arvon, jolloin altavastaajan edge oli aina
// mahdoton havaita — juuri se puoli jolla ylikertoimet oikeasti näkyvät.
// genOddsForBookmakerissa oli väliaikainen `Math.max(0.08,...)`-paikkaus joka
// ei ollut sama kuin muualla käytetty kaava, joten hinnoittelu ja
// edge-tarkistus vertasivat eri lukuja toisiinsa.
//
// Yksi yhteinen funktio, sama tekniikka kuin src/publish/mock-liiga-rounds.ts:n
// probabilityTriple(): kotivoitto kerrotaan (1-tasapeli):llä, jolloin summa on
// AINA tasan 1 eikä yksikään termi voi mennä negatiiviseksi — ei tarvita
// erillistä alarajaa.
function hockeyProbs(hElo,aElo){
  const homeWinRaw=1/(1+Math.pow(10,(aElo-(hElo+40))/400));
  const draw=Math.max(0.12,0.26-Math.abs(hElo+40-aElo)/1500);
  return{home:homeWinRaw*(1-draw),draw,away:(1-homeWinRaw)*(1-draw)};
}

// ─── Odotusarvon esitys: neljä tasoa + poikkeuksellinen ──────────────────
// Kynnykset ovat samat kuin value_flags-logiikassa (3 % / 5 %), jotta
// kerroinruudun pikkuluku ja kortin 💎-merkki eivät voi olla eri mieltä.
// 12 %:n "huikea" -taso on tarkoituksellisesti epäluuloinen: sellainen edge
// on demossa mahdollinen, mutta oikeassa maailmassa se tarkoittaa lähes
// aina että malli on väärässä, ei että markkina on.
const EV_WOW=0.08;
function evClass(ev){
  if(ev>EV_WOW)return'ev-wow';
  if(ev>0.05)return'ev-good';
  if(ev>0.03)return'ev-ok';
  if(ev<0)return'ev-bad';
  return'ev-flat';
}
function evLabel(ev){
  if(ev>EV_WOW)return'🌈 poikkeuksellinen — epäile mallia ennen markkinaa';
  if(ev>0.05)return'🟢 vahva signaali';
  if(ev>0.03)return'🟡 kandidaatti';
  if(ev<0)return'🔴 negatiivinen odotusarvo';
  return'⚪ nolla-alue (alle 3 % on mallin virherajojen sisällä)';
}
/** Kerroinruudun TAUSTAVÄRI-luokka: '' = musta (ei suositusta) */
function evBgClass(ev){
  if(ev==null)return'';
  if(ev>EV_WOW)return'value-elite';   // kultainen
  if(ev>0.05)return'value-strong';    // vihreä
  if(ev>0.03)return'value-candidate'; // keltainen
  return'';                           // musta
}

/**
 * Kerroinruudun odotusarvo. Käyttää hockeyEstimate()a, joten se seuraa
 * KÄYTTÄJÄN omaa arviota jos hän on syöttänyt sellaisen — muuten mallin
 * arviota (joka sisältää Kerroinlaskurin tekijät). Näin kortin suositusvärit,
 * "Oma arvio" -laatikon edge ja Kerroinlaskurin taulukko lukevat kaikki
 * samaa lukua eivätkä voi olla eri mieltä.
 */
function evForOdds(gameId,side,oddsValue){
  const{value:pct}=hockeyEstimate(gameId,side);
  if(pct==null||isNaN(pct)||!(oddsValue>1))return null;
  return pct/100*oddsValue-1;
}

/** Yhden kerroinruudun sisältö — sama sekä ensirenderöinnissä että live-päivityksessä */
function oddsCellInner(oddsValue,isBest,ev){
  const evHtml=ev==null?'':`<span class="ev ${evClass(ev)}">${ev>0?'+':''}${(ev*100).toFixed(1)}%</span>`;
  return`<span>${oddsValue.toFixed(2)}${isBest?' ⭐':''}</span>${evHtml}`;
}

/**
 * Päivitä kortin kerroinruudut kun käyttäjä muuttaa omaa arviotaan.

// ─── Kerroinlaskuri: manuaaliset tekijät (esim. loukkaantunut avainpelaaja) ──
//
// Käyttäjä voi lisätä ottelukohtaisia Elo-säätöjä Kerroinlaskuri-sivulla
// (esim. "maalivahti loukkaantunut, -50 Elo"). Säädöt on avaimistettu
// ottelun id:llä, EIVÄT muuta joukkueen pysyvää kausi-Elo:a (ratings-taulukko)
// — ne vaikuttavat vain siihen YHTEEN otteluun johon ne on lisätty, ja
// häviävät luonnollisesti kun kierros vaihtuu ja uusi ottelu saa uuden id:n.
let hockeyFactors=JSON.parse(localStorage.getItem('bt_hockey_factors')||'{}');
function saveHockeyFactors(){localStorage.setItem('bt_hockey_factors',JSON.stringify(hockeyFactors))}
function factorDelta(gameId,team){return(hockeyFactors[gameId]||[]).filter(f=>f.team===team).reduce((s,f)=>s+f.delta,0)}

/** Joukkueen kausi-Elo + tämän ottelun manuaaliset säädöt, ja niistä johdettu 1X2-jakauma */
function hockeyGameProbs(g){
  const hElo=(getRating(g.home_team_id)?.elo||1500)+factorDelta(g.id,'home');
  const aElo=(getRating(g.away_team_id)?.elo||1500)+factorDelta(g.id,'away');
  return{...hockeyProbs(hElo,aElo),hElo,aElo};
}

/**
 * Päivitä yhden ottelun ennuste ja value-flag manuaalisten tekijöiden
 * jälkeen. Kertoimet EIVÄT muutu (markkina ei tiedä käyttäjän lisäämästä
 * tekijästä) — vain mallin oma todennäköisyysarvio ja siitä johdettu edge.
 */
function recomputeGameModel(gameId){
  const g=games.find(x=>x.id===gameId);
  if(!g)return;
  const probs=hockeyGameProbs(g);
  const pw=probs.home>probs.away&&probs.home>probs.draw?'home':probs.away>probs.draw?'away':'draw';
  const predIdx=predictions.findIndex(p=>p.game_id===gameId);
  const newPred={id:predictions[predIdx]?.id||(Date.now()+gameId),game_id:gameId,home_win_prob:+probs.home.toFixed(4),draw_prob:+probs.draw.toFixed(4),away_win_prob:+probs.away.toFixed(4),predicted_winner:pw,predicted_at:new Date().toISOString(),actual_winner:null,was_correct:null};
  if(predIdx>=0)predictions[predIdx]=newPred;else predictions.push(newPred);

  valueFlags=valueFlags.filter(v=>v.game_id!==gameId);
  const gRows=oddsSnapshots.filter(o=>o.game_id===gameId);
  if(!gRows.length)return;
  const best={home:Math.max(...gRows.map(r=>r.home_odds)),draw:Math.max(...gRows.map(r=>r.draw_odds)),away:Math.max(...gRows.map(r=>r.away_odds))};
  const impliedDenominator=1/best.home+1/best.draw+1/best.away;
  const edges=[
    {side:'home',odds:best.home,model_prob:probs.home,implied_prob:(1/best.home)/impliedDenominator},
    {side:'draw',odds:best.draw,model_prob:probs.draw,implied_prob:(1/best.draw)/impliedDenominator},
    {side:'away',odds:best.away,model_prob:probs.away,implied_prob:(1/best.away)/impliedDenominator},
  ].map(e=>({...e,edge:e.model_prob*e.odds-1}));
  const bestEdge=[...edges].sort((a,b)=>b.edge-a.edge)[0];
  if(bestEdge.edge>0.03){
    valueFlags.push({id:Date.now()+gameId,game_id:gameId,market:'1X2',model_prob:+bestEdge.model_prob.toFixed(4),implied_prob:+bestEdge.implied_prob.toFixed(4),edge:+bestEdge.edge.toFixed(4),triggering_news_event_id:null,created_at:new Date().toISOString()});
  }
}

function genOddsForBookmaker(g,bk){
  const{home:hp,draw:dp,away:ap}=hockeyGameProbs(g);
  const profile=bookmakerProfile(bk);
  const probs=[hp,dp,ap];
  const favorite=probs.indexOf(Math.max(...probs));
  const raw=probs.map((prob,index)=>{
    const noise=(Math.random()-0.5)*2*profile.vol;
    const favoriteTax=index===favorite?profile.favoriteTax:0;
    const drawTax=index===1?profile.drawTax:0;
    const longshotTax=prob<0.22?profile.longshotTax:0;
    return prob*(1+noise+favoriteTax+drawTax+longshotTax);
  });
  const scale=(1+profile.margin)/raw.reduce((sum,value)=>sum+value,0);
  const priced=raw.map(value=>value*scale);
  return{id:Date.now()+Math.floor(Math.random()*1e9),game_id:g.id,bookmaker:bk,market:'1X2',home_odds:+(1/priced[0]).toFixed(2),draw_odds:+(1/priced[1]).toFixed(2),away_odds:+(1/priced[2]).toFixed(2),fetched_at:new Date().toISOString()};
}
function syncBookmakerOdds(){
  const upcoming=games.filter(g=>g.status==='upcoming');
  upcoming.forEach(g=>bookmakers.forEach(bk=>{
    if(!oddsSnapshots.some(o=>o.game_id===g.id&&o.bookmaker===bk.name))oddsSnapshots.push(genOddsForBookmaker(g,bk.name));
  }));
}
function getRating(tid){return ratings.find(r=>r.team_id===tid)}
function teamNameElo(id){const t=teams.find(x=>x.id===id);if(!t)return'Joukkue '+id;const r=getRating(id);return t.name+(r?' ('+r.elo.toFixed(0)+')':' ('+id+')')}
function ensureRatingState(r,date){
  if(!r)return null;
  if(r.elo_delta===undefined)r.elo_delta=0;
  if(r.pdo_delta===undefined)r.pdo_delta=0;
  r.played=r.played||0;
  r.wins=r.wins||0;
  r.ot_wins=r.ot_wins||0;
  r.ot_losses=r.ot_losses||0;
  r.losses=r.losses||0;
  r.goals_for=r.goals_for||0;
  r.goals_against=r.goals_against||0;
  if(r.shots_for===undefined)r.shots_for=null;
  if(r.shots_against===undefined)r.shots_against=null;
  // Putki: positiivinen = voittoputki, negatiivinen = häviöputki, 0 = ei putkea.
  // form on viimeisten otteluiden kirjainjono uusin ensin ('V'=voitto,
  // 'J'=jatkoaika/voitto lisäajalla, 'H'=häviö) — todellisista tuloksista,
  // ei arvattu.
  if(r.streak===undefined)r.streak=0;
  if(!Array.isArray(r.form))r.form=[];
  if(date)r.date=date;
  return r;
}
/** Putken kuvaus tekstinä, tai null jos putkea ei ole */
function streakLabel(r){
  const s=r?.streak||0;
  if(Math.abs(s)<2)return null; // yksi ottelu ei ole putki
  return s>0?`${s} voittoputki`:`${Math.abs(s)} häviöputki`;
}

// ─── Maaliodottama ────────────────────────────────────────────────────────
// SM-liigan keskiarvo on noin 5,5 maalia/ottelu. Odottama lasketaan
// joukkueiden OIKEISTA kausiluvuista (hyökkäysvoima vs. vastustajan
// puolustus) samalla tekniikalla kuin jalkapallon Poisson-mallissa
// (src/analyze/poisson.ts) — ei arvattua vakiota.
//
// Kun ottelut on pelattu nolla (kauden alku), palautetaan sarjan keskiarvo
// puoliksi eikä keksitä joukkuekohtaista lukua tyhjästä.
const LIIGA_GOALS_PER_GAME=5.5;
const LIIGA_HOME_GOAL_EDGE=1.06; // kotijoukkue tekee ~6 % enemmän
function hockeyExpectedGoals(g){
  const hR=getRating(g.home_team_id),aR=getRating(g.away_team_id);
  const half=LIIGA_GOALS_PER_GAME/2;
  const perGame=(r,key)=>(r&&r.played>0)?r[key]/r.played:half;
  const hAtk=perGame(hR,'goals_for'),hDef=perGame(hR,'goals_against');
  const aAtk=perGame(aR,'goals_for'),aDef=perGame(aR,'goals_against');
  // Hyökkäys ja vastustajan puolustus keskiarvoistetaan — kumpikin puoli
  // kertoo saman asian eri suunnasta, ja keskiarvo vaimentaa pienen otoksen
  // kohinaa
  const home=(hAtk+aDef)/2*LIIGA_HOME_GOAL_EDGE;
  const away=(aAtk+hDef)/2/LIIGA_HOME_GOAL_EDGE;
  const played=Math.min(hR?.played||0,aR?.played||0);
  return{home,away,total:home+away,played};
}

function computeRatingPdo(r){
  if(r.shots_for&&r.shots_against&&r.shots_for>0&&r.shots_against>0){
    const shPct=(r.goals_for/r.shots_for)*100;
    const svPct=(1-r.goals_against/r.shots_against)*100;
    return Math.max(94,Math.min(106,shPct+svPct));
  }
  const totalGoals=(r.goals_for||0)+(r.goals_against||0);
  if(totalGoals<=0)return r.pdo??100;
  return Math.max(94,Math.min(106,100+(((r.goals_for||0)/totalGoals)-0.5)*30));
}
function refreshRatingDerived(r,date){

  return r;
}

function buildDynamicRoundState(round){
  const nextGames=round.games.map(g=>({...g}));
  const nextOdds=[];
  nextGames.forEach(g=>bookmakers.forEach(bk=>nextOdds.push(genOddsForBookmaker(g,bk.name))));

  const nextPreds=[];
  const nextFlags=[];
  nextGames.forEach(g=>{
    const{home:hp,draw:dp,away:ap}=hockeyGameProbs(g);
    const pw=hp>ap&&hp>dp?'home':ap>dp?'away':'draw';
    nextPreds.push({id:g.id,game_id:g.id,home_win_prob:+hp.toFixed(4),draw_prob:+dp.toFixed(4),away_win_prob:+ap.toFixed(4),predicted_winner:pw,predicted_at:new Date().toISOString(),actual_winner:null,was_correct:null});

    const gRows=nextOdds.filter(x=>x.game_id===g.id);
    const o=gRows.length?{home_odds:Math.max(...gRows.map(x=>x.home_odds)),draw_odds:Math.max(...gRows.map(x=>x.draw_odds)),away_odds:Math.max(...gRows.map(x=>x.away_odds))}:null;
    if(!o)return;
    ['home','draw','away'].forEach(side=>{
      const oddsVal=side==='home'?o.home_odds:side==='draw'?o.draw_odds:o.away_odds;

function applyHockeyRound(index,preserveRatings){
  if(!hasHockeyRounds()||!hockeyRounds[index])return false;
  setHockeyRound(index);
  const round=hockeyRounds[index];
  if(preserveRatings){
    const dynamic=buildDynamicRoundState(round);
    games=dynamic.games;
    predictions=dynamic.predictions;
    valueFlags=dynamic.valueFlags;
    oddsSnapshots=dynamic.oddsSnapshots;
  }else{
    games=round.games.map(g=>({...g}));
    predictions=round.predictions.map(p=>({...p}));
    valueFlags=round.valueFlags.map(v=>({...v}));
    oddsSnapshots=round.oddsSnapshots.filter(x=>bookmakers.some(b=>b.name===x.bookmaker)).map(o=>({...o}));
    ratings=round.ratings.map(r=>refreshRatingDerived({...r},r.date));
  }
  news=[];
  simResults=null;
  pressureTeam='';
  // Staattinen polku (preserveRatings=false) lataa predictions/valueFlags
  // suoraan tiedostosta, joka ei tunne käyttäjän omia tekijöitä. Dynaaminen
  // polku laskee ne jo hockeyGameProbs()in kautta. Sovelletaan siis vain
  // staattisella polulla, jottei sama laskenta tehdä kahdesti.
  if(!preserveRatings)reapplyHockeyFactors();
  return true;
}

function updateEloAfterSim(){
  if(!simResults||!simResults.length)return;
  const K=32;
  const prev = new Map();
  simResults.forEach(r=>{
    const hR=getRating(r.home_team_id);const aR=getRating(r.away_team_id);
    if(!hR||!aR)return;
    ensureRatingState(hR,new Date().toISOString().slice(0,10));
    ensureRatingState(aR,new Date().toISOString().slice(0,10));
    if(!prev.has(hR.team_id))prev.set(hR.team_id,{elo:hR.elo,pdo:hR.pdo??100});
    if(!prev.has(aR.team_id))prev.set(aR.team_id,{elo:aR.elo,pdo:aR.pdo??100});
    const E_h=1/(1+Math.pow(10,(aR.elo-(hR.elo+40))/400));
    let S_h=r.home_score>r.away_score?1:r.home_score<r.away_score?0:0.5;
    const d=K*(S_h-E_h);hR.elo+=d;aR.elo-=d;

    hR.played+=1;aR.played+=1;
    hR.goals_for+=r.home_score;hR.goals_against+=r.away_score;
    aR.goals_for+=r.away_score;aR.goals_against+=r.home_score;
    hR.shots_for=(hR.shots_for??0)+(r.shots_home||0);
    hR.shots_against=(hR.shots_against??0)+(r.shots_away||0);
    aR.shots_for=(aR.shots_for??0)+(r.shots_away||0);
    aR.shots_against=(aR.shots_against??0)+(r.shots_home||0);

    const homeWon=r.home_score>r.away_score;
    const overtime=r.period>3;
    if(!overtime){
      if(homeWon){hR.wins+=1;aR.losses+=1;}
      else if(r.away_score>r.home_score){aR.wins+=1;hR.losses+=1;}
    }else{
      if(homeWon){hR.ot_wins+=1;aR.ot_losses+=1;}
      else if(r.away_score>r.home_score){aR.ot_wins+=1;hR.ot_losses+=1;}
    }

    // Putki ja muotorivi todellisista tuloksista. Jatkoaikavoitto katkaisee
    // häviöputken mutta ei kasvata voittoputkea samalla painolla — se on
    // merkitty omalla kirjaimellaan ('J') jotta ero näkyy.
    const bump=(rr,outcome)=>{
      if(outcome==='V')rr.streak=rr.streak>0?rr.streak+1:1;
      else if(outcome==='H')rr.streak=rr.streak<0?rr.streak-1:-1;
      else rr.streak=0; // jatkoaikatulos nollaa putken kumpaankin suuntaan
      rr.form=[outcome,...(rr.form||[])].slice(0,8);
    };
    const homeOutcome=overtime?'J':homeWon?'V':'H';
    const awayOutcome=overtime?'J':homeWon?'H':'V';
    bump(hR,homeOutcome);
    bump(aR,awayOutcome);

    refreshRatingDerived(hR,new Date().toISOString().slice(0,10));
    refreshRatingDerived(aR,new Date().toISOString().slice(0,10));
    hR.elo_delta=Math.round((hR.elo-prev.get(hR.team_id).elo)*10)/10;
    aR.elo_delta=Math.round((aR.elo-prev.get(aR.team_id).elo)*10)/10;
    hR.pdo_delta=Math.round(((hR.pdo??100)-prev.get(hR.team_id).pdo)*10)/10;
    aR.pdo_delta=Math.round(((aR.pdo??100)-prev.get(aR.team_id).pdo)*10)/10;
  });
  localStorage.setItem('bt_ratings',JSON.stringify(ratings));
}

async function loadData(){
  // Tiketti #31: jalkapallotilassa jääkiekkodataa ei haeta lainkaan.
  // Olennaista: syncBookmakerOdds() jää ajamatta, joten genOddsForBookmaker()
  // ei keksi kertoimia — keksityt ja oikeat kertoimet eivät voi sekoittua.
  if(!isHockey()){
    teams=[];games=[];predictions=[];valueFlags=[];oddsSnapshots=[];ratings=[];news=[];hockeyRounds=[];
    return;
  }
  try{
    const res=await fetch('data/liiga-rounds.json',{cache:'no-store'});
    if(res.ok){
      const file=await res.json();
      if(Array.isArray(file.teams)&&Array.isArray(file.rounds)&&file.rounds.length){
        resetStaleHockeyState(file.generated_at||'unknown');
        teams=file.teams;
        hockeyRounds=file.rounds;
        const sr=localStorage.getItem('bt_ratings');
        if(sr){
          try{ratings=JSON.parse(sr).map(r=>refreshRatingDerived(r,r.date));}catch(e){ratings=[]}
        }
        const targetIndex=Math.min(Math.max(0,hockeyRoundIndex),hockeyRounds.length-1);
        if(ratings.length){if(!applyHockeyRound(targetIndex,true))applyHockeyRound(0,false);}
        else if(!applyHockeyRound(targetIndex,false))applyHockeyRound(0,false);
        return;
      }
    }
  }catch(e){
    console.warn('Liiga-kierrosdataa ei saatu ladattua, kaytetaan fallbackia');
  }
  try{
    const[g,t,p,v,o,r,n]=await Promise.all([fetch(API+'/games').then(r=>r.json()),fetch(API+'/teams').then(r=>r.json()),fetch(API+'/game_predictions').then(r=>r.json()),fetch(API+'/value_flags').then(r=>r.json()),fetch(API+'/odds_snapshots').then(r=>r.json()),fetch(API+'/team_ratings').then(r=>r.json()),fetch(API+'/news_events').then(r=>r.json())]);
    games=g;teams=t;predictions=p;valueFlags=v;oddsSnapshots=(o||[]).filter(x=>bookmakers.some(b=>b.name===x.bookmaker));ratings=r;news=n||[];
  }catch(e){
    console.warn('API unreachable, using embedded fallback data');
    const fb=FALLBACK;
    teams=fb.teams;games=fb.games;predictions=fb.predictions;valueFlags=fb.valueFlags;oddsSnapshots=[];ratings=fb.teamRatings;news=fb.newsEvents;
    const sr=localStorage.getItem('bt_ratings');if(sr)ratings=JSON.parse(sr);
  }
  syncBookmakerOdds();
}

  ].filter(Boolean).join('')}</div>`;

  let oh='';let ph='';
  if(pred.home_win_prob){const h=(pred.home_win_prob*100).toFixed(0),d=(pred.draw_prob*100).toFixed(0),a=(pred.away_win_prob*100).toFixed(0);
    ph=`<div style="font-size:.7rem;margin-top:4px"><span>Malli: ${h}% / ${d}% / ${a}%</span></div><div class="progress-bar"><span class="progress-fill fill-home" style="width:${h}%"></span><span class="progress-fill fill-draw" style="width:${d}%"></span><span class="progress-fill fill-away" style="width:${a}%"></span></div>`}
  const bkRows=getBookmakerRows(g.id);
  if(bkRows.length&&odds){
    const best=odds;
    const head=`<div class="odds-row odds-head"><span>Toimisto</span><span>1</span><span>X</span><span>2</span></div>`;
    // Odotusarvo JOKAISELLE toimistolle, ei vain parhaalle hinnalle — niiden
    // vertailu on koko taulukon pointti. Taustaväri kertoo suosituksen
    // (musta/keltainen/vihreä/kultainen) ja päivittyy heti kun käyttäjä muuttaa
    // omaa arviotaan tai lisää tekijän Kerroinlaskuriin, koska evForOdds()
    // lukee saman hockeyEstimate()n kuin kaikki muukin.
    const rowsHtml=bkRows.map((r,ri)=>{
      const cell=(side,val,label)=>{
        const isBest=val===best[side+'_odds'];
        const ev=evForOdds(g.id,side,val);
        const bg=evBgClass(ev);
        const tip=`${esc(r.bookmaker)} — ${label} ${val.toFixed(2)}${isBest?' (paras hinta)':''}`+(ev==null?'':`\nOdotusarvo ${(ev*100).toFixed(1)} % · ${evLabel(ev)}`);
        return `<button id="bko-${g.id}-${side}-${ri}" class="bk-odds${isBest?' best':''}${bg?' '+bg:''}" onclick="event.stopPropagation();showBetPopup(${g.id},'${side}',${val},${ri})" title="${tip}">${oddsCellInner(val,isBest,ev)}</button>`;
      };
      return`<div class="odds-row"><span class="bk-name" title="${esc(r.bookmaker)}">${esc(r.bookmaker)}</span>${cell('home',r.home_odds,'1')}${cell('draw',r.draw_odds,'X')}${cell('away',r.away_odds,'2')}</div>`;
    }).join('');
    oh=`<div class="odds-list">${head}${rowsHtml}</div>
      <button class="btn btn-block" style="margin-top:6px;font-size:.68rem;min-height:34px;background:oklch(1 1 0/0.08);color:var(--c-text)" onclick="event.stopPropagation();showCalculator(${g.id})">🧮 Kerroinlaskuri — avaa koko kaava ja säädä tekijöitä</button>`;
  }

  // Show bets already placed for this game
  const gameBets=bets.filter(b=>b.game_id===g.id);
  let betsHtml='';
  if(gameBets.length){
    betsHtml='<div style="margin-top:4px;font-size:.65rem;color:var(--c-text-muted)">'+gameBets.map(b=>`<span style="margin-right:8px">🎫 ${b.side.toUpperCase()} ${b.stake.toFixed(0)}€ @ ${b.odds.toFixed(2)}</span>`).join('')+'</div>';
  }

  const estimateCell=(side,label)=>{
    const price=side==='home'?odds?.home_odds:side==='draw'?odds?.draw_odds:odds?.away_odds;
    // Pohjaluku on mallin arvio, kunnes käyttäjä syöttää oman
    const{value:est,isOwn}=hockeyEstimate(g.id,side);
    const value=est==null?'':(Math.round(est*10)/10);
    const edge=hockeyEdge(g.id,side);
    const badge=edge==null?'':`<span class="badge ${edge>0.05?'badge-green':edge>0.03?'badge-yellow':edge<0?'badge-red':'badge-muted'}" style="font-size:.55rem">${edge>0?'+':''}${(edge*100).toFixed(1)}%</span>`;
    const origin=est==null?'':`<div id="ho-${g.id}-${side}" style="font-size:.52rem;color:var(--c-text-muted)">${isOwn?'✍️ oma':'🤖 malli'}</div>`;
    return `<div style="padding:6px;border-radius:8px;background:oklch(1 1 0/0.05);text-align:center"><div style="font-size:.65rem;color:var(--c-text-muted)">${label} @ ${price?.toFixed(2)||'—'}</div><input type="number" id="hm-${g.id}-${side}" value="${value}" min="0" max="100" step="0.1" placeholder="%" title="Pohjaluku on mallin arvio — muuta vapaasti. Tyhjennä palauttaaksesi mallin arvion." style="width:70px;margin:4px auto;padding:5px;border-radius:6px;border:1px solid var(--c-text-muted);background:var(--c-bg);color:var(--c-text);font-size:.75rem;text-align:center" oninput="updateHockeyModel(${g.id},'${side}',this.value)">${origin}<div id="he-${g.id}-${side}" style="font-size:.75rem;font-weight:700;min-height:1.2em">${badge}</div></div>`;
  };
  const estimateHtml=odds?`<div style="font-size:.65rem;color:var(--c-text-muted);margin-top:8px">✍️ Oma arvio (todennäköisyydet %) — pohjana mallin arvio, muuta vapaasti:</div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:4px">${estimateCell('home','1')}${estimateCell('draw','X')}${estimateCell('away','2')}</div><div style="font-size:.6rem;color:var(--c-text-muted);margin-top:4px">Edge = P(arvio) × kerroin − 1. &gt; 3% 🟡 kandidaatti, &gt; 5% 🟢 vahva signaali. Tyhjennä kenttä palauttaaksesi mallin arvion.</div>`:'';

  const hintHtml=`<div style="margin-top:6px;font-size:.62rem;color:var(--c-text-muted);line-height:1.55">
    👆 Klikkaa kerrointa asettaaksesi vedon<br>
    🏦 ${hockeyOddsMode()==='soft'?'Pehmeä bookkeri':'Veikkaus-tyyli'} — ${hockeyOddsMode()==='soft'?'harjoitteluun jätetty enemmän hajontaa':'tiukempi ja konservatiivisempi hinnoittelu'}<br>
    ${vf?`💎 edge yli 3 %${vf.edge>0.05?' · vahva signaali':''}`:'⚫ paras edge alle 3 % — ei ylikerrointa'}
  </div>`;
  // Ei erillistä footer-nappiriviä: kortin yläreunan 📊 Analyysi-nappi avaa
  // saman buildAnalysis()-syväsukelluksen (tunnusluvut+uutiset+analyysi
  // yhdessä) jota kolme footer-nappia kaikki kutsuivat identtisesti — puhdas
  // duplikaatti joka poistettiin.
  return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;font-size:.62rem;color:var(--c-text-muted)"><span>Liiga · ${gameDateLabel(g.date)}</span><span>${currentHockeyRound()?.label||''}</span></div><div class="row" style="margin-top:5px"><span class="matchup">${teamLogo(teams.find(t=>t.id===g.home_team_id))}<strong>${teamNameElo(g.home_team_id)}</strong><span class="vs">–</span><strong>${teamNameElo(g.away_team_id)}</strong>${teamLogo(teams.find(t=>t.id===g.away_team_id))}</span><span style="display:flex;gap:4px;align-items:center">${vfHtml}<button class="btn" style="font-size:.68rem;padding:4px 10px;min-height:30px;border-radius:8px;background:var(--c-accent);color:#000;font-weight:700;white-space:nowrap" onclick="event.stopPropagation();showAnalysis(${g.id})">📊 Analyysi</button></span></div>${factorHtml}${ph}${oh}${betsHtml}${estimateHtml}${hintHtml}<div id="betpop-${g.id}" style="display:none;margin-top:4px"></div></div>`;
}
function showAnalysis(gid){analysisGameId=gid;renderRound();scrollTo(0,0)}
function closeAnalysis(){analysisGameId=null;renderRound()}
function showCalculator(gid){calculatorGameId=gid;renderRound();scrollTo(0,0)}
function closeCalculator(){calculatorGameId=null;renderRound()}

/**
 * 🧮 Kerroinlaskuri — koko kaava auki, tekijät muokattavissa.
 *
 * Ero Analyysi-näkymään: Analyysi on lukemista varten (mitä malli ajattelee
 * ja miksi). Laskuri on kokeilemista varten — käyttäjä lisää tietoa jota
 * mallilla ei ole (loukkaantunut maalivahti, väsymys, mitä tahansa) ja näkee
 * välittömästi miten se muuttaa odotusarvoa jokaisella kertoimella.
 *
 * Tärkeä rajaus: manuaaliset tekijät muuttavat VAIN mallin todennäköisyyttä,
 * eivät kertoimia. Markkina ei tiedä käyttäjän lisäämästä tekijästä — juuri
 * siitä erosta arvo syntyy. Jos tekijät muuttaisivat myös kertoimia, edge
 * pysyisi aina samana eikä työkalu näyttäisi mitään.
 */
function buildCalculator(g){
  const home=teamName(g.home_team_id),away=teamName(g.away_team_id);
  const baseHElo=getRating(g.home_team_id)?.elo||1500;
  const baseAElo=getRating(g.away_team_id)?.elo||1500;
  const factors=hockeyFactors[g.id]||[];
  const hDelta=factorDelta(g.id,'home'),aDelta=factorDelta(g.id,'away');
  const baseProbs=hockeyProbs(baseHElo,baseAElo);
  const adj=hockeyGameProbs(g);
  const odds=getOdds(g.id);
  const bkRows=getBookmakerRows(g.id);
  const HADV=40;
  const totalDiff=(baseHElo+hDelta)+HADV-(baseAElo+aDelta);

  let html=`<div class="card" style="border:2px solid var(--c-accent);margin-bottom:8px">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap">
      <button class="btn" style="font-size:.7rem;padding:5px 12px;min-height:32px;background:oklch(1 1 0/0.1);color:var(--c-text)" onclick="closeCalculator()">← Takaisin</button>
      <span style="font-weight:700;font-size:.9rem">🧮 Kerroinlaskuri</span>
    </div>
    <div style="font-size:.78rem;font-weight:600;margin-bottom:2px">${esc(home)} – ${esc(away)}</div>
    <div style="font-size:.62rem;color:var(--c-text-muted)">Liiga · ${gameDateLabel(g.date)}</div>`;

  // ─ Vaihe 1: lähtö-Elo ja manuaaliset säädöt
  html+=`<div style="margin-top:12px;padding:10px;background:oklch(1 1 0/0.04);border-radius:8px">
    <h4 style="font-size:.78rem;margin-bottom:6px">1️⃣ Voimaluvut ja omat tekijät</h4>
    <div style="font-size:.7rem;line-height:1.9;font-variant-numeric:tabular-nums">
      <div class="row"><span>${esc(home)} kausi-Elo</span><b>${baseHElo.toFixed(0)}</b></div>
      ${hDelta?`<div class="row" style="color:var(--c-warning)"><span>+ omat tekijät</span><b>${hDelta>0?'+':''}${hDelta}</b></div><div class="row" style="border-top:1px dashed oklch(1 1 0/0.15)"><span><b>= käytetty</b></span><b>${(baseHElo+hDelta).toFixed(0)}</b></div>`:''}
      <div class="row" style="margin-top:6px"><span>${esc(away)} kausi-Elo</span><b>${baseAElo.toFixed(0)}</b></div>
      ${aDelta?`<div class="row" style="color:var(--c-warning)"><span>+ omat tekijät</span><b>${aDelta>0?'+':''}${aDelta}</b></div><div class="row" style="border-top:1px dashed oklch(1 1 0/0.15)"><span><b>= käytetty</b></span><b>${(baseAElo+aDelta).toFixed(0)}</b></div>`:''}
    </div>`;

  html+=`<div style="margin-top:10px">
    <div style="font-size:.68rem;font-weight:600;margin-bottom:4px">Vaikuttavat tekijät</div>`;
  if(factors.length){
    html+=factors.map(f=>`<div class="row" style="font-size:.68rem;padding:5px 8px;margin-bottom:4px;background:oklch(1 1 0/0.05);border-radius:6px">
      <span>${f.team==='home'?'🏠':'✈️'} ${esc(f.label)}</span>
      <span style="display:flex;gap:8px;align-items:center">
        <b style="color:${f.delta>0?'var(--c-success)':'var(--c-danger)'}">${f.delta>0?'+':''}${f.delta} Elo</b>
        <button class="btn btn-danger" style="font-size:.55rem;padding:2px 7px;min-height:24px;border-radius:12px" onclick="removeHockeyFactor(${g.id},${f.id})">✕</button>
      </span></div>`).join('');
  }else{
    html+=`<div style="font-size:.65rem;color:var(--c-text-muted);padding:6px 0">Ei omia tekijöitä. Malli käyttää pelkkiä kausi-Elo-lukuja.</div>`;
  }
  html+=`<div style="margin-top:8px;padding:8px;border:1.5px dashed var(--c-accent);border-radius:8px">
    <div style="font-size:.65rem;color:var(--c-text-muted);margin-bottom:6px">Lisää tieto jota mallilla ei ole. Valitse tutkimuksen valmis tekijä tai kirjoita oma:</div>
    <select onchange="applyFactorPreset(${g.id},this.value);this.selectedIndex=0" style="width:100%;min-height:38px;border-radius:6px;border:1px solid oklch(1 1 0/0.15);background:var(--c-bg);color:var(--c-text);padding:6px;font-size:.7rem;margin-bottom:6px">
      <option value="">📋 Valitse tutkimuksesta…</option>
      ${ELO_FACTOR_PRESETS.map((p,i)=>`<option value="${i}">${p.delta>0?'+':''}${p.delta} · ${esc(p.label)} (${esc(p.range)})</option>`).join('')}
    </select>
    <input type="text" id="factor-label-${g.id}" placeholder="esim. Ykkösmaalivahti loukkaantunut" style="width:100%;min-height:38px;padding:7px 10px;border-radius:6px;border:1px solid oklch(1 1 0/0.15);background:var(--c-bg);color:var(--c-text);font-size:.72rem;margin-bottom:6px">
    <div style="display:flex;gap:6px">
      <select id="factor-team-${g.id}" style="flex:1;min-height:38px;border-radius:6px;border:1px solid oklch(1 1 0/0.15);background:var(--c-bg);color:var(--c-text);padding:6px;font-size:.7rem">
        <option value="home">🏠 ${esc(home)}</option>
        <option value="away">✈️ ${esc(away)}</option>
      </select>
      <input type="number" id="factor-delta-${g.id}" placeholder="Elo ±" step="5" style="width:90px;min-height:38px;padding:6px;border-radius:6px;border:1px solid oklch(1 1 0/0.15);background:var(--c-bg);color:var(--c-text);font-size:.72rem;text-align:center">
      <button class="btn btn-primary" style="font-size:.68rem;padding:6px 12px;min-height:38px" onclick="addHockeyFactor(${g.id})">➕ Lisää</button>
    </div>
    <div style="font-size:.58rem;color:var(--c-text-muted);margin-top:6px;line-height:1.5">Esivalinnan luku on vaihteluvälin keskikohta — muuta se vapaasti. Takaisin kokoonpanoon = positiivinen luku.</div>
  </div>`;

  // Tutkimuksen taulukko referenssiksi + sen oma varoitus
  html+=`<details style="margin-top:8px">
    <summary style="font-size:.66rem;color:var(--c-accent);cursor:pointer;padding:4px 0">📚 Tutkimuksen Elo-vaikutustaulukko (SM-liiga Elo-malli)</summary>
    <div class="scroller" style="overflow-x:auto;margin-top:6px">
      <table style="width:100%;border-collapse:collapse;font-size:.62rem">
        <tr style="color:var(--c-text-muted);text-align:left"><th style="padding:3px 6px">Tekijä</th><th style="padding:3px 6px;text-align:right">Vaikutus</th><th style="padding:3px 6px">Huomio</th></tr>
        <tr><td style="padding:3px 6px">Kotietu <span style="color:var(--c-text-muted)">(mallissa jo)</span></td><td style="padding:3px 6px;text-align:right;font-variant-numeric:tabular-nums">+35…+50</td><td style="padding:3px 6px;color:var(--c-text-muted)">Vakio joka kotiottelussa — malli käyttää +${HADV}</td></tr>
        <tr><td style="padding:3px 6px">Maaliero / xG-ero <span style="color:var(--c-text-muted)">(mallissa jo)</span></td><td style="padding:3px 6px;text-align:right">perusajuri</td><td style="padding:3px 6px;color:var(--c-text-muted)">Ohjaa Elo-lukua itseään</td></tr>
        ${ELO_FACTOR_PRESETS.map(p=>`<tr style="border-top:1px solid oklch(1 1 0/0.06)"><td style="padding:3px 6px">${esc(p.label)}</td><td style="padding:3px 6px;text-align:right;font-variant-numeric:tabular-nums;color:${p.delta>0?'var(--c-success)':'var(--c-danger)'}">${esc(p.range)}</td><td style="padding:3px 6px;color:var(--c-text-muted)">${esc(p.note)}</td></tr>`).join('')}
      </table>
    </div>
    <div style="font-size:.6rem;color:var(--c-warning);margin-top:6px;line-height:1.6">
      ⚠️ Tutkimuksen oma varoitus: lukuarvot pohjautuvat NHL:n Elo-malleihin
      (FiveThirtyEight, Hockey Alchemy) eivätkä ole SM-liigalle validoituja.
      Ne ovat lähtöarvoja, jotka pitäisi kalibroida omalla otoksella
      (Elo-ero + tapahtumat + toteutunut lopputulos).
    </div>
  </details></div>`;

  // Maaliodottama omana vaiheena
  const xgc=hockeyExpectedGoals(g);
  html+=`<div style="margin-top:8px;padding:10px;background:oklch(1 1 0/0.04);border-radius:8px">
    <h4 style="font-size:.78rem;margin-bottom:6px">🥅 Maaliodottama</h4>
    <div style="font-size:.68rem;color:var(--c-text-muted);line-height:1.85">
      ${xgc.played>0
        ? `Hyökkäysvoima ja vastustajan puolustus keskiarvoistettuna, kotietu ×${LIIGA_HOME_GOAL_EDGE}:<br>
           <b>${esc(home)} ${xgc.home.toFixed(2)}</b> – <b>${xgc.away.toFixed(2)} ${esc(away)}</b> · yhteensä <b>${xgc.total.toFixed(2)}</b><br>
           <span style="color:var(--c-text-muted)">Sarjan keskiarvo ${LIIGA_GOALS_PER_GAME} maalia/ottelu. Luvut joukkueiden oikeista kausituloksista (${xgc.played} ottelua vähemmän pelanneella).</span>`
        : `<span style="color:var(--c-warning)">Kautta ei ole vielä pelattu — odottama on sarjan keskiarvo ${LIIGA_GOALS_PER_GAME} jaettuna, ei joukkuekohtainen arvio.</span>`}
    </div>
  </div></div>`;

  // ─ Vaihe 2: kaava
  html+=`<div style="margin-top:8px;padding:10px;background:oklch(1 1 0/0.04);border-radius:8px">
    <h4 style="font-size:.78rem;margin-bottom:6px">2️⃣ Todennäköisyyskaava</h4>
    <div style="font-size:.68rem;color:var(--c-text-muted);line-height:1.85">
      Kotietu H = <b>${HADV}</b> Elo-pistettä (Liigassa ~55 % kotivoittoja)<br>
      Kokonaisero = (${(baseHElo+hDelta).toFixed(0)} + ${HADV}) − ${(baseAElo+aDelta).toFixed(0)} = <b style="color:${totalDiff>0?'var(--c-success)':'var(--c-danger)'}">${totalDiff>0?'+':''}${totalDiff.toFixed(0)} pt</b><br><br>
      <b>P(koti, raaka)</b> = 1 / (1 + 10<sup>−${totalDiff.toFixed(0)}/400</sup>) = <b>${((1/(1+Math.pow(10,-totalDiff/400)))*100).toFixed(1)} %</b><br>
      <b>P(tasapeli)</b> = max(12 %, 26 % − |${totalDiff.toFixed(0)}|/1500) = <b>${(adj.draw*100).toFixed(1)} %</b><br>
      <span style="color:var(--c-text-muted)">Raaka kotivoitto skaalataan (1 − tasapeli):llä, jolloin summa on aina tasan 1.</span>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px;text-align:center;font-size:.7rem">
      ${['home','draw','away'].map((s,i)=>{
        const label=['1','X','2'][i];
        const changed=Math.abs(adj[s]-baseProbs[s])>0.0005;
        return `<div style="padding:6px;border-radius:6px;background:oklch(1 1 0/0.06)">
          <div style="color:var(--c-text-muted);font-size:.62rem">${label}</div>
          <div style="font-weight:800;font-size:.85rem">${(adj[s]*100).toFixed(1)} %</div>
          ${changed?`<div style="font-size:.55rem;color:var(--c-warning)">oli ${(baseProbs[s]*100).toFixed(1)} %</div>`:''}
        </div>`;
      }).join('')}
    </div>
  </div>`;

  // ─ Vaihe 3: odotusarvo per toimisto
  if(bkRows.length&&odds){
    html+=`<div style="margin-top:8px;padding:10px;background:oklch(1 1 0/0.04);border-radius:8px">
      <h4 style="font-size:.78rem;margin-bottom:4px">3️⃣ Odotusarvo per kerroin</h4>
      <div style="font-size:.65rem;color:var(--c-text-muted);margin-bottom:8px">Odotusarvo = P(arvio) × kerroin − 1. Kertoimet <b>eivät</b> muutu tekijöistä — markkina ei tiedä niistä, ja juuri siitä erosta arvo syntyy.${['home','draw','away'].some(s=>hockeyEstimate(g.id,s).isOwn)?' <b style="color:var(--c-warning)">Käytössä on oma arviosi, ei mallin.</b>':''}</div>
      <div class="odds-list">
        <div class="odds-row odds-head"><span>Toimisto</span><span>1</span><span>X</span><span>2</span></div>
        ${bkRows.map(r=>{
          const cell=(side,val)=>{
            // Sama evForOdds() kuin kortilla — ei toista laskentaa, ei toista totuutta
            const ev=evForOdds(g.id,side,val);
            const bg=evBgClass(ev);
            return `<span class="bk-odds${bg?' '+bg:''}" style="cursor:default">${oddsCellInner(val,false,ev)}</span>`;
          };
          return `<div class="odds-row"><span class="bk-name">${esc(r.bookmaker)}</span>${cell('home',r.home_odds)}${cell('draw',r.draw_odds)}${cell('away',r.away_odds)}</div>`;
        }).join('')}
      </div>
      <div style="font-size:.62rem;color:var(--c-text-muted);margin-top:8px;line-height:2">
        Ruudun tausta = vetosuositus, teksti = odotusarvon tarkka luku.<br>
        <span class="bk-odds" style="display:inline-flex;padding:1px 7px;min-height:0;font-size:.6rem">musta</span> ei suositusta (alle 3 %, mallin virherajojen sisällä tai negatiivinen)<br>
        <span class="bk-odds value-candidate" style="display:inline-flex;padding:1px 7px;min-height:0;font-size:.6rem">keltainen</span> kandidaatti, yli 3 %<br>
        <span class="bk-odds value-strong" style="display:inline-flex;padding:1px 7px;min-height:0;font-size:.6rem">vihreä</span> vahva signaali, yli 5 %<br>
        <span class="bk-odds value-elite" style="display:inline-flex;padding:1px 7px;min-height:0;font-size:.6rem">kultainen</span> poikkeuksellinen, yli 8 % — epäile ensin mallia, ei markkinaa
      </div>
    </div>`;
  }

  html+=`</div>`;
  return html;
}
function buildAnalysis(g){
  const home=teamName(g.home_team_id),away=teamName(g.away_team_id);
  const hR=getRating(g.home_team_id),aR=getRating(g.away_team_id);
  // Säädetyt Elot samasta lähteestä kuin kortti ja Kerroinlaskuri —
  // muuten tämä näkymä kertoisi eri kaavan kuin se jota oikeasti käytetään
  const gpA=hockeyGameProbs(g);
  const hElo=gpA.hElo,aElo=gpA.aElo;
  const hPdo=hR?.pdo||100,aPdo=aR?.pdo||100;
  const hEloDelta=hR?.elo_delta||0,aEloDelta=aR?.elo_delta||0;
  const hPdoDelta=hR?.pdo_delta||0,aPdoDelta=aR?.pdo_delta||0;
  const hWins=(hR?.wins||0)+(hR?.ot_wins||0),aWins=(aR?.wins||0)+(aR?.ot_wins||0);
  const hRecord=`${hWins}-${hR?.ot_losses||0}-${hR?.losses||0}`;
  const aRecord=`${aWins}-${aR?.ot_losses||0}-${aR?.losses||0}`;
  const hGoals=`${hR?.goals_for||0}-${hR?.goals_against||0}`;
  const aGoals=`${aR?.goals_for||0}-${aR?.goals_against||0}`;
  const hShots=hR?.shots_for!=null&&hR?.shots_against!=null?`${hR.shots_for}-${hR.shots_against}`:'—';
  const aShots=aR?.shots_for!=null&&aR?.shots_against!=null?`${aR.shots_for}-${aR.shots_against}`:'—';
  const odds=getOdds(g.id);const pred=getPred(g.id)||{};
  const vf=valueFlags.find(f=>f.game_id===g.id);
  const eloDiff=hElo-aElo;const hAdv=40;const totalDiff=eloDiff+hAdv;
  const pHome=1/(1+Math.pow(10,-totalDiff/400));
  const pDraw=Math.max(0.12,0.26-Math.abs(totalDiff)/1500);
  const pAway=1-pHome-pDraw;
  let ipHome=null,ipDraw=null,ipAway=null,edgeHome=null,edgeAway=null,edgeDraw=null,margin=null;
  if(odds){
    const sum=1/odds.home_odds+1/odds.draw_odds+1/odds.away_odds;
    margin=((sum-1)*100).toFixed(1);
    ipHome=(1/odds.home_odds)/sum;ipDraw=(1/odds.draw_odds)/sum;ipAway=(1/odds.away_odds)/sum;
    edgeHome=pHome*odds.home_odds-1;edgeDraw=pDraw*odds.draw_odds-1;edgeAway=pAway*odds.away_odds-1;
  }
  const injuries=news.filter(e=>e.confidence>0.5&&(e.team_id===g.home_team_id||e.team_id===g.away_team_id));
  let html='';
  html+=`<div class="card" style="border:2px solid var(--c-accent);margin-bottom:8px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><button class="btn" style="font-size:.7rem;padding:5px 12px;min-height:32px;background:oklch(1 1 0/0.1);color:var(--c-text)" onclick="closeAnalysis()">← Takaisin kierrokseen</button><span style="font-weight:700;font-size:.9rem">📊 ${home} vs ${away}</span></div>`;
  html+=`<div style="margin-bottom:10px;padding:10px;background:oklch(1 1 0/0.04);border-radius:8px"><h4 style="font-size:.8rem;margin-bottom:6px">📚 Dynaamiset kausitunnusluvut</h4><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:.72rem"><div style="padding:6px 8px;background:oklch(1 1 0/0.05);border-radius:8px"><div style="font-weight:700;margin-bottom:3px">${home}</div><div>Ottelut: <b>${hR?.played||0}</b></div><div>Saldo: <b>${hRecord}</b></div><div>Maalit: <b>${hGoals}</b></div><div>Laukaukset: <b>${hShots}</b></div><div>Elo Δ: <b style="color:${hEloDelta>=0?'var(--c-success)':'var(--c-danger)'}">${hEloDelta>=0?'+':''}${hEloDelta.toFixed(1)}</b></div><div>PDO Δ: <b style="color:${hPdoDelta>=0?'var(--c-success)':'var(--c-danger)'}">${hPdoDelta>=0?'+':''}${hPdoDelta.toFixed(1)}</b></div></div><div style="padding:6px 8px;background:oklch(1 1 0/0.05);border-radius:8px"><div style="font-weight:700;margin-bottom:3px">${away}</div><div>Ottelut: <b>${aR?.played||0}</b></div><div>Saldo: <b>${aRecord}</b></div><div>Maalit: <b>${aGoals}</b></div><div>Laukaukset: <b>${aShots}</b></div><div>Elo Δ: <b style="color:${aEloDelta>=0?'var(--c-success)':'var(--c-danger)'}">${aEloDelta>=0?'+':''}${aEloDelta.toFixed(1)}</b></div><div>PDO Δ: <b style="color:${aPdoDelta>=0?'var(--c-success)':'var(--c-danger)'}">${aPdoDelta>=0?'+':''}${aPdoDelta.toFixed(1)}</b></div></div></div><div style="font-size:.66rem;color:var(--c-text-muted);margin-top:6px">${esc(hR?.notes||'')} · ${esc(aR?.notes||'')}</div></div>`;
  // Section 1: Elo comparison + formula
  html+=`<div style="margin-bottom:10px;padding:10px;background:oklch(1 1 0/0.04);border-radius:8px"><h4 style="font-size:.8rem;margin-bottom:6px">📈 Elo-voimaestimaatti & voittotodennäköisyys</h4>
    <div class="row" style="font-size:.75rem;margin:4px 0"><span>${home}: <b>${hElo.toFixed(0)}</b></span><span>${away}: <b>${aElo.toFixed(0)}</b></span></div>
    <div style="font-size:.7rem;color:var(--c-text-muted);line-height:1.7;margin-top:4px">
      ΔElo = ${hElo.toFixed(0)} − ${aElo.toFixed(0)} = <b style="color:${eloDiff>0?'var(--c-success)':'var(--c-danger)'}">${eloDiff>0?'+':''}${eloDiff.toFixed(0)} pt</b> (${eloDiff>0?home:away} hyväksi)<br>
      + kotietu H = ${hAdv} pt → kokonaisero = <b>${Math.abs(totalDiff).toFixed(0)} pt</b><br>
      <br><b>Kaava:</b> P(koti) = 1 / (1 + 10<sup>−(R<sub>K</sub>+H−R<sub>V</sub>)/400</sup>)<br>
      = 1 / (1 + 10<sup>−(${hElo.toFixed(0)}+${hAdv}−${aElo.toFixed(0)})/400</sup>)<br>
      = 1 / (1 + 10<sup>−${totalDiff.toFixed(0)}/400</sup>) = <b style="color:var(--c-accent)">${(pHome*100).toFixed(1)}%</b><br>
      P(taso) = max(12%, 26% − |Δ|/1500) = <b>${(pDraw*100).toFixed(1)}%</b><br>
      P(vieras) = 1 − P(koti) − P(taso) = <b>${(pAway*100).toFixed(1)}%</b>
    </div>
    <div class="progress-bar" style="margin-top:6px;height:8px"><span class="progress-fill fill-home" style="width:${(pHome*100).toFixed(0)}%"></span><span class="progress-fill fill-draw" style="width:${(pDraw*100).toFixed(0)}%"></span><span class="progress-fill fill-away" style="width:${(pAway*100).toFixed(0)}%"></span></div>
    <div style="display:flex;justify-content:space-between;font-size:.65rem;color:var(--c-text-muted);margin-top:2px"><span>1: ${(pHome*100).toFixed(1)}%</span><span>X: ${(pDraw*100).toFixed(1)}%</span><span>2: ${(pAway*100).toFixed(1)}%</span></div>
  </div>`;
  // Section 2: PDO
  html+=`<div style="margin-bottom:10px;padding:10px;background:oklch(1 1 0/0.04);border-radius:8px"><h4 style="font-size:.8rem;margin-bottom:6px">📉 PDO — yli-/alisuoritusindikaattori</h4>
    <div class="row" style="font-size:.75rem"><span>${home}: <b>${hPdo.toFixed(1)}</b> <span class="badge ${hPdo>102?'badge-green':hPdo<98?'badge-red':'badge-muted'}" style="font-size:.55rem">${hPdo>102?'Ylisuorittaa':hPdo<98?'Alisuorittaa':'Normaali'}</span></span><span>${away}: <b>${aPdo.toFixed(1)}</b> <span class="badge ${aPdo>102?'badge-green':aPdo<98?'badge-red':'badge-muted'}" style="font-size:.55rem">${aPdo>102?'Ylisuorittaa':aPdo<98?'Alisuorittaa':'Normaali'}</span></span></div>
    <div style="font-size:.7rem;color:var(--c-text-muted);margin-top:4px"><b>PDO = LS% + SV%</b> (laukaisuprosentti + torjuntaprosentti). Liigan keskiarvo ≈ 100.<br>Yli 102 → joukkue ylisuorittaa (todennäköinen notkahdus tulossa). Alle 98 → alisuorittaa (todennäköinen nousu).<br>PDO regressoituu <b>aina</b> kohti 100 — kyseessä on tilastollinen väistämättömyys, ei mielipide.</div>
  </div>`;
  // Section 3: Edge & value
  if(odds){
    html+=`<div style="margin-bottom:10px;padding:10px;background:oklch(1 1 0/0.04);border-radius:8px"><h4 style="font-size:.8rem;margin-bottom:6px">💰 Edge — missä markkina on väärässä?</h4>
      <div style="font-size:.7rem;color:var(--c-text-muted);margin-bottom:6px">Markkinan marginaali: <b>${margin}%</b> (kirjanpitäjän kate). Implikoitu tn = (1/kerroin) / sum(1/kertoimet).</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;font-size:.7rem;text-align:center">
        <div style="padding:4px;border-radius:4px;background:oklch(1 1 0/0.06)"><b>1 (${odds.home_odds.toFixed(1)})</b><br><span style="font-size:.6rem">Impl: ${(ipHome*100).toFixed(1)}%</span><br><span style="font-size:.6rem">Malli: ${(pHome*100).toFixed(1)}%</span><br><span style="font-weight:700;color:${edgeHome>0.03?'var(--c-success)':'var(--c-danger)'}">Edge: ${(edgeHome*100).toFixed(1)}%</span></div>
        <div style="padding:4px;border-radius:4px;background:oklch(1 1 0/0.06)"><b>X (${odds.draw_odds.toFixed(1)})</b><br><span style="font-size:.6rem">Impl: ${(ipDraw*100).toFixed(1)}%</span><br><span style="font-size:.6rem">Malli: ${(pDraw*100).toFixed(1)}%</span><br><span style="font-weight:700;color:${edgeDraw>0.03?'var(--c-success)':'var(--c-danger)'}">Edge: ${(edgeDraw*100).toFixed(1)}%</span></div>
        <div style="padding:4px;border-radius:4px;background:oklch(1 1 0/0.06)"><b>2 (${odds.away_odds.toFixed(1)})</b><br><span style="font-size:.6rem">Impl: ${(ipAway*100).toFixed(1)}%</span><br><span style="font-size:.6rem">Malli: ${(pAway*100).toFixed(1)}%</span><br><span style="font-weight:700;color:${edgeAway>0.03?'var(--c-success)':'var(--c-danger)'}">Edge: ${(edgeAway*100).toFixed(1)}%</span></div>
      </div>
      <div style="font-size:.7rem;color:var(--c-text-muted);margin-top:6px"><b>Edge = P(malli) × kerroin − 1.</b> Positiivinen arvo = markkina aliarvioi kohteen tilastollista todennäköisyyttä.<br>⏺️ Edge > 3% → ylikerroinkandidaatti 🟡<br>⏺️ Edge > 5% → vahva signaali 🟢<br>⏺️ Edge < 0% → markkina yliarvioi, ei vetoa 🔴</div>
    </div>`;
  }
  // Section 4: Injuries
  if(injuries.length){
    html+=`<div style="margin-bottom:10px;padding:10px;background:oklch(1 1 0/0.04);border-radius:8px"><h4 style="font-size:.8rem;margin-bottom:6px">🤕 Loukkaantumiset & tapahtumat</h4>`;
    injuries.forEach(e=>{
      const t=teamName(e.team_id);const typeLabel=e.event_type==='injury'?'Loukkaantuminen':e.event_type==='hot_streak'?'Kuuma putki':e.event_type==='lineup_change'?'Kokoonpanomuutos':e.event_type==='bench'?'Penkitys':e.event_type;
      html+=`<div style="font-size:.7rem;padding:4px 0;border-bottom:1px dashed oklch(1 1 0/0.1)"><b>${t}</b>: ${typeLabel} (varmuus ${(e.confidence*100).toFixed(0)}%)<br><span style="color:var(--c-text-muted);font-size:.6rem">Lähde: ${e.source_url||newsSources[Math.floor(Math.random()*newsSources.length)]}</span></div>`;
    });
    html+='</div>';
  }
  // Section 5: News sources reference
  html+=`<div style="margin-bottom:10px;padding:10px;background:oklch(1 1 0/0.04);border-radius:8px"><h4 style="font-size:.8rem;margin-bottom:6px">📰 Seuratut tietolähteet</h4>
    <div style="font-size:.65rem;color:var(--c-text-muted);line-height:1.6">${newsSources.map(s=>`<div>📎 ${s}</div>`).join('')}</div>
    <div style="font-size:.65rem;color:var(--c-text-muted);margin-top:4px">Uutisikkuna: jos high-confidence-uutinen (< 30 min vanha) eikä kerroin ole liikkunut → informaatioylivoima markkinaan nähden.</div>
  </div>`;
  // Section 6: What a pro bettor tracks
  html+=`<div style="padding:10px;background:oklch(1 1 0/0.04);border-radius:8px"><h4 style="font-size:.8rem;margin-bottom:6px">🧠 Mitä ammattimainen vedonlyöjä seuraa?</h4>
    <div style="font-size:.65rem;color:var(--c-text-muted);line-height:1.7">
      <div>🏒 <b>Elo</b> — pitkän aikavälin voimaestimaatti, reagoi hitaasti (K=32). Paras perusmittari.</div>
      <div>📉 <b>PDO</b> — paljastaa tilapäisen yli-/alisuorituksen. Keskiarvoon regressoituva.</div>
      <div>🔥 <b>Z-score</b> — pelaajan nykykunto vs. kauden keskiarvo. |z| > 1.5 = poikkeava.</div>
      <div>💎 <b>Edge</b> — mallin ja markkinan välinen ero. Positiivinen = vedonlyöntiarvoa.</div>
      <div>🤕 <b>Loukkaantumiset</b> — avainpelaajan puutos muuttaa joukkueen dynamiikkaa.</div>
      <div>🏠 <b>Kotietu</b> — Liigassa noin 55% kotivoittoja. +30–50 Elo-pisteen arvoinen.</div>
      <div>⏱️ <b>Otteluruuhka</b> — back-to-back-pelit heikentävät suoritusta.</div>
      <div>📊 <b>Laukausmäärät</b> — Corsi/Fenwick (ei vielä tässä versiossa).</div>
      <div>💰 <b>Kelly-kriteeri</b> — optimipanos = (bp−q)/b. Murto-Kelly (25–50%) käytännössä.</div>
      <div>🔄 <b>Markkinaliikkeet</b> — mihin suuntaan kerroin liikkuu ennen peliä?</div>
    </div>
  </div>`;
  html+='</div>';
  html+=renderUpcoming(g);
  return html;
}
function getPred(gid){return simResults?simResults.find(r=>r.game_id===gid):predictions.find(p=>p.game_id===gid)}
function renderSimGame(r){
  const h=teamName(r.home_team_id),a=teamName(r.away_team_id);
  const ot=r.period>3?' (JA/RL)':'';
  const periodLbl=r.winner===null?(r.period===1?'1. erä käynnissä':r.period===2?'2. erä käynnissä':r.period===3?'3. erä käynnissä':'Jatkoaika käynnissä'):'';
  const periodHtml=periodLbl?`<div style="font-size:.6rem;color:var(--c-accent);font-weight:600;margin-bottom:2px">⏱️ ${periodLbl}</div>`:'';
  let sc='';if(r.scorers&&r.scorers.length)sc='<div class="goal-list">'+r.scorers.map(s=>`<span class="scorer-emoji">🥅</span> ${s.player} (${s.period}.erä ${s.time})`).join('<br>')+'</div>';
  let pe='';if(r.penalties&&r.penalties.length)pe='<div class="penalty-row">🚨 '+r.penalties.map(p=>`${p.team_short} ${p.min}min (${p.reason})`).join(' | ')+'</div>';
  let pp='';if(r.pp_goals_home!=null)pp=`<div style="font-size:.65rem;color:var(--muted);margin-top:3px">YV: ${h} ${r.pp_goals_home}/${r.pp_chances_home} — ${a} ${r.pp_goals_away}/${r.pp_chances_away}</div>`;
  const w=r.home_score>r.away_score?'fill-home':r.away_score>r.home_score?'fill-away':'fill-draw';

  // Otsakepillerit myös simulaatiokortille: putket ja maaliodottama.
  // Odottama on tässä erityisen kiinnostava, koska sen VIERESSÄ on toteuma —
  // näkee heti menikö ottelu yli vai alle odotuksen.
  const simGame=games.find(x=>x.id===r.game_id)||{home_team_id:r.home_team_id,away_team_id:r.away_team_id,id:r.game_id};
  const sxg=hockeyExpectedGoals(simGame);
  const actual=(r.home_score||0)+(r.away_score||0);
  const settled=r.winner!==null;
  const overUnder=settled?(actual>sxg.total+0.5?'yli':actual<sxg.total-0.5?'alle':'osui'):null;
  const sPill=(icon,text,tone)=>`<span class="factor-pill tone-${tone}">${icon} ${esc(text)}</span>`;
  const hSt=streakLabel(getRating(r.home_team_id)),aSt=streakLabel(getRating(r.away_team_id));
  const simPills=`<div class="factor-pills" style="margin-top:5px">${[
    sPill('🥅',`Odottama ${sxg.home.toFixed(1)} – ${sxg.away.toFixed(1)} (yht. ${sxg.total.toFixed(1)})`+(settled?` · toteuma ${actual} ${overUnder}`:''),
      overUnder==='osui'?'success':overUnder?'warning':'muted'),
    hSt?sPill(getRating(r.home_team_id).streak>0?'🔥':'❄️',`${h}: ${hSt}`,getRating(r.home_team_id).streak>0?'success':'danger'):null,
    aSt?sPill(getRating(r.away_team_id).streak>0?'🔥':'❄️',`${a}: ${aSt}`,getRating(r.away_team_id).streak>0?'success':'danger'):null,
  ].filter(Boolean).join('')}</div>`;

  return `<div class="card">${periodHtml}<div class="row"><span class="matchup">${teamLogo(teams.find(t=>t.id===r.home_team_id),22)} ${teamNameElo(r.home_team_id)}</span><span style="font-size:1.2rem;font-weight:800">${r.home_score} - ${r.away_score}${ot}</span><span class="matchup">${teamNameElo(r.away_team_id)} ${teamLogo(teams.find(t=>t.id===r.away_team_id),22)}</span></div>${simPills}<div class="progress-bar" style="margin-top:6px;height:6px"><span class="progress-fill ${w}" style="width:${r.home_score/(r.home_score+r.away_score||1)*100}%"></span></div>${sc}${pe}${pp}<div style="font-size:.65rem;color:var(--muted);margin-top:3px">🏟️ Laukaukset: ${teamNameElo(r.home_team_id)} ${r.shots_home||0} - ${r.shots_away||0} ${teamNameElo(r.away_team_id)}</div></div>`;
}

function togglePressure(id){pressureTeam=pressureTeam===String(id)?'':String(id);save();renderTracker();toast(pressureTeam?'🔥 '+teamName(id)+' painaa päälle!':'🔥 Paine poistettu')}

function showBetPopup(gid,side,odds,bkIdx){
  if(simResults){toast('⚠️ Kierros simuloitu — käynnistä uudelleen');return}
  const el=document.getElementById('betpop-'+gid);
  if(el.style.display==='block'){el.style.display='none';return}
  const g=getGame(gid);const home=teamName(g?.home_team_id),away=teamName(g?.away_team_id);
  const sideLabel=side==='home'?home:side==='away'?away:'Tasapeli';
  const bk=bkIdx!=null?getBookmakerRows(gid)[bkIdx]?.bookmaker:null;
  const customEdge=hockeyEdge(gid,side);
  const customNote=customEdge==null?'':customEdge>0.03?`<div style="font-size:.6rem;color:var(--c-success);margin-bottom:5px">💡 Oma arvio: edge ${(customEdge*100).toFixed(1)} %${customEdge>0.05?' · vahva signaali':''}</div>`:`<div style="font-size:.6rem;color:${customEdge<0?'var(--c-danger)':'var(--c-text-muted)'};margin-bottom:5px">✍️ Oma arvio: edge ${(customEdge*100).toFixed(1)} %</div>`;
  el.style.display='block';
  el.innerHTML=`<div style="padding:6px;background:oklch(1 1 0/0.06);border-radius:8px">
    <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px">
      <span style="font-weight:600;font-size:.8rem;min-width:50px">${side.toUpperCase()}</span>
      <span style="font-size:.75rem;color:var(--c-text-muted)">${sideLabel} @ ${odds.toFixed(2)}${bk?' • '+esc(bk):''}</span>
    </div>
    ${customNote}
    <div style="display:flex;gap:4px;margin-bottom:6px">
      <button class="btn" style="flex:1;font-size:.65rem;padding:4px;min-height:28px;background:oklch(1 1 0/0.1);color:var(--c-text)" onclick="event.stopPropagation();setStake(${gid},10)">10€</button>
      <button class="btn" style="flex:1;font-size:.65rem;padding:4px;min-height:28px;background:oklch(1 1 0/0.1);color:var(--c-text)" onclick="event.stopPropagation();setStake(${gid},25)">25€</button>
      <button class="btn" style="flex:1;font-size:.65rem;padding:4px;min-height:28px;background:oklch(1 1 0/0.1);color:var(--c-text)" onclick="event.stopPropagation();setStake(${gid},100)">100€</button>
    </div>
    <div style="display:flex;gap:6px;align-items:center">
      <input type="number" id="popstake-${gid}" value="10" min="1" max="${bankroll.toFixed(0)}" style="flex:1;padding:6px;border-radius:4px;border:1px solid var(--c-text-muted);background:var(--c-bg);color:var(--c-text);font-size:.75rem;text-align:center">
      <span style="font-size:.7rem;color:var(--c-text-muted)">€</span>
      <button class="btn btn-success" style="font-size:.7rem;padding:6px 14px;min-height:36px" onclick="event.stopPropagation();confirmPopupBet(${gid},'${side}',${odds},${bkIdx!=null?bkIdx:-1})">✅ Veto</button>
    </div>
  </div>`;
}

function setStake(gid,amount){
  const inp=document.getElementById('popstake-'+gid);
  if(inp)inp.value=String(amount);
}

function confirmPopupBet(gid,side,odds,bkIdx){
  const stake=parseFloat(document.getElementById('popstake-'+gid)?.value||'0');
  if(!stake||stake<=0||stake>bankroll){toast('⚠️ Virheellinen panos');return}
  const bookmaker=bkIdx!=null&&bkIdx>=0?getBookmakerRows(gid)[bkIdx]?.bookmaker||null:null;
  bankroll-=stake;bets.push({id:Date.now(),game_id:gid,side,odds,stake,bookmaker});
  save();updateBankroll();renderRound();renderSlip();updateSlipBadge();
  document.getElementById('betpop-'+gid).style.display='none';
  toast(`✅ Veto: ${side.toUpperCase()} ${stake.toFixed(2)}€ @ ${odds.toFixed(2)}`)
}

function placeBet(gid,side,odds){

  if(!stake||stake<=0||stake>bankroll){toast('⚠️ Virheellinen panos');return}

}

function runSimulation(){
  // Jalkapallon simulaatio on oma moduulinsa; se ei vaadi vetoja, koska
  // ottelutulokset ovat kiinnostavia myös ilman panosta
  if(!isHockey()){const b=document.getElementById('sim-btn');if(b)b.style.display='block';if(window.BTT)window.BTT.run();return}
  switchTab('tracker');
  const b=document.getElementById('sim-btn');
  b.textContent='🏒 Simuloidaan...';b.className='btn btn-primary btn-block';b.disabled=true;
  const upcoming=games.filter(g=>g.status==='upcoming');
  simResults=upcoming.map(g=>{
    const homeScore=g.actual_home_score??0,awayScore=g.actual_away_score??0;
    const period=g.result_type&&g.result_type!=='RT'?4:3;
    const winner=period>3?'draw':homeScore>awayScore?'home':awayScore>homeScore?'away':'draw';
    const baseShotsHome=Math.max(20,homeScore*6+18+(g.home_team_id%5));
    const baseShotsAway=Math.max(20,awayScore*6+17+(g.away_team_id%5));
    const scorers=[];
    const penalties=[];
    const homePlayers=['Lehterä','Savinainen','Tanus','Keskinen','Puhakka','Räsänen','Mäenalanen','Kemiläinen'];
    const awayPlayers=['Suomi','Ikonen','Turunen','Tyrväinen','Nurmi','Oksanen','Ruohomaa','Palve'];
    for(let i=0;i<homeScore;i++)scorers.push({player:homePlayers[i%homePlayers.length],team:teamName(g.home_team_id),period:1+Math.min(2,i%3),time:`${1+Math.min(2,i%3)}.erä ${String(4+i*3).padStart(2,'0')}:${String((i*11)%60).padStart(2,'0')}`});
    for(let i=0;i<awayScore;i++)scorers.push({player:awayPlayers[i%awayPlayers.length],team:teamName(g.away_team_id),period:1+Math.min(2,i%3),time:`${1+Math.min(2,i%3)}.erä ${String(6+i*3).padStart(2,'0')}:${String((i*13)%60).padStart(2,'0')}`});
    const penaltyReasons=['Koukkaaminen','Kampitus','Kiinnipitäminen','Poikittainen maila'];
    const penaltyCount=Math.max(1,Math.min(5,Math.abs(homeScore-awayScore)+2));
    for(let i=0;i<penaltyCount;i++)penalties.push({team_short:(i%2===0?teamName(g.home_team_id):teamName(g.away_team_id)).substring(0,3).toUpperCase(),min:2,reason:penaltyReasons[i%penaltyReasons.length]});
    const homePP=Math.max(0,Math.min(homeScore,Math.floor(homeScore/2)));
    const awayPP=Math.max(0,Math.min(awayScore,Math.floor(awayScore/2)));
    return{game_id:g.id,home_team_id:g.home_team_id,away_team_id:g.away_team_id,home_score:homeScore,away_score:awayScore,winner,period,scorers:scorers.sort((a,b)=>a.period-b.period),penalties,shots_home:baseShotsHome,shots_away:baseShotsAway,pp_chances_home:homePP+1,pp_chances_away:awayPP+1,pp_goals_home:homePP,pp_goals_away:awayPP};
  });
  renderTrackerLive();
  resolveBets();updateEloAfterSim();save();
  b.textContent='🔄 Simuloi uudelleen';b.className='btn btn-primary btn-block';b.disabled=false;
  renderRoundReport();
  toast('🏒 Kierros simuloitu viime kauden oikeilla tuloksilla');
}

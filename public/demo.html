<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>BetTracker — Demo</title>
<!-- Cinzel: kaiverrettu, kasinokylttien näköinen serif. Ladataan aina (pieni
     woff2), mutta näkyy vain kasino-teemassa — oletusteema ei viittaa siihen. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<style>
/* === BetTracker Design System — OKLCH + Fluid + Glass === */
:root{
  --c-bg: oklch(0.12 0.02 260);
  --c-surface: oklch(0.17 0.02 260);
  --c-surface-hover: oklch(0.22 0.03 260);
  --c-text: oklch(0.92 0.01 260);
  --c-text-muted: oklch(0.55 0.02 260);
  --c-accent: oklch(0.62 0.18 240);
  --c-success: oklch(0.62 0.20 145);
  --c-danger: oklch(0.52 0.22 25);
  --c-warning: oklch(0.72 0.16 85);
  --c-orange: oklch(0.58 0.18 50);
  --radius-sm: 8px; --radius-md: clamp(10px, 2vw, 16px); --radius-pill: 20px;
  --shadow-card: 0 1px 3px rgba(0,0,0,.4);
  --shadow-elevated: 0 4px 16px rgba(0,0,0,.5);
  --touch-target: 44px;
  --body-bg-image: none;
  --font-display: inherit;
}
/* === Vaihtoehtoinen teema: "Kasino" ===
   Sama token-rajapinta kuin oletusteemalla (system) — vain arvot vaihtuvat.
   Yksikään komponentti ei tiedä kummasta teemasta on kyse; ne lukevat aina
   samoja --c-*-muuttujia. Aihe: pelipöydän vihreä huopa, messinkiset reunat
   ja pelimerkin kulta — kaiverrettu Cinzel-otsikkofontti antaa kylttimäisen
   tunnun ilman että yksikään numero (kertoimet, Elo, kassa) siirtyy siihen,
   koska luettavuus dataile menee tyylin edelle.
   Valinta tallentuu bt_ui_theme-avaimeen, oletus 'system' koskematta. */
:root[data-ui-theme="casino"]{
  --c-bg: oklch(0.15 0.045 155);
  --c-surface: oklch(0.205 0.05 155);
  --c-surface-hover: oklch(0.27 0.055 155);
  --c-text: oklch(0.95 0.02 85);
  --c-text-muted: oklch(0.66 0.03 100);
  --c-accent: oklch(0.76 0.14 85);
  --c-success: oklch(0.68 0.16 150);
  --c-danger: oklch(0.58 0.20 25);
  --c-warning: oklch(0.74 0.15 70);
  --c-orange: oklch(0.63 0.18 45);
  --shadow-card: 0 1px 3px rgba(0,0,0,.5);
  --shadow-elevated: 0 4px 20px rgba(0,0,0,.55), 0 0 0 1px oklch(0.76 0.14 85 / 0.10);
  --font-display: 'Cinzel', Georgia, serif;
  --body-bg-image:
    radial-gradient(1100px 700px at 12% -8%, oklch(0.30 0.06 155 / 0.6), transparent 58%),
    radial-gradient(800px 650px at 108% 15%, oklch(0.76 0.14 85 / 0.07), transparent 55%),
    radial-gradient(1400px 900px at 50% 110%, oklch(0.05 0.02 155 / 0.55), transparent 60%),
    repeating-linear-gradient(135deg, oklch(1 0 0 / 0.022) 0 2px, transparent 2px 30px),
    repeating-linear-gradient(45deg, oklch(1 0 0 / 0.022) 0 2px, transparent 2px 30px);
}
:root[data-ui-theme="casino"] .glass-header{
  background:oklch(0.15 0.045 155 / 0.9);
  border-bottom:2px solid transparent;
  border-image:linear-gradient(90deg, transparent, oklch(0.76 0.14 85 / 0.7) 20%, oklch(0.76 0.14 85 / 0.7) 80%, transparent) 1;
  box-shadow:0 1px 0 oklch(0.76 0.14 85 / 0.15);
}
:root[data-ui-theme="casino"] .glass-header h1{
  font-family:var(--font-display);letter-spacing:.03em;text-transform:uppercase;font-size:clamp(0.95rem,2.6vw,1.15rem);
}
:root[data-ui-theme="casino"] h3{font-family:var(--font-display);letter-spacing:.02em}
/* Otteluportti näyttää kirjaimellisesti kortilta: hienovarainen maila-vesileima
   nurkassa ja kullan sävyinen reunaviiva. Rajattu #round-games:iin, jotta
   Admin- ja modaalikortit pysyvät rauhallisina eikä koristelu leviä joka paikkaan. */
:root[data-ui-theme="casino"] #round-games .card{
  position:relative;
  border-color:oklch(0.76 0.14 85 / 0.16);
  background:linear-gradient(165deg, oklch(0.225 0.05 155), oklch(0.185 0.046 155));
}
:root[data-ui-theme="casino"] #round-games .card::before{
  content:'♠';position:absolute;top:8px;right:12px;
  font-family:var(--font-display);font-size:1.05rem;color:oklch(0.76 0.14 85 / 0.16);
  pointer-events:none;line-height:1;
}
:root[data-ui-theme="casino"] .card{border-color:oklch(0.76 0.14 85 / 0.12)}
:root[data-ui-theme="casino"] .matchup strong{font-family:var(--font-display);font-weight:700;letter-spacing:.01em}
/* Elo-luku pysyy järjestelmäfontissa vaikka periytyisi Cinzelin alta —
   numerot eivät saa muuttua tyylin takia */
:root[data-ui-theme="casino"] .matchup strong span{font-family:system-ui,sans-serif}
:root[data-ui-theme="casino"] .btn-primary{
  background:linear-gradient(180deg, oklch(0.82 0.13 85), oklch(0.68 0.15 78));
  color:oklch(0.16 0.03 85);font-weight:700;letter-spacing:.01em;
  box-shadow:0 0 0 1px oklch(0.86 0.11 85 / 0.55), inset 0 1px 0 oklch(1 0.02 85 / 0.4), var(--shadow-card);
}
:root[data-ui-theme="casino"] .btn:hover{box-shadow:0 0 0 1px oklch(0.76 0.14 85 / 0.4), var(--shadow-elevated)}
:root[data-ui-theme="casino"] .tabs{background:oklch(0.12 0.04 155 / 0.4);border-radius:var(--radius-md)}
:root[data-ui-theme="casino"] .tab{font-family:var(--font-display);letter-spacing:.02em}
:root[data-ui-theme="casino"] .tab.active{
  background:linear-gradient(180deg, oklch(0.82 0.13 85), oklch(0.68 0.15 78));color:oklch(0.16 0.03 85);
  box-shadow:inset 0 1px 0 oklch(1 0.02 85 / 0.5), 0 2px 6px oklch(0.76 0.14 85 / 0.35);
}
:root[data-ui-theme="casino"] .badge{border:1px solid oklch(1 0 0 / 0.18)}
:root[data-ui-theme="casino"] .badge-green{background:linear-gradient(180deg, oklch(0.72 0.17 150), oklch(0.60 0.18 145))}
:root[data-ui-theme="casino"] .badge-yellow{background:linear-gradient(180deg, oklch(0.80 0.14 85), oklch(0.68 0.16 78))}
:root[data-ui-theme="casino"] .bk-odds{border-color:oklch(0.76 0.14 85 / 0.22)}
:root[data-ui-theme="casino"] .bk-odds.best{box-shadow:0 0 0 2px oklch(0.76 0.14 85 / 0.55), inset 0 0 10px oklch(0.76 0.14 85 / 0.12);border-color:transparent}
:root[data-ui-theme="casino"] ::selection{background:oklch(0.76 0.14 85 / 0.35)}
:root[data-ui-theme="casino"] :focus-visible{outline-color:oklch(0.76 0.14 85)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:100%;-webkit-text-size-adjust:100%}
body{
  font-family:system-ui,-apple-system,sans-serif;
  background:var(--c-bg) var(--body-bg-image);background-attachment:fixed;color:var(--c-text);
  padding:0;max-width:500px;margin:0 auto;padding-bottom:80px;
  line-height:1.5;font-size:clamp(0.875rem, 1.5vw, 1rem);
}
/* Glass header */
.glass-header{
  position:sticky;top:0;z-index:100;
  background:oklch(0.12 0.02 260 / 0.85);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding:clamp(8px,2vw,12px) clamp(12px,3vw,16px);
  border-bottom:1px solid oklch(1 0 0 / 0.06);
  text-align:center;
}
.glass-header h1{font-size:clamp(1rem,3vw,1.3rem);font-weight:800;letter-spacing:-0.02em}
.demo-badge{display:inline-block;background:var(--c-warning);color:#000;font-size:clamp(0.55rem,1vw,0.65rem);padding:1px 8px;border-radius:var(--radius-pill);font-weight:700;margin-left:6px;vertical-align:middle}
/* Bankroll bar */
.bankroll-bar{
  position:sticky;top:clamp(48px,8vw,56px);z-index:99;
  background:var(--c-surface);padding:clamp(6px,1.5vw,10px) clamp(10px,2vw,14px);
  display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid oklch(1 0 0 / 0.04);
}
.bankroll-amount{font-weight:800;font-size:clamp(1rem,2.5vw,1.2rem)}
.bankroll-amount.positive{color:var(--c-success)}.bankroll-amount.negative{color:var(--c-danger)}
/* Tabs — rivittyvät, eivät vieri
   Aiemmin palkki oli overflow-x:auto piilotetulla vierityspalkilla. Kapealla
   ruudulla Admin jäi reunan taakse ilman mitään vihjettä siitä että sinne
   pääsee — asetukset ja teemanvaihto olivat käytännössä löytymättömissä.
   Rivitys näyttää kaikki välilehdet kerralla eikä vaadi arvaamaan. */
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:clamp(6px,1.5vw,10px)}
.tab{
  flex:1 1 auto;min-height:var(--touch-target);
  padding:6px clamp(6px,1.6vw,14px);
  background:var(--c-surface);border:none;color:var(--c-text-muted);
  border-radius:var(--radius-sm);cursor:pointer;
  font-size:clamp(0.65rem,1.2vw,0.75rem);font-weight:500;white-space:nowrap;
  transition:all .2s ease;
}
.tab:hover{background:var(--c-surface-hover);color:var(--c-text)}
.tab.active{background:var(--c-accent);color:#000;font-weight:600}
/* Views */
.view{display:none;padding:clamp(8px,2vw,12px);animation:fadeIn .25s ease}
.view.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
/* Cards */
.card{
  background:var(--c-surface);border-radius:var(--radius-md);
  padding:clamp(10px,2.5vw,14px);margin-bottom:clamp(6px,1.5vw,10px);
  box-shadow:var(--shadow-card);
  border:1px solid oklch(1 0 0 / 0.04);
  transition:transform .15s ease,box-shadow .15s ease;
}
.card:hover{transform:translateY(-1px);box-shadow:var(--shadow-elevated)}
.row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
/* Badges */
.badge{font-size:clamp(0.55rem,1vw,0.65rem);padding:2px 8px;border-radius:var(--radius-pill);font-weight:600}
.badge-green{background:var(--c-success);color:#000}.badge-yellow{background:var(--c-warning);color:#000}.badge-red{background:var(--c-danger);color:#fff}.badge-muted{background:var(--c-text-muted);color:#fff}.badge-orange{background:var(--c-orange);color:#fff}
/* Metrics */
.metric{font-size:clamp(1.1rem,3vw,1.4rem);font-weight:800;font-variant-numeric:tabular-nums}
.metric-label{font-size:clamp(0.6rem,1vw,0.7rem);color:var(--c-text-muted)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:clamp(6px,1.5vw,8px)}
/* Team logo */
.team-logo{width:clamp(24px,6vw,32px);height:clamp(24px,6vw,32px);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:clamp(0.55rem,1.5vw,0.7rem);color:#fff;flex-shrink:0}
/* Elo-luku suluissa kasvattaa nimeä — rivittyminen estää sen että
   pitkä nimipari työntäisi value-merkin kortin reunan yli */
.matchup{display:flex;align-items:center;gap:6px;font-size:clamp(0.8rem,1.5vw,0.9rem);flex-wrap:wrap}
.matchup .vs{margin:0 2px;color:var(--c-text-muted);font-size:0.7em}
/* Tekijäpillerit (tiketti #39-jatko): kaikki analyysiin vaikuttava tieto
   näkyviin kortin otsakkeessa ilman että pitää avata mitään osiota. */
.factor-pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.factor-pill{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:999px;font-size:.58rem;font-weight:600;white-space:nowrap;border:1px solid oklch(1 0 0 / 0.14);background:oklch(1 0 0 / 0.06);color:var(--c-text)}
.factor-pill.tone-success{background:oklch(0.62 0.20 145 / 0.16);border-color:oklch(0.62 0.20 145 / 0.5)}
.factor-pill.tone-warning{background:oklch(0.72 0.16 85 / 0.16);border-color:oklch(0.72 0.16 85 / 0.5)}
.factor-pill.tone-danger{background:oklch(0.52 0.22 25 / 0.16);border-color:oklch(0.52 0.22 25 / 0.5)}
/* Bookmaker odds list (kierroskortti) */
.odds-list{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.odds-row{display:grid;grid-template-columns:minmax(0,1fr) 1fr 1fr 1fr;gap:4px;align-items:center}
.odds-head span{font-size:.6rem;color:var(--c-text-muted);text-align:center}
.odds-head span:first-child{text-align:left}
.bk-name{font-size:.65rem;color:var(--c-text-muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk-odds{min-height:34px;padding:4px;border-radius:var(--radius-sm);border:1.5px solid oklch(1 0 0 / 0.12);background:transparent;color:var(--c-text);cursor:pointer;font-size:.75rem;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;transition:all .15s ease}
.bk-odds:hover{border-color:var(--c-accent);color:var(--c-accent)}
/* Paras hinta on pelkkä hintavertailun tulos, ei arvolöytö: se saa vain
   vahvemman reunan ja tähden. Väritäyttö on varattu ylikertoimille, jotta
   vihreä ruutu tarkoittaa aina positiivista odotusarvoa eikä koskaan
   "halvin kolmesta huonosta". */
.bk-odds.best{border-color:oklch(1 0 0 / 0.42);font-weight:800}
/* Ylikertoimet: keltainen = kandidaatti (edge > 3 %), vihreä = vahva (> 5 %) */
.bk-odds.value-candidate{background:oklch(0.72 0.16 85 / 0.20);border-color:oklch(0.72 0.16 85 / 0.65)}
.bk-odds.value-strong{background:oklch(0.62 0.20 145 / 0.22);border-color:oklch(0.62 0.20 145 / 0.7)}
.pk-odds{min-height:44px;padding:4px;border-radius:var(--radius-sm);border:1.5px solid oklch(1 0 0 / 0.12);background:oklch(0.62 0.20 145 / 0.12);color:var(--c-text);cursor:pointer;font-size:.75rem;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;transition:all .15s ease}
.pk-odds:hover{border-color:var(--c-accent);color:var(--c-accent)}
/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:var(--touch-target);padding:10px clamp(14px,3vw,20px);
  border-radius:var(--radius-sm);border:none;font-weight:600;cursor:pointer;
  font-size:clamp(0.75rem,1.5vw,0.85rem);
  transition:all .15s ease;
}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-elevated)}
.btn:active{transform:scale(0.97)}
.btn-primary{background:var(--c-accent);color:#000}.btn-danger{background:var(--c-danger);color:#fff}.btn-success{background:var(--c-success);color:#000}.btn-block{display:flex;width:100%}
/* Input */
.input-group{margin:8px 0}.input-group label{display:block;font-size:clamp(0.65rem,1vw,0.75rem);color:var(--c-text-muted);margin-bottom:4px}
.input-group input{width:100%;min-height:var(--touch-target);padding:8px 12px;border-radius:var(--radius-sm);border:1.5px solid oklch(1 0 0 / 0.12);background:var(--c-bg);color:var(--c-text);font-size:clamp(0.8rem,1.2vw,0.9rem);transition:border-color .15s ease}
.input-group input:focus{outline:none;border-color:var(--c-accent);box-shadow:0 0 0 3px oklch(0.62 0.18 240 / 0.2)}
/* Progress bar */
.progress-bar{height:clamp(3px,1vw,5px);background:oklch(1 0 0 / 0.08);border-radius:3px;margin-top:4px;overflow:hidden;display:flex}.progress-fill{height:100%;transition:width .3s ease}
.fill-home{background:var(--c-accent)}.fill-draw{background:var(--c-warning)}.fill-away{background:var(--c-danger)}
/* Sim game details */
.goal-list{font-size:clamp(0.65rem,1vw,0.75rem);color:var(--c-text-muted);margin-top:6px;line-height:1.6}
.penalty-row{font-size:clamp(0.6rem,1vw,0.7rem);color:var(--c-orange);margin-top:4px}
/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--c-surface);border:1px solid oklch(1 0 0 / 0.1);color:var(--c-text);padding:12px 24px;border-radius:var(--radius-pill);font-weight:600;font-size:clamp(0.75rem,1.2vw,0.85rem);z-index:9999;box-shadow:var(--shadow-elevated);animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateX(-50%) translateY(16px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
.empty{text-align:center;padding:32px 16px;color:var(--c-text-muted);font-style:italic;font-size:clamp(0.8rem,1.2vw,0.9rem)}
/* Pressure toggle */
.pressure-toggle{
  min-height:var(--touch-target);padding:6px 14px;border-radius:var(--radius-pill);
  border:1.5px dashed oklch(1 0 0 / 0.15);background:transparent;
  color:var(--c-text-muted);cursor:pointer;font-size:clamp(0.6rem,1vw,0.7rem);
  transition:all .2s ease;margin:2px;
}
.pressure-toggle:hover{border-color:var(--c-orange);color:var(--c-text)}
.pressure-toggle.active{background:var(--c-orange);color:#fff;border-color:var(--c-orange);font-weight:700;box-shadow:0 0 12px oklch(0.58 0.18 50 / 0.3)}
/* Modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:oklch(0 0 0 / 0.7);backdrop-filter:blur(4px);z-index:1000;display:none;align-items:center;justify-content:center;animation:fadeIn .2s ease}
/* a11y */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
:focus-visible{outline:2px solid var(--c-accent);outline-offset:2px}
</style>
</head>
<body>
<header class="glass-header"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h1 style="text-align:left">🏒 BetTracker <span class="demo-badge">DEMO</span></h1><button class="btn btn-danger" id="reset-header-btn" onclick="resetSimulation()" style="font-size:.6rem;padding:4px 10px;min-height:32px;white-space:nowrap" title="Nollaa kaikki — aloita alusta">🔄 Aloita alusta</button></div></header>
<div class="bankroll-bar">
  <span>💰 Kassa</span>
  <span class="bankroll-amount" id="bankroll-display">100.00 €</span>
  <button class="btn btn-primary" style="font-size:clamp(0.6rem,1vw,0.7rem);padding:4px 10px;min-height:32px" onclick="showBankrollModal()">➕</button>
</div>
<div class="tabs" id="tab-bar">
  <button class="tab active" data-tab="round">📅 Kierros</button>
  <button class="tab" data-tab="slip">🎫 Vetolappu <span id="slip-count"></span></button>
  <button class="tab" data-tab="tracker">🏒 Seuranta</button>
  <button class="tab" data-tab="history">📜 Historia</button>
  <button class="tab" data-tab="chase" data-sport="football">🔥 Jahti</button>
  <button class="tab" data-tab="teams" data-sport="hockey">📊 Joukkueet</button>
  <button class="tab" data-tab="info">ℹ️ Info</button>
  <button class="tab" data-tab="admin">⚙️ Admin</button>
</div>
<div id="round" class="view active">
  <div id="round-games" style="margin-top:2px"></div>
</div>
<div id="tracker" class="view">
  <button class="btn btn-success btn-block" onclick="runSimulation()" id="sim-btn">▶️ Simuloi kierros</button>
  <div id="tracker-list" style="margin-top:8px"></div>
  <!-- Tiketti #33: mittarit. Vain jalkapallomoduuli kirjoittaa tähän, joten
       jääkiekkotilassa kontti jää tyhjäksi. -->
  <div id="metrics-content" style="margin-top:12px"></div>
</div>
<div id="slip" class="view"><div class="grid-2" id="slip-metrics"></div><div id="slip-list"></div><button class="btn btn-danger btn-block" style="margin-top:8px" onclick="clearSlip()">🗑️ Tyhjennä lappu</button><div id="llm-content" data-sport="football" style="margin-top:10px"></div></div>
<div id="history" class="view"><div class="grid-2" id="history-metrics"></div><div id="history-list"></div></div>
<!-- Tiketti #35: tappioketju. Jalkapallo-ominaisuus, piilossa jääkiekkotilassa
     (data-sport="football" tabissa, ks. applySportVisibility). -->
<div id="chase" class="view"><div id="chase-content"></div></div>
<div id="teams" class="view"><div id="teams-list"></div></div>
<div id="info" class="view"><div id="info-content"></div></div>
<div id="admin" class="view"><div id="admin-content"></div></div>

<!-- Bankroll modal -->
<div class="modal-overlay" id="bankroll-modal">
  <div class="card" style="width:90%;max-width:360px;margin:0">

function genOddsForBookmaker(g,bk){
  const hElo=getRating(g.home_team_id)?.elo||1500,aElo=getRating(g.away_team_id)?.elo||1500;
  const hp=1/(1+Math.pow(10,(aElo-(hElo+40))/400));
  const dp=Math.max(0.12,0.26-Math.abs(hElo+40-aElo)/1500);
  const ap=Math.max(0.08,1-hp-dp);
  const profile=bookmakerProfile(bk);
  const probs=[hp,dp,ap];
  const favorite=probs.indexOf(Math.max(...probs));
  const raw=probs.map((prob,index)=>{
    const noise=(Math.random()-0.5)*2*profile.vol;
    const favoriteTax=index===favorite?profile.favoriteTax:0;
    const drawTax=index===1?profile.drawTax:0;
    const longshotTax=prob<0.22?profile.longshotTax:0;
    return prob*(1+noise+favoriteTax+drawTax+longshotTax);
  });
  const scale=(1+profile.margin)/raw.reduce((sum,value)=>sum+value,0);
  const priced=raw.map(value=>value*scale);
  return{id:Date.now()+Math.floor(Math.random()*1e9),game_id:g.id,bookmaker:bk,market:'1X2',home_odds:+(1/priced[0]).toFixed(2),draw_odds:+(1/priced[1]).toFixed(2),away_odds:+(1/priced[2]).toFixed(2),fetched_at:new Date().toISOString()};
}

    nextPreds.push({id:g.id,game_id:g.id,home_win_prob:+hp.toFixed(4),draw_prob:+dp.toFixed(4),away_win_prob:+ap.toFixed(4),predicted_winner:pw,predicted_at:new Date().toISOString(),actual_winner:null,was_correct:null});

    const gRows=nextOdds.filter(x=>x.game_id===g.id);
    const o=gRows.length?{home_odds:Math.max(...gRows.map(x=>x.home_odds)),draw_odds:Math.max(...gRows.map(x=>x.draw_odds)),away_odds:Math.max(...gRows.map(x=>x.away_odds))}:null;
    if(!o)return;
    ['home','draw','away'].forEach(side=>{
      const oddsVal=side==='home'?o.home_odds:side==='draw'?o.draw_odds:o.away_odds;
      const modelProb=side==='home'?hp:side==='draw'?dp:ap;
      const ip=(1/oddsVal)/(1/o.home_odds+1/o.draw_odds+1/o.away_odds);
      const edge=modelProb*oddsVal-1;
      if(edge>0.03)nextFlags.push({id:Date.now()+g.id+Math.random(),game_id:g.id,market:'1X2',model_prob:+modelProb.toFixed(4),implied_prob:+ip.toFixed(4),edge:+edge.toFixed(4),triggering_news_event_id:null,created_at:new Date().toISOString()});
    });
  });

  return { games: nextGames, predictions: nextPreds, oddsSnapshots: nextOdds, valueFlags: nextFlags };
}
function applyHockeyRound(index,preserveRatings){
  if(!hasHockeyRounds()||!hockeyRounds[index])return false;
  setHockeyRound(index);
  const round=hockeyRounds[index];
  if(preserveRatings){
    const dynamic=buildDynamicRoundState(round);
    games=dynamic.games;
    predictions=dynamic.predictions;
    valueFlags=dynamic.valueFlags;
    oddsSnapshots=dynamic.oddsSnapshots;
  }else{
    games=round.games.map(g=>({...g}));
    predictions=round.predictions.map(p=>({...p}));
    valueFlags=round.valueFlags.map(v=>({...v}));
    oddsSnapshots=round.oddsSnapshots.filter(x=>bookmakers.some(b=>b.name===x.bookmaker)).map(o=>({...o}));
    ratings=round.ratings.map(r=>refreshRatingDerived({...r},r.date));
  }
  news=[];
  simResults=null;
  pressureTeam='';
  return true;
}

function updateEloAfterSim(){
  if(!simResults||!simResults.length)return;
  const K=32;
  const prev = new Map();
  simResults.forEach(r=>{
    const hR=getRating(r.home_team_id);const aR=getRating(r.away_team_id);
    if(!hR||!aR)return;
    ensureRatingState(hR,new Date().toISOString().slice(0,10));
    ensureRatingState(aR,new Date().toISOString().slice(0,10));
    if(!prev.has(hR.team_id))prev.set(hR.team_id,{elo:hR.elo,pdo:hR.pdo??100});
    if(!prev.has(aR.team_id))prev.set(aR.team_id,{elo:aR.elo,pdo:aR.pdo??100});
    const E_h=1/(1+Math.pow(10,(aR.elo-(hR.elo+40))/400));
    let S_h=r.home_score>r.away_score?1:r.home_score<r.away_score?0:0.5;
    const d=K*(S_h-E_h);hR.elo+=d;aR.elo-=d;

    hR.played+=1;aR.played+=1;
    hR.goals_for+=r.home_score;hR.goals_against+=r.away_score;
    aR.goals_for+=r.away_score;aR.goals_against+=r.home_score;
    hR.shots_for=(hR.shots_for??0)+(r.shots_home||0);
    hR.shots_against=(hR.shots_against??0)+(r.shots_away||0);
    aR.shots_for=(aR.shots_for??0)+(r.shots_away||0);
    aR.shots_against=(aR.shots_against??0)+(r.shots_home||0);

    const homeWon=r.home_score>r.away_score;
    const overtime=r.period>3;
    if(!overtime){
      if(homeWon){hR.wins+=1;aR.losses+=1;}
      else if(r.away_score>r.home_score){aR.wins+=1;hR.losses+=1;}
    }else{
      if(homeWon){hR.ot_wins+=1;aR.ot_losses+=1;}
      else if(r.away_score>r.home_score){aR.ot_wins+=1;hR.ot_losses+=1;}
    }

    refreshRatingDerived(hR,new Date().toISOString().slice(0,10));
    refreshRatingDerived(aR,new Date().toISOString().slice(0,10));
    hR.elo_delta=Math.round((hR.elo-prev.get(hR.team_id).elo)*10)/10;
    aR.elo_delta=Math.round((aR.elo-prev.get(aR.team_id).elo)*10)/10;
    hR.pdo_delta=Math.round(((hR.pdo??100)-prev.get(hR.team_id).pdo)*10)/10;
    aR.pdo_delta=Math.round(((aR.pdo??100)-prev.get(aR.team_id).pdo)*10)/10;
  });
  localStorage.setItem('bt_ratings',JSON.stringify(ratings));
}

async function loadData(){
  // Tiketti #31: jalkapallotilassa jääkiekkodataa ei haeta lainkaan.
  // Olennaista: syncBookmakerOdds() jää ajamatta, joten genOddsForBookmaker()
  // ei keksi kertoimia — keksityt ja oikeat kertoimet eivät voi sekoittua.
  if(!isHockey()){
    teams=[];games=[];predictions=[];valueFlags=[];oddsSnapshots=[];ratings=[];news=[];hockeyRounds=[];
    return;
  }
  try{
    const res=await fetch('data/liiga-rounds.json',{cache:'no-store'});
    if(res.ok){
      const file=await res.json();
      if(Array.isArray(file.teams)&&Array.isArray(file.rounds)&&file.rounds.length){
        resetStaleHockeyState(file.generated_at||'unknown');
        teams=file.teams;
        hockeyRounds=file.rounds;
        const sr=localStorage.getItem('bt_ratings');
        if(sr){
          try{ratings=JSON.parse(sr).map(r=>refreshRatingDerived(r,r.date));}catch(e){ratings=[]}
        }
        const targetIndex=Math.min(Math.max(0,hockeyRoundIndex),hockeyRounds.length-1);
        if(ratings.length){if(!applyHockeyRound(targetIndex,true))applyHockeyRound(0,false);}
        else if(!applyHockeyRound(targetIndex,false))applyHockeyRound(0,false);
        return;
      }
    }
  }catch(e){
    console.warn('Liiga-kierrosdataa ei saatu ladattua, kaytetaan fallbackia');
  }
  try{
    const[g,t,p,v,o,r,n]=await Promise.all([fetch(API+'/games').then(r=>r.json()),fetch(API+'/teams').then(r=>r.json()),fetch(API+'/game_predictions').then(r=>r.json()),fetch(API+'/value_flags').then(r=>r.json()),fetch(API+'/odds_snapshots').then(r=>r.json()),fetch(API+'/team_ratings').then(r=>r.json()),fetch(API+'/news_events').then(r=>r.json())]);
    games=g;teams=t;predictions=p;valueFlags=v;oddsSnapshots=(o||[]).filter(x=>bookmakers.some(b=>b.name===x.bookmaker));ratings=r;news=n||[];
  }catch(e){
    console.warn('API unreachable, using embedded fallback data');
    const fb=FALLBACK;
    teams=fb.teams;games=fb.games;predictions=fb.predictions;valueFlags=fb.valueFlags;oddsSnapshots=[];ratings=fb.teamRatings;news=fb.newsEvents;
    const sr=localStorage.getItem('bt_ratings');if(sr)ratings=JSON.parse(sr);
  }
  syncBookmakerOdds();
}

}

function buildAnalysis(g){
  const home=teamName(g.home_team_id),away=teamName(g.away_team_id);
  const hR=getRating(g.home_team_id),aR=getRating(g.away_team_id);
  const hElo=hR?.elo||1500,aElo=aR?.elo||1500;
  const hPdo=hR?.pdo||100,aPdo=aR?.pdo||100;
  const hEloDelta=hR?.elo_delta||0,aEloDelta=aR?.elo_delta||0;
  const hPdoDelta=hR?.pdo_delta||0,aPdoDelta=aR?.pdo_delta||0;
  const hWins=(hR?.wins||0)+(hR?.ot_wins||0),aWins=(aR?.wins||0)+(aR?.ot_wins||0);
  const hRecord=`${hWins}-${hR?.ot_losses||0}-${hR?.losses||0}`;
  const aRecord=`${aWins}-${aR?.ot_losses||0}-${aR?.losses||0}`;
  const hGoals=`${hR?.goals_for||0}-${hR?.goals_against||0}`;
  const aGoals=`${aR?.goals_for||0}-${aR?.goals_against||0}`;
  const hShots=hR?.shots_for!=null&&hR?.shots_against!=null?`${hR.shots_for}-${hR.shots_against}`:'—';
  const aShots=aR?.shots_for!=null&&aR?.shots_against!=null?`${aR.shots_for}-${aR.shots_against}`:'—';
  const odds=getOdds(g.id);const pred=getPred(g.id)||{};

  const eloDiff=hElo-aElo;const hAdv=40;const totalDiff=eloDiff+hAdv;

  html+=`<div style="margin-bottom:10px;padding:10px;background:oklch(1 1 0/0.04);border-radius:8px"><h4 style="font-size:.8rem;margin-bottom:6px">📚 Dynaamiset kausitunnusluvut</h4><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:.72rem"><div style="padding:6px 8px;background:oklch(1 1 0/0.05);border-radius:8px"><div style="font-weight:700;margin-bottom:3px">${home}</div><div>Ottelut: <b>${hR?.played||0}</b></div><div>Saldo: <b>${hRecord}</b></div><div>Maalit: <b>${hGoals}</b></div><div>Laukaukset: <b>${hShots}</b></div><div>Elo Δ: <b style="color:${hEloDelta>=0?'var(--c-success)':'var(--c-danger)'}">${hEloDelta>=0?'+':''}${hEloDelta.toFixed(1)}</b></div><div>PDO Δ: <b style="color:${hPdoDelta>=0?'var(--c-success)':'var(--c-danger)'}">${hPdoDelta>=0?'+':''}${hPdoDelta.toFixed(1)}</b></div></div><div style="padding:6px 8px;background:oklch(1 1 0/0.05);border-radius:8px"><div style="font-weight:700;margin-bottom:3px">${away}</div><div>Ottelut: <b>${aR?.played||0}</b></div><div>Saldo: <b>${aRecord}</b></div><div>Maalit: <b>${aGoals}</b></div><div>Laukaukset: <b>${aShots}</b></div><div>Elo Δ: <b style="color:${aEloDelta>=0?'var(--c-success)':'var(--c-danger)'}">${aEloDelta>=0?'+':''}${aEloDelta.toFixed(1)}</b></div><div>PDO Δ: <b style="color:${aPdoDelta>=0?'var(--c-success)':'var(--c-danger)'}">${aPdoDelta>=0?'+':''}${aPdoDelta.toFixed(1)}</b></div></div></div><div style="font-size:.66rem;color:var(--c-text-muted);margin-top:6px">${esc(hR?.notes||'')} · ${esc(aR?.notes||'')}</div></div>`;
  // Section 1: Elo comparison + formula
  html+=`<div style="margin-bottom:10px;padding:10px;background:oklch(1 1 0/0.04);border-radius:8px"><h4 style="font-size:.8rem;margin-bottom:6px">📈 Elo-voimaestimaatti & voittotodennäköisyys</h4>
    <div class="row" style="font-size:.75rem;margin:4px 0"><span>${home}: <b>${hElo.toFixed(0)}</b></span><span>${away}: <b>${aElo.toFixed(0)}</b></span></div>
    <div style="font-size:.7rem;color:var(--c-text-muted);line-height:1.7;margin-top:4px">

      + kotietu H = ${hAdv} pt → kokonaisero = <b>${Math.abs(totalDiff).toFixed(0)} pt</b><br>
      <br><b>Kaava:</b> P(koti) = 1 / (1 + 10<sup>−(R<sub>K</sub>+H−R<sub>V</sub>)/400</sup>)<br>

  // Section 2: PDO
  html+=`<div style="margin-bottom:10px;padding:10px;background:oklch(1 1 0/0.04);border-radius:8px"><h4 style="font-size:.8rem;margin-bottom:6px">📉 PDO — yli-/alisuoritusindikaattori</h4>
    <div class="row" style="font-size:.75rem"><span>${home}: <b>${hPdo.toFixed(1)}</b> <span class="badge ${hPdo>102?'badge-green':hPdo<98?'badge-red':'badge-muted'}" style="font-size:.55rem">${hPdo>102?'Ylisuorittaa':hPdo<98?'Alisuorittaa':'Normaali'}</span></span><span>${away}: <b>${aPdo.toFixed(1)}</b> <span class="badge ${aPdo>102?'badge-green':aPdo<98?'badge-red':'badge-muted'}" style="font-size:.55rem">${aPdo>102?'Ylisuorittaa':aPdo<98?'Alisuorittaa':'Normaali'}</span></span></div>
    <div style="font-size:.7rem;color:var(--c-text-muted);margin-top:4px"><b>PDO = LS% + SV%</b> (laukaisuprosentti + torjuntaprosentti). Liigan keskiarvo ≈ 100.<br>Yli 102 → joukkue ylisuorittaa (todennäköinen notkahdus tulossa). Alle 98 → alisuorittaa (todennäköinen nousu).<br>PDO regressoituu <b>aina</b> kohti 100 — kyseessä on tilastollinen väistämättömyys, ei mielipide.</div>
  </div>`;
  // Section 3: Edge & value
  if(odds){
    html+=`<div style="margin-bottom:10px;padding:10px;background:oklch(1 1 0/0.04);border-radius:8px"><h4 style="font-size:.8rem;margin-bottom:6px">💰 Edge — missä markkina on väärässä?</h4>
      <div style="font-size:.7rem;color:var(--c-text-muted);margin-bottom:6px">Markkinan marginaali: <b>${margin}%</b> (kirjanpitäjän kate). Implikoitu tn = (1/kerroin) / sum(1/kertoimet).</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;font-size:.7rem;text-align:center">
        <div style="padding:4px;border-radius:4px;background:oklch(1 1 0/0.06)"><b>1 (${odds.home_odds.toFixed(1)})</b><br><span style="font-size:.6rem">Impl: ${(ipHome*100).toFixed(1)}%</span><br><span style="font-size:.6rem">Malli: ${(pHome*100).toFixed(1)}%</span><br><span style="font-weight:700;color:${edgeHome>0.03?'var(--c-success)':'var(--c-danger)'}">Edge: ${(edgeHome*100).toFixed(1)}%</span></div>
        <div style="padding:4px;border-radius:4px;background:oklch(1 1 0/0.06)"><b>X (${odds.draw_odds.toFixed(1)})</b><br><span style="font-size:.6rem">Impl: ${(ipDraw*100).toFixed(1)}%</span><br><span style="font-size:.6rem">Malli: ${(pDraw*100).toFixed(1)}%</span><br><span style="font-weight:700;color:${edgeDraw>0.03?'var(--c-success)':'var(--c-danger)'}">Edge: ${(edgeDraw*100).toFixed(1)}%</span></div>
        <div style="padding:4px;border-radius:4px;background:oklch(1 1 0/0.06)"><b>2 (${odds.away_odds.toFixed(1)})</b><br><span style="font-size:.6rem">Impl: ${(ipAway*100).toFixed(1)}%</span><br><span style="font-size:.6rem">Malli: ${(pAway*100).toFixed(1)}%</span><br><span style="font-weight:700;color:${edgeAway>0.03?'var(--c-success)':'var(--c-danger)'}">Edge: ${(edgeAway*100).toFixed(1)}%</span></div>
      </div>
      <div style="font-size:.7rem;color:var(--c-text-muted);margin-top:6px"><b>Edge = P(malli) × kerroin − 1.</b> Positiivinen arvo = markkina aliarvioi kohteen tilastollista todennäköisyyttä.<br>⏺️ Edge > 3% → ylikerroinkandidaatti 🟡<br>⏺️ Edge > 5% → vahva signaali 🟢<br>⏺️ Edge < 0% → markkina yliarvioi, ei vetoa 🔴</div>
    </div>`;
  }
  // Section 4: Injuries
  if(injuries.length){
    html+=`<div style="margin-bottom:10px;padding:10px;background:oklch(1 1 0/0.04);border-radius:8px"><h4 style="font-size:.8rem;margin-bottom:6px">🤕 Loukkaantumiset & tapahtumat</h4>`;

      html+=`<div style="font-size:.7rem;padding:4px 0;border-bottom:1px dashed oklch(1 1 0/0.1)"><b>${t}</b>: ${typeLabel} (varmuus ${(e.confidence*100).toFixed(0)}%)<br><span style="color:var(--c-text-muted);font-size:.6rem">Lähde: ${e.source_url||newsSources[Math.floor(Math.random()*newsSources.length)]}</span></div>`;
    });

  }
  // Section 5: News sources reference
  html+=`<div style="margin-bottom:10px;padding:10px;background:oklch(1 1 0/0.04);border-radius:8px"><h4 style="font-size:.8rem;margin-bottom:6px">📰 Seuratut tietolähteet</h4>

    <div style="font-size:.65rem;color:var(--c-text-muted);margin-top:4px">Uutisikkuna: jos high-confidence-uutinen (< 30 min vanha) eikä kerroin ole liikkunut → informaatioylivoima markkinaan nähden.</div>

  // Section 6: What a pro bettor tracks
  html+=`<div style="padding:10px;background:oklch(1 1 0/0.04);border-radius:8px"><h4 style="font-size:.8rem;margin-bottom:6px">🧠 Mitä ammattimainen vedonlyöjä seuraa?</h4>

function renderSimGame(r){

}

function confirmPopupBet(gid,side,odds,bkIdx){
  const stake=parseFloat(document.getElementById('popstake-'+gid)?.value||'0');
  if(!stake||stake<=0||stake>bankroll){toast('⚠️ Virheellinen panos');return}
  const bookmaker=bkIdx!=null&&bkIdx>=0?getBookmakerRows(gid)[bkIdx]?.bookmaker||null:null;
  bankroll-=stake;bets.push({id:Date.now(),game_id:gid,side,odds,stake,bookmaker});
  save();updateBankroll();renderRound();renderSlip();updateSlipBadge();
  document.getElementById('betpop-'+gid).style.display='none';
  toast(`✅ Veto: ${side.toUpperCase()} ${stake.toFixed(2)}€ @ ${odds.toFixed(2)}`)
}

function placeBet(gid,side,odds){

  const stake=parseFloat(prompt(`Panos (€) — ${side.toUpperCase()} @ ${odds.toFixed(2)}`,'10'));
  if(!stake||stake<=0||stake>bankroll){toast('⚠️ Virheellinen panos');return}
  bankroll-=stake;bets.push({id:Date.now(),game_id:gid,side,odds,stake});
  save();updateBankroll();renderSlip();updateSlipBadge();toast(`✅ Veto: ${side.toUpperCase()} ${stake.toFixed(2)}€ @ ${odds.toFixed(2)}`)
}

function runSimulation(){
  // Jalkapallon simulaatio on oma moduulinsa; se ei vaadi vetoja, koska
  // ottelutulokset ovat kiinnostavia myös ilman panosta
  if(!isHockey()){const b=document.getElementById('sim-btn');if(b)b.style.display='block';if(window.BTT)window.BTT.run();return}
  switchTab('tracker');
  const b=document.getElementById('sim-btn');
  b.textContent='🏒 Simuloidaan...';b.className='btn btn-primary btn-block';b.disabled=true;
  const upcoming=games.filter(g=>g.status==='upcoming');
  simResults=upcoming.map(g=>{
    const homeScore=g.actual_home_score??0,awayScore=g.actual_away_score??0;
    const period=g.result_type&&g.result_type!=='RT'?4:3;
    const winner=period>3?'draw':homeScore>awayScore?'home':awayScore>homeScore?'away':'draw';
    const baseShotsHome=Math.max(20,homeScore*6+18+(g.home_team_id%5));
    const baseShotsAway=Math.max(20,awayScore*6+17+(g.away_team_id%5));
    const scorers=[];
    const penalties=[];
    const homePlayers=['Lehterä','Savinainen','Tanus','Keskinen','Puhakka','Räsänen','Mäenalanen','Kemiläinen'];
    const awayPlayers=['Suomi','Ikonen','Turunen','Tyrväinen','Nurmi','Oksanen','Ruohomaa','Palve'];
    for(let i=0;i<homeScore;i++)scorers.push({player:homePlayers[i%homePlayers.length],team:teamName(g.home_team_id),period:1+Math.min(2,i%3),time:`${1+Math.min(2,i%3)}.erä ${String(4+i*3).padStart(2,'0')}:${String((i*11)%60).padStart(2,'0')}`});
    for(let i=0;i<awayScore;i++)scorers.push({player:awayPlayers[i%awayPlayers.length],team:teamName(g.away_team_id),period:1+Math.min(2,i%3),time:`${1+Math.min(2,i%3)}.erä ${String(6+i*3).padStart(2,'0')}:${String((i*13)%60).padStart(2,'0')}`});
    const penaltyReasons=['Koukkaaminen','Kampitus','Kiinnipitäminen','Poikittainen maila'];
    const penaltyCount=Math.max(1,Math.min(5,Math.abs(homeScore-awayScore)+2));
    for(let i=0;i<penaltyCount;i++)penalties.push({team_short:(i%2===0?teamName(g.home_team_id):teamName(g.away_team_id)).substring(0,3).toUpperCase(),min:2,reason:penaltyReasons[i%penaltyReasons.length]});
    const homePP=Math.max(0,Math.min(homeScore,Math.floor(homeScore/2)));
    const awayPP=Math.max(0,Math.min(awayScore,Math.floor(awayScore/2)));
    return{game_id:g.id,home_team_id:g.home_team_id,away_team_id:g.away_team_id,home_score:homeScore,away_score:awayScore,winner,period,scorers:scorers.sort((a,b)=>a.period-b.period),penalties,shots_home:baseShotsHome,shots_away:baseShotsAway,pp_chances_home:homePP+1,pp_chances_away:awayPP+1,pp_goals_home:homePP,pp_goals_away:awayPP};
  });
  renderTrackerLive();
  resolveBets();updateEloAfterSim();save();
  b.textContent='🔄 Simuloi uudelleen';b.className='btn btn-primary btn-block';b.disabled=false;
  renderRoundReport();
  toast('🏒 Kierros simuloitu viime kauden oikeilla tuloksilla');
}

function renderTrackerLive(){
  let html=simResults.map(r=>{
    let card=renderSimGame(r);
    const stillLive=r.winner===null;
    // Build extras to inject before closing card div
    let extras='';
    // Quick bet buttons if still live
    if(stillLive){
      extras+=`<div style="margin-top:6px;display:flex;gap:4px"><button class="btn" style="flex:1;font-size:.6rem;padding:5px 4px;min-height:28px;background:oklch(0.62 0.18 240 / 0.2);color:var(--c-text);border-radius:6px" onclick="quickBetNextGoal(${r.game_id},'home')">⚡ ${teamName(r.home_team_id)} seuraava maali 10€</button><button class="btn" style="flex:1;font-size:.6rem;padding:5px 4px;min-height:28px;background:oklch(0.62 0.20 145 / 0.2);color:var(--c-text);border-radius:6px" onclick="quickBetNextGoal(${r.game_id},'away')">⚡ ${teamName(r.away_team_id)} seuraava maali 10€</button></div>`;
    }
    // Show bets for this game
    const gameBets=bets.filter(b=>b.game_id===r.game_id);
    if(gameBets.length){
      extras+='<div style="margin-top:4px;padding-top:4px;border-top:1px dashed oklch(1 1 0/0.1);font-size:.65rem">'+gameBets.map(b=>{
        const sl=b.side==='home'?teamName(getGame(b.game_id)?.home_team_id):b.side==='away'?teamName(getGame(b.game_id)?.away_team_id):'Tasapeli';
        const tag=b.type==='next_goal'?' ⚡':'';
        return`<div class="row"><span>🎫 ${sl}${tag} ${b.stake.toFixed(0)}€ @ ${b.odds.toFixed(2)}</span><span style="color:var(--c-success)">→ ${(b.stake*b.odds).toFixed(0)}€</span></div>`;
      }).join('')+'</div>';
    }
    if(extras){
      const idx=card.lastIndexOf('</div>');
      card=card.substring(0,idx)+extras+card.substring(idx);
    }
    return card;
  }).join('');
  document.getElementById('tracker-list').innerHTML=html;
}

function advanceRound(){
  if(hasHockeyRounds()){
    if(hockeyRoundIndex>=hockeyRounds.length-1){toast('🏁 Kausidataa ei ole enaa eteenpain');return}
    bets=bets.filter(b=>b.practice);pressureTeam='';analysisGameId=null;
    applyHockeyRound(hockeyRoundIndex+1,true);
    save();renderAll();switchTab('round');
    toast(`📅 Kierros ${hockeyRoundIndex+1} ladattu — Elo paivitetty edellisen kierroksen simulaatiosta`);
    return;
  }
  if(!simResults||!simResults.length)return;
  updateEloAfterSim();
  const nextRoundNum=(parseInt(localStorage.getItem('bt_round')||'1'))+1;
  localStorage.setItem('bt_round',String(nextRoundNum));
  // Shuffle teams for new matchups
  const teamIds=teams.map(t=>t.id);
  const shuffled=[...teamIds].sort(()=>Math.random()-0.5);
  const newGames=[];
  for(let i=0;i<5;i++){
    const hid=shuffled[i*2],aid=shuffled[i*2+1];
    if(!hid||!aid)continue;
    newGames.push({id:100+nextRoundNum*10+(i+1),date:new Date(Date.now()+86400000*(i+1)).toISOString(),home_team_id:hid,away_team_id:aid,home_score:null,away_score:null,status:'upcoming'});
  }
  // Generate new odds based on current Elo — jokaiselle toimistolle omat kertoimet
  const newOdds=[];
  newGames.forEach(g=>bookmakers.forEach(bk=>newOdds.push(genOddsForBookmaker(g,bk.name))));
  // Generate new predictions
  const newPreds=[];
  newGames.forEach(g=>{
    const hElo=getRating(g.home_team_id)?.elo||1500,aElo=getRating(g.away_team_id)?.elo||1500;
    const hp=1/(1+Math.pow(10,(aElo-(hElo+40))/400));
    const dp=Math.max(0.12,0.26-Math.abs(hElo+40-aElo)/1500);
    const ap=1-hp-dp;
    const pw=hp>ap?'home':ap>hp?'draw':'draw';
    newPreds.push({id:Date.now()+g.id+100,game_id:g.id,home_win_prob:+hp.toFixed(4),draw_prob:+dp.toFixed(4),away_win_prob:+ap.toFixed(4),predicted_winner:pw,predicted_at:new Date().toISOString(),actual_winner:null,was_correct:null});
  });
  // Generate value flags
  const newFlags=[];
  newGames.forEach(g=>{
    const gRows=newOdds.filter(x=>x.game_id===g.id);
    const o=gRows.length?{home_odds:Math.max(...gRows.map(x=>x.home_odds)),draw_odds:Math.max(...gRows.map(x=>x.draw_odds)),away_odds:Math.max(...gRows.map(x=>x.away_odds))}:null;
    const p=newPreds.find(x=>x.game_id===g.id);
    if(!o||!p)return;
    ['home','draw','away'].forEach(side=>{
      const oddsVal=side==='home'?o.home_odds:side==='draw'?o.draw_odds:o.away_odds;
      const modelProb=side==='home'?p.home_win_prob:side==='draw'?p.draw_prob:p.away_win_prob;
      const ip=(1/oddsVal)/(1/o.home_odds+1/o.draw_odds+1/o.away_odds);
      const edge=modelProb*oddsVal-1;
      if(edge>0.03)newFlags.push({id:Date.now()+g.id+200+Math.random(),game_id:g.id,market:'1X2',model_prob:+modelProb.toFixed(4),implied_prob:+ip.toFixed(4),edge:+edge.toFixed(4),triggering_news_event_id:null,created_at:new Date().toISOString()});
    });
  });
  // Replace data
  games=[...games.filter(g=>g.status==='finished'),...newGames];
  oddsSnapshots=[...oddsSnapshots.filter(o=>!newGames.some(ng=>ng.id===o.game_id)),...newOdds];
  predictions=[...predictions.filter(p=>!newGames.find(ng=>ng.id===p.game_id)),...newPreds];
  valueFlags=[...valueFlags.filter(v=>!newGames.find(ng=>ng.id===v.game_id)),...newFlags];
  simResults=null;bets=bets.filter(b=>b.practice);pressureTeam='';
  save();renderAll();switchTab('round');
  toast('📅 Kierros '+nextRoundNum+' ladattu! Uudet kertoimet jaettu, Elot päivitetty.');
}

function resetSimulation(){
  if(simInterval){clearInterval(simInterval);simInterval=null}
  if(simAdvanceTimer){clearTimeout(simAdvanceTimer);simAdvanceTimer=null}
  simResults=null;bets=[];betHistory=[];bankroll=100;pressureTeam='';
  ['bt_ratings','bt_round','bt_hockey_round'].forEach(k=>localStorage.removeItem(k));
  // Jalkapallotilassa FALLBACK-jääkiekkodataa ei palauteta eikä kertoimia keksitä
  if(isHockey()){
    hockeyRoundIndex=0;
    if(!applyHockeyRound(0)){
      const fb=FALLBACK;teams=fb.teams;games=fb.games;predictions=fb.predictions;valueFlags=fb.valueFlags;oddsSnapshots=[];ratings=fb.teamRatings;news=fb.newsEvents;
      syncBookmakerOdds();
    }
  }
  if(!isHockey()){
    localStorage.removeItem('bt_sim_results');

  if(!isHockey()&&window.BTF)window.BTF.renderPlacedBets();
  toast('🔄 Kaikki nollattu — aloitetaan alusta');
}
function simulateGame(g){
  const he=getRating(g.home_team_id)?.elo||1500,ae=getRating(g.away_team_id)?.elo||1500;
  let ha=40;if(pressureTeam===String(g.home_team_id))ha+=80;if(pressureTeam===String(g.away_team_id))ha-=80;
  const ed=he+ha-ae,hp=1/(1+Math.pow(10,-ed/400)),dp=Math.max(.12,.26-Math.abs(ed)/1500),ap=1-hp-dp;
  const r=Math.random();let w,hs,as;
  if(r<hp){w='home';hs=2+Math.floor(Math.random()*4);as=Math.floor(Math.random()*(hs-1))}
  else if(r<hp+dp){w='draw';hs=as=1+Math.floor(Math.random()*3)}
  else{w='away';as=2+Math.floor(Math.random()*4);hs=Math.floor(Math.random()*(as-1))}
  if(!hs&&!as)hs=1;hs=Math.min(hs,7);as=Math.min(as,7);
  const hp_=['Lehterä','Savinainen','Kemiläinen','Tanus','Puhakka'];const ap_=['Suomi','Turunen','Tyrväinen','Nurmi','Oksanen'];
  const scorers=[];const up=new Set();
  for(let i=0;i<hs;i++){const n=hp_[i%hp_.length];if(!up.has(n)){up.add(n);scorers.push({player:n,team:teamName(g.home_team_id),period:1+Math.floor(Math.random()*3),time:`${1+Math.floor(Math.random()*3)}.erä ${String(1+Math.floor(Math.random()*19)).padStart(2,'0')}:${String(Math.floor(Math.random()*60)).padStart(2,'0')}`})}}
  for(let i=0;i<as;i++){const n=ap_[i%ap_.length];if(!up.has(n)){up.add(n);scorers.push({player:n,team:teamName(g.away_team_id),period:1+Math.floor(Math.random()*3),time:`${1+Math.floor(Math.random()*3)}.erä ${String(1+Math.floor(Math.random()*19)).padStart(2,'0')}:${String(Math.floor(Math.random()*60)).padStart(2,'0')}`})}}
  const reasons=['Koukkaaminen','Kampitus','Kiinnipitäminen','Poikittainen maila','Korkea maila'];const np=1+Math.floor(Math.random()*5);const penalties=[];
  for(let i=0;i<np;i++)penalties.push({team_short:Math.random()>.5?teamName(g.home_team_id).substring(0,3).toUpperCase():teamName(g.away_team_id).substring(0,3).toUpperCase(),min:[2,2,2,2,5][Math.floor(Math.random()*5)],reason:reasons[Math.floor(Math.random()*reasons.length)]});
  const hn=teamName(g.home_team_id).substring(0,3);const pph=penalties.filter(p=>!p.team_short.startsWith(hn)).length,ppa=penalties.filter(p=>p.team_short.startsWith(hn)).length;
  return{game_id:g.id,home_team_id:g.home_team_id,away_team_id:g.away_team_id,home_score:hs,away_score:as,winner:w,period:3,scorers:scorers.sort((a,b)=>a.period-b.period),penalties,pp_chances_home:pph,pp_chances_away:ppa,pp_goals_home:Math.min(pph,Math.floor(Math.random()*(pph+1))),pp_goals_away:Math.min(ppa,Math.floor(Math.random()*(ppa+1))),shots_home:20+Math.floor(Math.random()*20),shots_away:20+Math.floor(Math.random()*20)}
}
function resolveBets(){
  bets.forEach(b=>{const r=simResults.find(r=>r.game_id===b.game_id);if(!r)return;const won=(b.side==='home'&&r.winner==='home')||(b.side==='away'&&r.winner==='away')||(b.side==='draw'&&r.winner==='draw');const profit=won?b.stake*b.odds:0;bankroll+=profit;betHistory.push({...b,won,profit,resolved_at:new Date().toISOString(),game_result:`${r.home_score}-${r.away_score}`})});
  bets=bets.filter(b=>b.practice)
}

const PRACTICE_MATCHES=[
  {id:'p1',league:'Eurooppa-liiga karsinnat',home:'Klaksvik',away:'Lech Poznan',time:'Tänään 21:00',odds:[4.80,4.00,1.60]},

function practiceEdge(m,side){
  const p=practiceModels[m.id]?.[side];
  if(p==null||isNaN(p))return null;
  const idx=side==='home'?0:side==='draw'?1:2;
  return p/100*m.odds[idx]-1;
}

    const cls=edge>0.05?'badge-green':edge>0.03?'badge-yellow':edge<0?'badge-red':'badge-muted';
    badge=`<span class="badge ${cls}" style="font-size:.55rem">${edge>0?'+':''}${(edge*100).toFixed(1)}%</span>`;

  if(edge==null){el.innerHTML='';return}
  const cls=edge>0.05?'badge-green':edge>0.03?'badge-yellow':edge<0?'badge-red':'badge-muted';
  el.innerHTML=`<span class="badge ${cls}" style="font-size:.55rem">${edge>0?'+':''}${(edge*100).toFixed(1)}%</span>`;
}

      <button class="btn" style="flex:1;font-size:.65rem;padding:4px;min-height:28px;background:oklch(1 1 0/0.1);color:var(--c-text)" onclick="event.stopPropagation();setStake('${mid}',10)">10€</button>
      <button class="btn" style="flex:1;font-size:.65rem;padding:4px;min-height:28px;background:oklch(1 1 0/0.1);color:var(--c-text)" onclick="event.stopPropagation();setStake('${mid}',25)">25€</button>
      <button class="btn" style="flex:1;font-size:.65rem;padding:4px;min-height:28px;background:oklch(1 1 0/0.1);color:var(--c-text)" onclick="event.stopPropagation();setStake('${mid}',100)">100€</button>
    </div>
    <div style="display:flex;gap:6px;align-items:center">
      <input type="number" id="popstake-${mid}" value="10" min="1" max="${bankroll.toFixed(0)}" style="flex:1;padding:6px;border-radius:4px;border:1px solid var(--c-text-muted);background:var(--c-bg);color:var(--c-text);font-size:.75rem;text-align:center">
      <span style="font-size:.7rem;color:var(--c-text-muted)">€</span>
      <button class="btn btn-success" style="font-size:.7rem;padding:6px 14px;min-height:36px" onclick="event.stopPropagation();confirmPracticeBet('${mid}','${side}',${odds})">✅ Veto</button>
    </div>
  </div>`;
}
function confirmPracticeBet(mid,side,odds){
  const stake=parseFloat(document.getElementById('popstake-'+mid)?.value||'0');
  if(!stake||stake<=0||stake>bankroll){toast('⚠️ Virheellinen panos');return}
  const m=PRACTICE_MATCHES.find(x=>x.id===mid);if(!m)return;
  bankroll-=stake;
  bets.push({id:Date.now(),game_id:mid,side,odds,stake,bookmaker:'Unibet',practice:true,home:m.home,away:m.away});
  save();updateBankroll();renderSlip();updateSlipBadge();
  document.getElementById('betpop-'+mid).style.display='none';
  toast(`✅ Veto: ${side.toUpperCase()} ${stake.toFixed(2)}€ @ ${odds.toFixed(2)} (Unibet)`)
}
function settlePracticeBet(betId,won){
  const b=bets.find(x=>x.id===betId);if(!b||!b.practice)return;
  const profit=won?b.stake*b.odds:0;
  bankroll+=profit;
  betHistory.push({...b,won,profit,resolved_at:new Date().toISOString(),game_result:'⚽ manuaalinen ratkaisu'});
  bets=bets.filter(x=>x.id!==betId);
  save();updateBankroll();renderSlip();updateSlipBadge();renderHistory();
  toast(won?'✅ Veto voitettu! +'+profit.toFixed(2)+'€':'❌ Veto hävitty')
}
function betSideLabel(b){if(b.practice)return b.side==='home'?b.home:b.side==='away'?b.away:'Tasapeli';const g=getGame(b.game_id);return b.side==='home'?teamName(g?.home_team_id):b.side==='away'?teamName(g?.away_team_id):'Tasapeli'}
function betTeamsLabel(b){if(b.practice)return`${b.home} vs ${b.away} ⚽`;const g=getGame(b.game_id);return`${teamNameElo(g?.home_team_id)} vs ${teamNameElo(g?.away_team_id)}`}
function saveAdmin(){localStorage.setItem('bt_supabase_url',document.getElementById('admin-supabase-url').value);localStorage.setItem('bt_supabase_key',document.getElementById('admin-supabase-key').value);localStorage.setItem('bt_odds_key',document.getElementById('admin-odds-key').value);toast('💾 Asetukset tallennettu')}
function resetAdmin(){['bt_supabase_url','bt_supabase_key','bt_odds_key'].forEach(k=>localStorage.removeItem(k));toast('🔄 Asetukset palautettu');renderAdmin()}

function toast(msg){const e=document.createElement('div');e.className='toast';e.textContent=msg;document.body.appendChild(e);setTimeout(()=>e.remove(),2000)}

function switchTab(name){
  analysisGameId=null;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelector(`[data-tab="${name}"]`).classList.add('active');document.getElementById(name).classList.add('active');
  if(name==='round')renderRound();if(name==='slip')renderSlip();if(name==='tracker')renderTracker();if(name==='history')renderHistory();if(name==='teams')renderTeams();if(name==='info')renderInfo();if(name==='admin')renderAdmin()
  if(name==='chase'&&window.BTC)window.BTC.render();
}
function renderAll(){renderRound();renderSlip();renderTracker();renderHistory();renderTeams();renderInfo();renderAdmin();updateBankroll();updateSlipBadge()}

// ─── Tiketti #31: lajilipun mukainen näkyvyys ────────────────────────────
// Jääkiekkovälilehdet piiloon jalkapallotilassa. Mitään ei poisteta —
// Admin-välilehden toggle palauttaa ne.
function applySportVisibility(){
  document.querySelectorAll('.tab[data-sport="hockey"]').forEach(t=>{t.style.display=isHockey()?'':'none'});
  // Tiketti #35: Jahti-välilehti on rakennettu jalkapallon kertoimien varaan
  // (window.BTF.getSnapshot()) — piiloon jääkiekkotilassa, ei siirretty sinne.
  document.querySelectorAll('.tab[data-sport="football"]').forEach(t=>{t.style.display=isHockey()?'none':''});
  document.querySelector('.glass-header h1').innerHTML=(isHockey()?'🏒':'⚽')+' BetTracker <span class="demo-badge">'+(isHockey()?'JÄÄKIEKKO':'DEMO')+'</span>';
  // Seuranta on molemmilla lajeilla, mutta ikoni kertoo kummasta on kyse
  const tr=document.querySelector('.tab[data-tab="tracker"]');
  if(tr)tr.textContent=(isHockey()?'🏒':'🏟️')+' Seuranta';
  // Jos aktiivinen välilehti piilotettiin, siirry Kierrokseen
  const active=document.querySelector('.tab.active');
  if(active&&active.style.display==='none')switchTab('round');
}
function setSport(sport){
  SPORT=sport;localStorage.setItem('bt_sport',sport);
  toast(sport==='hockey'?'🏒 Jääkiekkokierrokset näkyvissä':'⚽ Jalkapallo käytössä');
  // Koko sivun uudelleenlataus on tässä oikea ratkaisu: lajinvaihto muuttaa
  // sekä datalähteen että moduulien alustuksen, ja osittainen vaihto jättäisi
  // vanhaa tilaa roikkumaan.
  setTimeout(()=>location.reload(),400);
}

// Teeman vaihto on pelkkää CSS-muuttujien uudelleenmäärittelyä — ei tarvitse
// ladata sivua uudelleen tai hakea dataa uusiksi.
function setUiTheme(theme){
  UI_THEME=theme;localStorage.setItem('bt_ui_theme',theme);
  applyUiTheme();
  renderAdmin();
  toast(theme==='casino'?'🎰 Kasino-teema käytössä':'🌙 Oletusteema käytössä');
}

// ─── Silta jalkapallomoduuleille (public/app/*.js) ───────────────────────
// Kapea, dokumentoitu rajapinta. Moduulit eivät koske jääkiekkokoodiin
// eivätkä globaaleihin muuttujiin suoraan.
window.BT={
  getBankroll(){return bankroll},
  getBets(){return bets},
  addBet(bet){
    bankroll-=bet.stake;bets.push(bet);
    save();updateBankroll();renderSlip();updateSlipBadge();
  },
  /**
   * Ratkaise jalkapalloveto. simulated-lippu kulkee historiaan, jotta
   * simuloitu ja oikea tuotto voidaan erottaa tiketissä 33 — sekoitettuna
   * ROI-luku ei mittaisi mitään.
   */
  settleFootballBet(betId,won,resultLabel){
    const b=bets.find(x=>x.id===betId);
    if(!b)return;
    const profit=won?b.stake*b.odds:0;
    bankroll+=profit;
    betHistory.push({...b,won,profit,resolved_at:new Date().toISOString(),game_result:resultLabel,simulated:true});
    bets=bets.filter(x=>x.id!==betId);
    save();updateBankroll();renderSlip();updateSlipBadge();renderHistory();
  },
  toast,
  save,
  isHockey,
};

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>switchTab(t.dataset.tab)));
document.getElementById('bankroll-modal').addEventListener('click',function(e){if(e.target===this)closeBankrollModal()});

applySportVisibility();
loadData().then(()=>{renderAll();updateBankroll();updateSlipBadge()});
</script>
